<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title>設計者控制台 - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->

    <!-- Google Web Fonts -->

    <!-- Icon Font Stylesheet -->

    <!-- Supabase Auth -->

    <script src="/js/auth-middleware.js"></script>
</head>

<body>
    <!-- 共用前台導覽 -->
    <div id="site-header"></div>

    <!-- Page Header Start -->
    <div class="container-fluid page-title-bar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h3 class="mb-0 text-dark">設計者控制台</h3>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/index.html">首頁</a></li>
                        <li class="breadcrumb-item active">控制台</li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>
    <!-- Page Header End -->

    <!-- Dashboard Start -->
    <div class="container-xxl py-2">
        <div class="container">
            <!-- 歡迎區塊 -->
            <div class="row mb-3">
                <div class="col-lg-12">
                    <div class="bg-light rounded p-4">
                        <h3 class="mb-3">
                            <i class="fas fa-user-circle text-primary me-2"></i>
                            歡迎回來，<span id="clientName">載入中...</span>
                        </h3>
                        <p class="text-muted mb-0">管理您的設計資產、查看廠商搜尋狀態與對話記錄</p>
                    </div>
                </div>
            </div>

            <!-- 專案統計卡片 -->
            <div class="row g-3 mb-3" id="statsCards">
                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <div class="bg-primary bg-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:70px;height:70px;">
                                <i class="fas fa-images fa-2x text-white"></i>
                            </div>
                            <h2 class="mb-1" id="statTotal"><span class="spinner-border spinner-border-sm"></span></h2>
                            <p class="text-muted mb-0 small">設計資產總數</p>
                            <a href="/client/my-custom-products.html" class="btn btn-sm btn-outline-primary mt-2">管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <div class="bg-warning bg-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:70px;height:70px;">
                                <i class="fas fa-search fa-2x text-white"></i>
                            </div>
                            <h2 class="mb-1" id="statOpen"><span class="spinner-border spinner-border-sm"></span></h2>
                            <p class="text-muted mb-0 small">開放廠商搜尋中</p>
                            <a href="/client/my-custom-products.html" class="btn btn-sm btn-outline-warning mt-2">查看</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <div class="bg-info bg-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:70px;height:70px;">
                                <i class="fas fa-comments fa-2x text-white"></i>
                            </div>
                            <h2 class="mb-1" id="statContacts"><span class="spinner-border spinner-border-sm"></span></h2>
                            <p class="text-muted mb-0 small">廠商已聯繫次數</p>
                            <a href="/client/messages.html" class="btn btn-sm btn-outline-info mt-2">查看對話</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <div class="bg-success bg-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:70px;height:70px;">
                                <i class="fas fa-check-circle fa-2x text-white"></i>
                            </div>
                            <h2 class="mb-1" id="statRate"><span class="spinner-border spinner-border-sm"></span></h2>
                            <p class="text-muted mb-0 small">完成率</p>
                            <small class="text-muted" id="statCompleted"></small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 開放中專案列表 -->
            <div class="row mb-3">
                <div class="col-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <span class="fw-semibold"><i class="bi bi-search me-2 text-warning"></i>開放廠商搜尋中的設計</span>
                            <a href="/client/my-custom-products.html" class="btn btn-sm btn-outline-primary">全部資產</a>
                        </div>
                        <div class="card-body p-0">
                            <div id="openProjectsList">
                                <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>載入中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        <!-- 快速操作 -->
        <div class="mb-3">
            <h4 class="mb-3"><i class="fas fa-rocket text-primary me-2"></i>快速操作</h4>
            <div class="row g-3">
                <div class="col-lg-4 col-md-6">
                    <a href="my-projects.html?action=create" class="card border-0 shadow-sm text-center p-4 text-decoration-none">
                        <i class="fas fa-plus-circle fa-3x text-primary mb-3"></i>
                        <h5 class="text-dark">建立新專案</h5>
                        <p class="text-muted mb-0">開始尋找合適廠商</p>
                    </a>
                </div>
                <div class="col-lg-4 col-md-6">
                    <a href="my-projects.html" class="card border-0 shadow-sm text-center p-4 text-decoration-none">
                        <i class="fas fa-folder-open fa-3x text-success mb-3"></i>
                        <h5 class="text-dark">查看所有專案</h5>
                        <p class="text-muted mb-0">管理進行中的專案</p>
                    </a>
                </div>
                <div class="col-lg-4 col-md-6">
                    <a href="matched-experts.html" class="card border-0 shadow-sm text-center p-4 text-decoration-none">
                        <i class="fas fa-users fa-3x text-warning mb-3"></i>
                        <h5 class="text-dark">查看媒合廠商</h5>
                        <p class="text-muted mb-0">瀏覽推薦的專家</p>
                    </a>
                </div>
            </div>
        </div>

        <!-- 最近專案和媒合 -->
        <div class="row g-3 mb-3">
            <div class="col-lg-6">
                <div class="bg-light rounded p-4">
                    <h4 class="mb-3"><i class="fas fa-clock text-primary me-2"></i>最近專案</h4>
                    <div id="recentProjects">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="bg-light rounded p-4">
                    <h4 class="mb-3"><i class="fas fa-handshake text-primary me-2"></i>最新媒合</h4>
                    <div id="recentMatches">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </div>
    </div>
    <!-- Dashboard End -->
    <!-- Dashboard End -->

    <!-- 共用 Footer -->
    <div id="site-footer"></div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/wow/wow.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/counterup/counterup.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/isotope/isotope.pkgd.min.js"></script>
    <script src="/lib/lightbox/js/lightbox.min.js"></script>

    <!-- Template Javascript -->
    <script src="/js/main.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/site-footer.js"></script>
    
    <!-- Dashboard Script -->
    <script>
        let currentUser = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('=== Dashboard 初始化開始 ===');
                
                // 檢查 AuthService 是否載入
                if (!window.AuthService) {
                    console.error('❌ AuthService 未載入！');
                    window.location.href = '/login.html';
                    return;
                }
                
                console.log('✅ AuthService 已載入');
                
                // 檢查登入且 role=client（發案者）
                const ok = await AuthMiddleware.requireAuth();
                if (!ok) return;
                currentUser = await AuthService.getCurrentUser();
                console.log('👤 當前用戶:', currentUser);

                console.log('✅ 用戶已登入，載入資料...');
                
                // 顯示用戶名
                const displayName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email || '';
                const nameEl = document.getElementById('clientName');
                if (nameEl) nameEl.textContent = displayName;

                // 載入專案統計
                loadProjectStats().catch(err => console.error('❌ 專案統計載入失敗:', err));
                
                console.log('=== Dashboard 初始化完成 ===');
            } catch (error) {
                console.error('💥 初始化失敗:', error);
                document.body.innerHTML = `
                    <div class="container mt-5 text-center">
                        <h1>系統錯誤</h1>
                        <p class="text-danger">${error.message}</p>
                        <a href="/login.html" class="btn btn-primary">返回登入</a>
                    </div>
                `;
            }
        });

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await AuthService.signOut();
            window.location.href = '/index.html';
        });

        // 載入專案統計（設計者視角）
        async function loadProjectStats() {
            try {
                const session = await AuthService.getSession();
                const token = session?.access_token;
                if (!token) return;
                const r = await fetch('/api/me/project-stats', { headers: { Authorization: 'Bearer ' + token } });
                if (!r.ok) throw new Error('stats API failed');
                const { summary, projects } = await r.json();

                document.getElementById('statTotal').textContent = summary.total || 0;
                document.getElementById('statOpen').textContent = summary.openCount || 0;
                document.getElementById('statContacts').textContent = summary.totalContacts || 0;
                document.getElementById('statRate').textContent = (summary.completionRate || 0) + '%';
                const completedEl = document.getElementById('statCompleted');
                if (completedEl) completedEl.textContent = summary.completedCount + ' / ' + summary.total + ' 已完成';

                // 開放中設計列表
                const openList = document.getElementById('openProjectsList');
                const openProjects = (projects || []).filter(p => p.open);
                if (!openProjects.length) {
                    openList.innerHTML = '<div class="text-center py-4 text-muted small">目前沒有開放廠商搜尋的設計<br><a href="/client/my-custom-products.html">前往數位資產開啟</a></div>';
                } else {
                    openList.innerHTML = openProjects.map(p => `
                        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
                            <div>
                                <div class="fw-semibold small">${escHtml(p.title || '（未命名）')}</div>
                                <div class="text-muted" style="font-size:.8rem;">已有 ${p.contact_count} 位廠商聯繫</div>
                            </div>
                            <div class="d-flex gap-2">
                                <a href="/client/messages.html" class="btn btn-sm btn-outline-secondary py-0">對話</a>
                                <a href="/client/my-custom-products.html" class="btn btn-sm btn-outline-warning py-0">管理</a>
                            </div>
                        </div>`).join('');
                }
            } catch (e) {
                console.warn('專案統計載入失敗:', e);
                ['statTotal','statOpen','statContacts','statRate'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = '-';
                });
            }
        }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        // 舊統計（保留空函數避免初始化報錯）
        async function loadStatistics() {
            try {
                if (false) {
                    document.getElementById('totalUnlocks').textContent = 0;
                }
            } catch (error) {
                console.error('載入統計失敗:', error);
            }
        }

        // 舊函數保留（不再使用）
        async function loadRecentProjects() {
            const container = document.getElementById('recentProjects');
            if (container) container.innerHTML = '';
            try {
                const { data: projects, error } = await Promise.resolve({ data: [], error: null });

                if (error) {
                    console.error('查詢專案錯誤:', error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-exclamation-triangle text-warning"></i>
                            <p class="text-muted">無法載入專案資料</p>
                            <small class="text-danger d-block">${error.message}</small>
                        </div>
                    `;
                    return;
                }

                if (!projects || projects.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-folder-x"></i>
                            <p>尚無專案</p>
                            <a href="my-projects.html?action=create" class="btn btn-primary">建立第一個專案</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = projects.map(project => `
                    <a href="project-detail.html?id=${project.id}" class="list-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">${escapeHtml(project.title)}</h6>
                                <small class="text-muted">
                                    <i class="bi bi-calendar me-1"></i>
                                    ${new Date(project.created_at).toLocaleDateString('zh-TW')}
                                </small>
                            </div>
                            <span class="badge bg-${getStatusColor(project.status)}">
                                ${getStatusText(project.status)}
                            </span>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error('載入專案失敗:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-triangle text-danger"></i>
                        <p class="text-danger">系統錯誤</p>
                        <small class="text-muted">${error.message}</small>
                    </div>
                `;
            }
        }

        // 載入最新媒合
        async function loadRecentMatches() {
            const container = document.getElementById('recentMatches');
            if (container) container.innerHTML = '';
            try {
                const { data: projects, error: projectError } = await Promise.resolve({ data: [], error: null });
                if (false) await AuthService.supabase.from('projects').select('id')
                    .eq('owner_id', currentUser.id);

                if (projectError) {
                    console.error('查詢專案錯誤:', projectError);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-exclamation-triangle text-warning"></i>
                            <p class="text-muted">無法載入媒合資料</p>
                            <small class="text-danger d-block">${projectError.message}</small>
                        </div>
                    `;
                    return;
                }

                if (!projects || projects.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-people-x"></i>
                            <p>尚無媒合記錄</p>
                            <small class="text-muted">建立專案後系統將自動媒合廠商</small>
                        </div>
                    `;
                    return;
                }

                const projectIds = projects.map(p => p.id);

                const { data: matches, error } = await AuthService.supabase.from('matches')
                    .select(`
                        *,
                        expert:expert_id(email, id),
                        project:project_id(title)
                    `)
                    .in('project_id', projectIds)
                    .eq('status', 'active')
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) {
                    console.error('查詢媒合錯誤:', error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-people-x"></i>
                            <p>尚無媒合記錄</p>
                            <small class="text-muted">建立專案後系統將自動媒合廠商</small>
                        </div>
                    `;
                    return;
                }

                if (!matches || matches.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-people-x"></i>
                            <p>尚無媒合記錄</p>
                            <small class="text-muted">建立專案後系統將自動媒合廠商</small>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = matches.map(match => `
                    <div class="list-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h6 class="mb-2">${escapeHtml(match.project?.title || '未知專案')}</h6>
                                <small class="text-muted d-block mb-2">
                                    <i class="bi bi-person me-1"></i>
                                    ${escapeHtml(match.expert?.email || '未知廠商')}
                                </small>
                                <span class="badge bg-success">媒合分數: ${match.match_score}%</span>
                            </div>
                            <small class="text-muted">${new Date(match.created_at).toLocaleDateString('zh-TW')}</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('載入媒合記錄失敗:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-triangle text-danger"></i>
                        <p class="text-danger">系統錯誤</p>
                        <small class="text-muted">${error.message}</small>
                    </div>
                `;
            }
        }

        // 輔助函數
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusColor(status) {
            const colors = {
                draft: 'secondary',
                published: 'primary',
                in_progress: 'info',
                completed: 'success',
                cancelled: 'danger'
            };
            return colors[status] || 'secondary';
        }

        function getStatusText(status) {
            const texts = {
                draft: '草稿',
                published: '已發布',
                in_progress: '進行中',
                completed: '已完成',
                cancelled: '已取消'
            };
            return texts[status] || status;
        }
    </script>
</body>
</html>
