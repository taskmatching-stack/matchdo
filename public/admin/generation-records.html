<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生圖紀錄 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .rec-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid #dee2e6; cursor: pointer; }
    .rec-row { cursor: pointer; }
    .rec-row:hover td { background: #f8f9fa; }
    .badge-site { background: #7A8FA3; }
    .badge-embed { background: #6f42c1; }
    .badge-promo { background: #7A8FA3; }
    .badge-promo-camera-web { background: #fd7e14; }
    .badge-promo-camera-app { background: #e8590c; }
    pre.detail-json { font-size: 0.72rem; max-height: 240px; overflow: auto; background: #f8f9fa; padding: 0.5rem; border-radius: 6px; }
    .stat-card { border: 0; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); }
    .stat-card .stat-num { font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
    .sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
    .sortable-th .sort-icon { font-size: 0.72rem; margin-left: 0.15rem; }
    .date-group-row td { border-top: 2px solid #dee2e6; }
    .date-group-toggle { font-weight: 600; color: #495057; }
  </style>
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-1">生圖紀錄</h4>
        <p class="text-muted small mb-3">主站訂製生圖、Embed iframe 訪客生圖、產品情境圖、商攝導演（網站／App；產品／空間／人像分開統計）。主站／情境圖／商攝列可查看<strong>點閱次數</strong>（有效存取：詳情、靈感頁；不含列表滑過）。</p>

        <div class="row g-2 mb-3" id="summaryRow">
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">全部</div>
              <div class="stat-num" id="sumTotal">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">主站</div>
              <div class="stat-num text-primary" id="sumSite">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">Embed</div>
              <div class="stat-num" style="color:#6f42c1" id="sumEmbed">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-6 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">情境圖</div>
              <div class="stat-num text-success" id="sumPromo">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">商攝・產品</div>
              <div class="stat-num" style="color:#fd7e14" id="sumPromoCameraProduct">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">商攝・空間</div>
              <div class="stat-num" style="color:#e67e22" id="sumPromoCameraSpace">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">商攝・人像</div>
              <div class="stat-num" style="color:#d35400" id="sumPromoCameraPortrait">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">商攝（網站）</div>
              <div class="stat-num" style="color:#fd7e14" id="sumPromoCameraWeb">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4 col-lg">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">商攝（App）</div>
              <div class="stat-num" style="color:#e8590c" id="sumPromoCameraApp">—</div>
            </div></div>
          </div>
        </div>
        <p class="text-muted small mb-3 d-none" id="summaryFilteredHint">已輸入關鍵字時，上方統計不套用篩選；請以下方列表為準。</p>

        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-2">
                <label class="form-label small mb-1">來源</label>
                <select class="form-select form-select-sm" id="filterSource">
                  <option value="all">全部</option>
                  <option value="site">主站</option>
                  <option value="embed">Embed</option>
                  <option value="promo">情境圖</option>
                  <option value="promo_camera">商攝導演（全部）</option>
                  <option value="promo_camera_product">商攝・產品攝影</option>
                  <option value="promo_camera_space">商攝・空間攝影</option>
                  <option value="promo_camera_portrait">商攝・人像攝影</option>
                  <option value="promo_camera_web">商攝導演（網站）</option>
                  <option value="promo_camera_app">商攝導演（App）</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small mb-1">關鍵字</label>
                <input type="text" class="form-control form-control-sm" id="filterQ" placeholder="標題／描述／主題／網域">
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">起始</label>
                <input type="date" class="form-control form-control-sm" id="filterFrom">
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">結束</label>
                <input type="date" class="form-control form-control-sm" id="filterTo">
              </div>
              <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary btn-sm flex-fill" id="btnSearch"><i class="bi bi-search me-1"></i>查詢</button>
                <button class="btn btn-outline-secondary btn-sm" id="btnReset" title="清除"><i class="bi bi-x-lg"></i></button>
              </div>
              <div class="col-12">
                <div class="form-check form-check-inline mb-0">
                  <input class="form-check-input" type="checkbox" id="chkGroupByDate" checked>
                  <label class="form-check-label small" for="chkGroupByDate">依日期收折（點資料夾展開／收合）</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th style="width:36px"><input type="checkbox" class="form-check-input" id="chkAllPage" title="全選本頁"></th>
                  <th style="width:76px">成圖</th>
                  <th style="width:92px">參考圖</th>
                  <th class="sortable-th" data-sort="source" title="點擊排序">來源 <i class="bi bi-arrow-down-up sort-icon text-muted opacity-50"></i></th>
                  <th class="sortable-th" data-sort="title" title="點擊排序">標題／描述 <i class="bi bi-arrow-down-up sort-icon text-muted opacity-50"></i></th>
                  <th class="sortable-th" data-sort="owner" title="點擊排序">帳號／廠商 <i class="bi bi-arrow-down-up sort-icon text-muted opacity-50"></i></th>
                  <th class="sortable-th" data-sort="access_count" title="點擊排序">點閱 <i class="bi bi-arrow-down-up sort-icon text-muted opacity-50"></i></th>
                  <th class="sortable-th" data-sort="created_at" title="點擊排序">時間 <i class="bi bi-arrow-down sort-icon"></i></th>
                </tr>
              </thead>
              <tbody id="recordsBody">
                <tr><td colspan="8" class="text-center text-muted py-4">載入中…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2 flex-wrap gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="btnPrev" disabled>上一頁</button>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-primary btn-sm d-none" id="btnExportZip" disabled><i class="bi bi-file-zip me-1"></i>匯出選取 ZIP</button>
              <span class="small text-muted" id="pageInfo">第 1 頁</span>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="btnNext" disabled>下一頁</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title mb-0">生圖詳情</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small" id="detailBody"></div>
        <div class="modal-footer py-2" id="detailFooter">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">關閉</button>
          <button type="button" class="btn btn-outline-primary btn-sm d-none" id="btnDetailResume">履歷</button>
          <button type="button" class="btn btn-primary btn-sm d-none" id="btnDetailResumePdf">匯出 PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/auth-middleware.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/provenance-resume-ui.js?v=20260828refs1"></script>
  <script>
  (function () {
    var token = null;
    var page = 0;
    var perPage = 50;
    var hasMore = false;
    var items = [];
    var detailModal = null;
    var selectedIdx = {};
    var sortCol = 'created_at';
    var sortDir = 'desc';
    var groupByDate = true;
    var collapsedDates = {};

    function showDetailModal() {
      var el = document.getElementById('detailModal');
      if (!el) return;
      if (window.bootstrap && typeof bootstrap.Modal === 'function') {
        if (!detailModal) detailModal = new bootstrap.Modal(el);
        detailModal.show();
        return;
      }
      el.classList.add('show');
      el.style.display = 'block';
      el.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      if (!document.getElementById('detailModalBackdrop')) {
        var bd = document.createElement('div');
        bd.id = 'detailModalBackdrop';
        bd.className = 'modal-backdrop fade show';
        document.body.appendChild(bd);
        bd.addEventListener('click', hideDetailModal);
      }
    }

    function hideDetailModal() {
      var el = document.getElementById('detailModal');
      if (window.bootstrap && detailModal) {
        detailModal.hide();
        return;
      }
      if (el) {
        el.classList.remove('show');
        el.style.display = 'none';
        el.setAttribute('aria-hidden', 'true');
      }
      document.body.classList.remove('modal-open');
      var bd = document.getElementById('detailModalBackdrop');
      if (bd) bd.remove();
    }

    function mapRowToResumeItem(row) {
      if (!window.ProvenanceResumeUI || !row || !row.id) return null;
      var kind = ProvenanceResumeUI.mapRecordSourceToKind(row.source);
      return kind ? { kind: kind, id: row.id } : null;
    }

    function updateExportZipButton() {
      var btn = document.getElementById('btnExportZip');
      if (!btn) return;
      var n = Object.keys(selectedIdx).length;
      btn.classList.remove('d-none');
      btn.disabled = n <= 0;
      btn.textContent = n > 0 ? ('匯出選取 ZIP（' + n + '）') : '匯出選取 ZIP';
    }

    function toggleRowSelect(idx, on) {
      if (on) selectedIdx[String(idx)] = true;
      else delete selectedIdx[String(idx)];
      updateExportZipButton();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function loadAccessEvents(itemType, itemId) {
      var wrap = document.getElementById('accessEventsWrap');
      if (!wrap || !token) return;
      fetch('/api/admin/ugc-access-events?item_type=' + encodeURIComponent(itemType) + '&item_id=' + encodeURIComponent(itemId) + '&limit=30', {
        headers: { Authorization: 'Bearer ' + token }
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (data.unavailable) {
          wrap.innerHTML = '<p class="text-warning small mb-0">請先執行 docs/add-ugc-access-events.sql</p>';
          return;
        }
        var list = data.items || [];
        if (!list.length) {
          wrap.innerHTML = '<p class="text-muted small mb-0">尚無點閱紀錄（部署後新產生的有效存取才會記錄）</p>';
          return;
        }
        wrap.innerHTML = '<div class="table-responsive"><table class="table table-sm table-bordered mb-0"><thead><tr><th>時間</th><th>途徑</th><th>觀看者</th></tr></thead><tbody>' +
          list.map(function (ev) {
            var who = ev.viewer_user_id ? esc(ev.viewer_email || ev.viewer_name || ev.viewer_user_id) : '<span class="text-muted">匿名</span>';
            return '<tr><td class="text-nowrap small">' + esc(fmtTime(ev.accessed_at)) + '</td><td class="small">' + esc(ev.access_path_label || ev.access_path) + '</td><td class="small">' + who + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (data.total > list.length ? '<p class="text-muted small mt-1 mb-0">共 ' + data.total + ' 筆，顯示最近 ' + list.length + ' 筆</p>' : '');
      }).catch(function () {
        wrap.innerHTML = '<p class="text-danger small mb-0">載入點閱紀錄失敗</p>';
      });
    }

    function refUrlDedupKey(u) {
      u = String(u || '').trim();
      if (!u) return '';
      try {
        var parsed = new URL(u);
        return (parsed.hostname + parsed.pathname).toLowerCase();
      } catch (_) {
        return u.split('?')[0].split('#')[0].toLowerCase();
      }
    }

    function collectRowRefUrls(row) {
      var urls = [];
      var seen = {};
      function add(u) {
        u = String(u || '').trim();
        if (!u || u.indexOf('data:') === 0) return;
        var key = refUrlDedupKey(u);
        if (!key || seen[key]) return;
        seen[key] = true;
        urls.push(u);
      }
      var sources = (row && row.reference_sources) || [];
      if (sources.length) {
        sources.forEach(function (s) {
          if (!s) return;
          add(s.image_url || s.url);
        });
      } else {
        add(row && row.source_image_url);
        add(row && row.reference_image_url);
      }
      return urls;
    }

    function renderRefThumbs(row, sizePx) {
      var urls = collectRowRefUrls(row);
      var px = sizePx || 64;
      if (!urls.length) return '<span class="text-muted">—</span>';
      return urls.slice(0, 3).map(function (u) {
        return '<img src="' + esc(u) + '" class="rec-thumb" alt="參考" title="參考圖" style="width:' + px + 'px;height:' + px + 'px">';
      }).join(' ');
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch (_) { return String(iso).slice(0, 16); }
    }

    function formatRetentionMilestonesHtml(row) {
      var m = row && row.retention_milestones;
      if (!m) return '';
      var html = '<dt class="col-sm-3">留存估算</dt><dd class="col-sm-9">' + esc(m.summary || '—');
      if (m.anchor_at) html += '<div class="text-muted small">锚點：' + esc(fmtTime(m.anchor_at)) + '</div>';
      if (m.coldline_estimated_at) html += '<div class="text-muted small">預估進 Coldline：' + esc(fmtTime(m.coldline_estimated_at)) + '</div>';
      if (m.coldline_since_estimated_at) html += '<div class="text-muted small">Coldline 自：' + esc(fmtTime(m.coldline_since_estimated_at)) + '</div>';
      if (m.soft_delete_estimated_at) html += '<div class="text-muted small">預估軟刪：' + esc(fmtTime(m.soft_delete_estimated_at)) + '</div>';
      if (m.hard_delete_estimated_at) html += '<div class="text-muted small">預估硬刪：' + esc(fmtTime(m.hard_delete_estimated_at)) + '</div>';
      return html + '</dd>';
    }

    var CAMERA_CAT_LABELS = {
      camera_brand: '品牌色彩',
      film_simulation: '底片模擬',
      shooting_angle: '拍攝角度',
      aperture: '光圈',
      exposure_ev: 'EV 曝光',
      lens: '鏡頭',
      aperture_blades: '光圈葉片'
    };

    function sourceBadge(row) {
      var html = '';
      if (row.source === 'embed') html = '<span class="badge badge-embed">Embed</span>';
      else if (row.source === 'promo_camera_app') {
        var appLabel = row.shoot_mode_label ? ('商攝・' + row.shoot_mode_label + ' App') : '攝影 App';
        html = '<span class="badge badge-promo-camera-app">' + esc(appLabel) + '</span>';
      } else if (row.source === 'promo_camera_web') {
        var webLabel = row.shoot_mode_label ? ('商攝・' + row.shoot_mode_label + ' 網站') : '攝影 網站';
        html = '<span class="badge badge-promo-camera-web">' + esc(webLabel) + '</span>';
      } else if (row.source === 'promo_camera') html = '<span class="badge badge-promo-camera-web">商攝導演</span>';
      else if (row.source === 'promo') html = '<span class="badge badge-promo">情境圖</span>';
      else html = '<span class="badge badge-site">主站</span>';
      if (row.has_appeal) html += ' ' + appealBadge(row);
      return html;
    }

    function appealStatusLabel(status) {
      if (status === 'approved') return '申訴退點';
      if (status === 'rejected') return '申訴駁回';
      if (status === 'inconclusive') return '申訴未定';
      return '已申訴';
    }

    function appealBadge(row) {
      var cls = 'bg-secondary';
      if (row.appeal_status === 'approved') cls = 'bg-warning text-dark';
      else if (row.appeal_status === 'rejected') cls = 'bg-dark';
      else if (row.appeal_status === 'inconclusive') cls = 'bg-light text-dark border';
      return '<span class="badge ' + cls + '">' + esc(appealStatusLabel(row.appeal_status)) + '</span>';
    }

    function sourceLabel(row) {
      if (row.source === 'embed') return 'embed';
      if (row.source === 'promo_camera_app') return 'promo_camera_app';
      if (row.source === 'promo_camera_web') return 'promo_camera_web';
      if (row.source === 'promo_camera') return 'promo_camera';
      if (row.source === 'promo') return 'promo';
      return 'site';
    }

    function isPromoLikeSource(src) {
      return src === 'promo' || src === 'promo_camera' || src === 'promo_camera_web' || src === 'promo_camera_app';
    }

    function formatCameraParamsHtml(row) {
      var cp = row && row.camera_params;
      if (!cp || typeof cp !== 'object') return '';
      var resolved = cp.resolved && typeof cp.resolved === 'object' ? cp.resolved : {};
      var keys = Object.keys(resolved);
      if (!keys.length) return '';
      var html = '<dt class="col-sm-3">相機參數</dt><dd class="col-sm-9"><ul class="mb-0 ps-3">';
      keys.forEach(function (cat) {
        var hit = resolved[cat];
        var name = hit && (hit.name || hit.key) ? String(hit.name || hit.key) : '';
        if (!name) return;
        html += '<li>' + esc((CAMERA_CAT_LABELS[cat] || cat) + '：' + name) + '</li>';
      });
      html += '</ul></dd>';
      return html;
    }

    function fmtDateInput(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function setDefaultDateRange() {
      var today = new Date();
      var from = new Date(today);
      from.setDate(from.getDate() - 29);
      document.getElementById('filterFrom').value = fmtDateInput(from);
      document.getElementById('filterTo').value = fmtDateInput(today);
    }

    async function getToken() {
      if (token) return token;
      if (window.AuthService && typeof AuthService.getSession === 'function') {
        var s = await AuthService.getSession();
        token = s && (s.access_token || (s.session && s.session.access_token));
      }
      return token;
    }

    function renderSummary(summary) {
      summary = summary || {};
      document.getElementById('sumTotal').textContent = summary.filtered ? '—' : String(summary.total != null ? summary.total : '—');
      document.getElementById('sumSite').textContent = summary.filtered ? '—' : String(summary.site != null ? summary.site : '—');
      document.getElementById('sumEmbed').textContent = summary.filtered ? '—' : String(summary.embed != null ? summary.embed : '—');
      document.getElementById('sumPromo').textContent = summary.filtered ? '—' : String(summary.promo != null ? summary.promo : '—');
      document.getElementById('sumPromoCameraProduct').textContent = summary.filtered ? '—' : String(summary.promo_camera_product != null ? summary.promo_camera_product : '—');
      document.getElementById('sumPromoCameraSpace').textContent = summary.filtered ? '—' : String(summary.promo_camera_space != null ? summary.promo_camera_space : '—');
      document.getElementById('sumPromoCameraPortrait').textContent = summary.filtered ? '—' : String(summary.promo_camera_portrait != null ? summary.promo_camera_portrait : '—');
      document.getElementById('sumPromoCameraWeb').textContent = summary.filtered ? '—' : String(summary.promo_camera_web != null ? summary.promo_camera_web : '—');
      document.getElementById('sumPromoCameraApp').textContent = summary.filtered ? '—' : String(summary.promo_camera_app != null ? summary.promo_camera_app : '—');
      document.getElementById('summaryFilteredHint').classList.toggle('d-none', !summary.filtered);
    }

    function dateKeyFromRow(row) {
      if (!row || !row.created_at) return 'unknown';
      try {
        var d = new Date(row.created_at);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      } catch (_) {
        return 'unknown';
      }
    }

    function dateGroupLabel(key) {
      if (key === 'unknown') return '未知日期';
      try {
        var p = key.split('-');
        var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        return d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      } catch (_) {
        return key;
      }
    }

    function isDateGroupCollapsed(key, groupIndex) {
      if (collapsedDates[key] !== undefined) return !!collapsedDates[key];
      return groupIndex > 0;
    }

    function updateSortHeaders() {
      document.querySelectorAll('.sortable-th').forEach(function (th) {
        var col = th.getAttribute('data-sort');
        var icon = th.querySelector('.sort-icon');
        if (!icon) return;
        if (col === sortCol) {
          icon.className = 'bi sort-icon ' + (sortDir === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down');
          th.classList.add('table-active');
        } else {
          icon.className = 'bi sort-icon bi-arrow-down-up text-muted opacity-50';
          th.classList.remove('table-active');
        }
      });
    }

    function renderOneRow(row, idx) {
      var url = row.ai_generated_image_url || '';
      var img = url ? '<img src="' + esc(url) + '" class="rec-thumb" alt="">' : '<span class="text-muted">—</span>';
      var who = row.source === 'embed'
        ? esc(row.manufacturer_name || row.manufacturer_id || '—')
        : esc(row.owner_name || row.owner_email || row.owner_id || '—');
      var cap = esc((row.title || row.prompt || '').slice(0, 80));
      var canResume = !!mapRowToResumeItem(row);
      var chk = canResume
        ? '<input type="checkbox" class="form-check-input rec-chk" data-idx="' + idx + '">'
        : '<span class="text-muted">—</span>';
      var accessCell = '—';
      if (row.ugc_item_type) {
        var cnt = row.access_count != null ? row.access_count : '—';
        var lastAt = row.last_access_event_at || row.last_accessed_at;
        accessCell = '<div class="small">' + esc(String(cnt)) + ' 次</div>' +
          (lastAt ? '<div class="text-muted" style="font-size:0.72rem">' + esc(fmtTime(lastAt)) + '</div>' : '');
      }
      return '<tr class="rec-row" data-idx="' + idx + '"><td class="text-center">' + chk + '</td><td>' + img + '</td><td>' + renderRefThumbs(row, 64) + '</td><td>' + sourceBadge(row) + '</td>' +
        '<td><div class="text-truncate" style="max-width:280px" title="' + cap + '">' + cap + '</div></td>' +
        '<td class="small">' + who + '</td><td class="small text-nowrap">' + accessCell + '</td><td class="small text-nowrap">' + esc(fmtTime(row.created_at)) + '</td></tr>';
    }

    function bindRecordRowEvents(body) {
      body.querySelectorAll('.rec-chk').forEach(function (el) {
        el.addEventListener('click', function (ev) {
          ev.stopPropagation();
          toggleRowSelect(parseInt(el.dataset.idx, 10), el.checked);
        });
      });
      body.querySelectorAll('.rec-row').forEach(function (tr) {
        tr.addEventListener('click', function (ev) {
          if (ev.target && ev.target.classList && ev.target.classList.contains('rec-chk')) return;
          openDetail(parseInt(tr.dataset.idx, 10));
        });
      });
      body.querySelectorAll('.date-group-toggle').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var tr = btn.closest('.date-group-row');
          if (!tr) return;
          var key = tr.getAttribute('data-date-key');
          var wasCollapsed = collapsedDates[key];
          if (wasCollapsed === undefined) {
            wasCollapsed = !!btn.querySelector('.bi-folder');
          }
          collapsedDates[key] = !wasCollapsed;
          renderRows();
        });
      });
    }

    function renderRows() {
      var body = document.getElementById('recordsBody');
      selectedIdx = {};
      updateExportZipButton();
      updateSortHeaders();
      var chkAll = document.getElementById('chkAllPage');
      if (chkAll) chkAll.checked = false;
      if (!items.length) {
        body.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">無符合紀錄</td></tr>';
        return;
      }
      groupByDate = !!(document.getElementById('chkGroupByDate') && document.getElementById('chkGroupByDate').checked);
      var html = '';
      if (!groupByDate || sortCol !== 'created_at') {
        html = items.map(function (row, idx) { return renderOneRow(row, idx); }).join('');
      } else {
        var groups = {};
        var order = [];
        items.forEach(function (row, idx) {
          var k = dateKeyFromRow(row);
          if (!groups[k]) {
            groups[k] = [];
            order.push(k);
          }
          groups[k].push({ row: row, idx: idx });
        });
        order.forEach(function (k, gi) {
          var collapsed = isDateGroupCollapsed(k, gi);
          html += '<tr class="date-group-row" data-date-key="' + esc(k) + '"><td colspan="8" class="bg-light py-1 px-2">' +
            '<button type="button" class="btn btn-link btn-sm text-decoration-none p-0 date-group-toggle">' +
            '<i class="bi ' + (collapsed ? 'bi-folder' : 'bi-folder2-open') + ' me-1"></i>' +
            esc(dateGroupLabel(k)) + ' <span class="text-muted">（' + groups[k].length + ' 筆）</span></button></td></tr>';
          if (!collapsed) {
            groups[k].forEach(function (entry) {
              html += renderOneRow(entry.row, entry.idx);
            });
          }
        });
      }
      body.innerHTML = html;
      bindRecordRowEvents(body);
    }

    function openDetail(idx) {
      var row = items[idx];
      if (!row) return;
      var url = row.ai_generated_image_url || '';
      var refUrls = collectRowRefUrls(row);
      var html = '<div class="d-flex flex-wrap gap-3 mb-3">';
      html += '<div><div class="small text-muted mb-1">成圖</div>' +
        (url ? '<img src="' + esc(url) + '" class="rounded border" style="max-width:220px;max-height:220px;object-fit:contain" alt="">' : '<span class="text-muted">—</span>') +
        '</div>';
      html += '<div><div class="small text-muted mb-1">參考圖</div>';
      if (refUrls.length) {
        refUrls.forEach(function (u) {
          html += '<img src="' + esc(u) + '" class="rounded border me-1 mb-1" style="width:96px;height:96px;object-fit:cover" alt="參考">';
        });
      } else {
        html += '<p class="text-muted mb-0">無參考圖</p>';
      }
      html += '</div></div>';
      html += '<dl class="row mb-2">' +
        '<dt class="col-sm-3">來源</dt><dd class="col-sm-9">' + esc(sourceLabel(row)) + '</dd>' +
        '<dt class="col-sm-3">時間</dt><dd class="col-sm-9">' + esc(fmtTime(row.created_at)) + '</dd>' +
        '<dt class="col-sm-3">標題</dt><dd class="col-sm-9">' + esc(row.title || '—') + '</dd>' +
        '<dt class="col-sm-3">描述／Prompt</dt><dd class="col-sm-9">' + esc(row.prompt || row.generation_prompt || '—') + '</dd>';
      if (!isPromoLikeSource(row.source)) {
        html += '<dt class="col-sm-3">Seed</dt><dd class="col-sm-9">' + esc(row.generation_seed != null ? row.generation_seed : '—') + '</dd>';
      }
      if (row.source === 'site') {
        html += '<dt class="col-sm-3">owner</dt><dd class="col-sm-9">' + esc(row.owner_email || row.owner_id) + '</dd>' +
          '<dt class="col-sm-3">廠商自產</dt><dd class="col-sm-9">' + (row.is_vendor_self_serve ? '是' : '否') + '</dd>' +
          '<dt class="col-sm-3">媒體牆</dt><dd class="col-sm-9">' + (row.show_on_homepage !== false ? '是' : '否') + '</dd>';
        if (row.ugc_item_type) {
          html += '<dt class="col-sm-3">點閱次數</dt><dd class="col-sm-9">' + esc(row.access_count != null ? row.access_count : '—') + '</dd>' +
            '<dt class="col-sm-3">最後點閱</dt><dd class="col-sm-9">' + esc(fmtTime(row.last_access_event_at || row.last_accessed_at) || '—') + '</dd>' +
            '<dt class="col-sm-3">留存層級</dt><dd class="col-sm-9">' + esc(row.retention_tier || '—') + ' / ' + esc(row.storage_tier || 'standard') + '</dd>' +
            formatRetentionMilestonesHtml(row);
        }
      } else if (row.source === 'embed') {
        html += '<dt class="col-sm-3">廠商</dt><dd class="col-sm-9">' + esc(row.manufacturer_name || row.manufacturer_id) + '</dd>' +
          '<dt class="col-sm-3">來源網域</dt><dd class="col-sm-9">' + esc(row.referrer_host || '—') + '</dd>' +
          '<dt class="col-sm-3">扣點</dt><dd class="col-sm-9">' + (row.points_charged ? row.points_charged + ' 點' : '—') + '</dd>';
      } else if (isPromoLikeSource(row.source)) {
        html += '<dt class="col-sm-3">帳號</dt><dd class="col-sm-9">' + esc(row.owner_email || row.owner_id || '—') + '</dd>';
        if (row.source === 'promo_camera_web' || row.source === 'promo_camera_app' || row.source === 'promo_camera') {
          html += '<dt class="col-sm-3">入口</dt><dd class="col-sm-9">' + esc(row.client_channel || (row.source === 'promo_camera_app' ? 'app' : 'web')) + '</dd>';
          if (row.shoot_mode_label) {
            html += '<dt class="col-sm-3">攝影模式</dt><dd class="col-sm-9">' + esc(row.shoot_mode_label) + '</dd>';
          }
          if (row.space_output_type) {
            html += '<dt class="col-sm-3">空間輸出</dt><dd class="col-sm-9">' + esc(row.space_output_type) + '</dd>';
          }
        }
        html += '<dt class="col-sm-3">主題</dt><dd class="col-sm-9">' + esc(row.scene_template_key || '—') + '</dd>' +
          '<dt class="col-sm-3">場景</dt><dd class="col-sm-9">' + esc(row.scene_key || '—') + '</dd>' +
          '<dt class="col-sm-3">使用者描述</dt><dd class="col-sm-9">' + esc(row.user_prompt || '—') + '</dd>' +
          '<dt class="col-sm-3">尺寸</dt><dd class="col-sm-9">' + esc((row.width && row.height) ? (row.width + '×' + row.height + (row.aspect_ratio ? ' · ' + row.aspect_ratio : '')) : '—') + '</dd>' +
          '<dt class="col-sm-3">MP</dt><dd class="col-sm-9">' + esc(row.megapixels != null ? row.megapixels : '—') + '</dd>' +
          '<dt class="col-sm-3">參考來源</dt><dd class="col-sm-9">' + esc(row.source_type || '—') + (row.source_id ? (' · ' + esc(row.source_id)) : '') + '</dd>' +
          '<dt class="col-sm-3">扣點</dt><dd class="col-sm-9">' + (row.points_charged ? row.points_charged + ' 點' : '—') + '</dd>';
        if (row.has_appeal) {
          html += '<dt class="col-sm-3">申訴</dt><dd class="col-sm-9">' + appealBadge(row);
          if (row.appeal_refunded_points) html += '（已退 ' + esc(String(row.appeal_refunded_points)) + ' 點）';
          if (row.appeal_at) html += '<div class="text-muted small mt-1">' + esc(fmtTime(row.appeal_at)) + '</div>';
          if (row.appeal_reason_zh) html += '<div class="mt-1">' + esc(row.appeal_reason_zh) + '</div>';
          if (row.appeal_count > 1) html += '<div class="text-muted small mt-1">共 ' + esc(String(row.appeal_count)) + ' 次申訴紀錄</div>';
          html += '</dd>';
        }
        html += formatCameraParamsHtml(row);
        if (row.ugc_item_type) {
          html += '<dt class="col-sm-3">點閱次數</dt><dd class="col-sm-9">' + esc(row.access_count != null ? row.access_count : '—') + '</dd>' +
            '<dt class="col-sm-3">最後點閱</dt><dd class="col-sm-9">' + esc(fmtTime(row.last_access_event_at || row.last_accessed_at) || '—') + '</dd>' +
            '<dt class="col-sm-3">留存層級</dt><dd class="col-sm-9">' + esc(row.retention_tier || '—') + ' / ' + esc(row.storage_tier || 'standard') + '</dd>' +
            formatRetentionMilestonesHtml(row);
        }
      }
      html += '</dl>';
      if (row.ugc_item_type && row.id) {
        html += '<div class="fw-semibold mb-1 mt-2">點閱紀錄 <span class="text-muted small">（有效存取：詳情／靈感頁，不含列表滑過）</span></div>' +
          '<div id="accessEventsWrap" class="mb-3"><div class="text-muted small">載入中…</div></div>';
      }
      html += '<details class="mt-2"><summary class="small text-muted user-select-none">reference_sources（除錯）</summary><pre class="detail-json mt-1 mb-0">' +
        esc(JSON.stringify(row.reference_sources || [], null, 2)) + '</pre></details>';
      var kind = window.ProvenanceResumeUI && ProvenanceResumeUI.mapRecordSourceToKind(row.source);
      document.getElementById('detailBody').innerHTML = html;
      if (row.ugc_item_type && row.id) {
        loadAccessEvents(row.ugc_item_type, row.id);
      }
      var btnResume = document.getElementById('btnDetailResume');
      var btnPdf = document.getElementById('btnDetailResumePdf');
      if (kind && row.id) {
        btnResume.classList.remove('d-none');
        btnPdf.classList.remove('d-none');
        btnResume.onclick = function () {
          ProvenanceResumeUI.open({ kind: kind, id: row.id, admin: true });
        };
        btnPdf.onclick = function () {
          var qs = '?kind=' + encodeURIComponent(kind) + '&id=' + encodeURIComponent(row.id);
          getToken().then(function (tok) {
            if (!tok || !window.ProvenanceResumeUI) return;
            ProvenanceResumeUI.downloadPdf('/api/admin/provenance-resume/export.pdf' + qs, tok);
          });
        };
      } else {
        btnResume.classList.add('d-none');
        btnPdf.classList.add('d-none');
      }
      showDetailModal();
    }

    async function loadPage() {
      var tok = await getToken();
      if (!tok) return;
      document.getElementById('recordsBody').innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">載入中…</td></tr>';
      var qs = new URLSearchParams({
        limit: String(perPage),
        offset: String(page * perPage),
        source: document.getElementById('filterSource').value || 'all'
      });
      var q = document.getElementById('filterQ').value.trim();
      var from = document.getElementById('filterFrom').value;
      var to = document.getElementById('filterTo').value;
      if (q) qs.set('q', q);
      if (from) qs.set('from', from);
      if (to) qs.set('to', to);
      qs.set('sort', sortCol);
      qs.set('order', sortDir);
      var r = await fetch('/api/admin/generation-records?' + qs.toString(), {
        headers: { Authorization: 'Bearer ' + tok }
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        document.getElementById('recordsBody').innerHTML = '<tr><td colspan="8" class="text-danger text-center py-4">' + esc(data.error || '載入失敗') + '</td></tr>';
        return;
      }
      items = data.items || [];
      hasMore = !!data.has_more;
      renderSummary(data.summary);
      document.getElementById('pageInfo').textContent = '第 ' + (page + 1) + ' 頁' + (data.total != null ? '（本批 ' + data.total + ' 筆內）' : '');
      document.getElementById('btnPrev').disabled = page <= 0;
      document.getElementById('btnNext').disabled = !hasMore;
      renderRows();
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.sortable-th').forEach(function (th) {
        th.addEventListener('click', function () {
          var col = th.getAttribute('data-sort');
          if (!col) return;
          if (sortCol === col) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            sortCol = col;
            sortDir = (col === 'title' || col === 'owner' || col === 'source') ? 'asc' : 'desc';
          }
          page = 0;
          collapsedDates = {};
          loadPage();
        });
      });
      var chkGroup = document.getElementById('chkGroupByDate');
      if (chkGroup) {
        chkGroup.addEventListener('change', function () {
          collapsedDates = {};
          renderRows();
        });
      }
      document.getElementById('btnSearch').addEventListener('click', function () { page = 0; collapsedDates = {}; loadPage(); });
      document.getElementById('btnReset').addEventListener('click', function () {
        document.getElementById('filterSource').value = 'all';
        document.getElementById('filterQ').value = '';
        setDefaultDateRange();
        page = 0;
        collapsedDates = {};
        loadPage();
      });
      document.getElementById('btnPrev').addEventListener('click', function () { if (page > 0) { page--; collapsedDates = {}; loadPage(); } });
      document.getElementById('btnNext').addEventListener('click', function () { if (hasMore) { page++; loadPage(); } });
      document.getElementById('filterQ').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { page = 0; loadPage(); }
      });
      var chkAll = document.getElementById('chkAllPage');
      if (chkAll) {
        chkAll.addEventListener('change', function () {
          items.forEach(function (row, idx) {
            if (!mapRowToResumeItem(row)) return;
            var el = document.querySelector('.rec-chk[data-idx="' + idx + '"]');
            if (el) el.checked = chkAll.checked;
            toggleRowSelect(idx, chkAll.checked);
          });
        });
      }
      document.getElementById('btnExportZip').addEventListener('click', async function () {
        var keys = Object.keys(selectedIdx);
        if (!keys.length) return;
        var tok = await getToken();
        if (!tok) return;
        var payload = keys.map(function (k) {
          return mapRowToResumeItem(items[parseInt(k, 10)]);
        }).filter(Boolean);
        if (!payload.length) { alert('所選項目無法匯出履歷'); return; }
        var btn = document.getElementById('btnExportZip');
        btn.disabled = true;
        try {
          var r = await fetch('/api/admin/provenance-resume/export.zip', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: payload })
          });
          if (!r.ok) {
            var err = await r.json().catch(function () { return {}; });
            alert(err.error || 'ZIP 匯出失敗');
            return;
          }
          var blob = await r.blob();
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'matchdo-provenance-batch.zip';
          a.click();
          URL.revokeObjectURL(a.href);
        } finally {
          updateExportZipButton();
        }
      });
      setDefaultDateRange();
      setTimeout(loadPage, 400);
    });
  })();
  </script>
</body>
</html>
