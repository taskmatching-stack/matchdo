<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>會員結構統計 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .stat-card { border: 0; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); }
    .stat-card .stat-num { font-size: 1.35rem; font-weight: 600; line-height: 1.3; }
    .stat-card .stat-sub { font-size: 0.8rem; color: #6c757d; }
    .table-sm td, .table-sm th { white-space: nowrap; }
  </style>
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
          <div>
            <h4 class="mb-1">會員結構統計</h4>
            <p class="text-muted small mb-0">免費／付費占比、年付／月付、各等級與方案。歷月為<strong>該月底有效訂閱結構</strong>（不是當月新訂單）。不含管理員／測試員。</p>
          </div>
          <div class="d-flex gap-2 align-items-end">
            <div>
              <label class="form-label small mb-1" for="monthsSel">月份數</label>
              <select class="form-select form-select-sm" id="monthsSel">
                <option value="6">近 6 個月</option>
                <option value="12" selected>近 12 個月</option>
                <option value="24">近 24 個月</option>
              </select>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> 重新載入</button>
          </div>
        </div>

        <div id="pageMsg" class="alert d-none small py-2"></div>

        <h6 class="text-muted mb-2">目前</h6>
        <div class="row g-2 mb-3" id="currentCards"></div>

        <div class="row g-3 mb-4">
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">年付／月付／免費</h6>
                <div class="table-responsive">
                  <table class="table table-sm mb-0">
                    <thead class="table-light"><tr><th>類型</th><th class="text-end">人數</th><th class="text-end">占比</th></tr></thead>
                    <tbody id="tblBilling"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">會員等級</h6>
                <div class="table-responsive">
                  <table class="table table-sm mb-0">
                    <thead class="table-light"><tr><th>等級</th><th class="text-end">人數</th><th class="text-end">占比</th></tr></thead>
                    <tbody id="tblLevels"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">方案</h6>
                <div class="table-responsive">
                  <table class="table table-sm mb-0">
                    <thead class="table-light"><tr><th>方案</th><th class="text-end">人數</th><th class="text-end">占比</th></tr></thead>
                    <tbody id="tblPlans"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="card-title">每月會員結構</h6>
            <p class="text-muted small mb-2">當月列＝目前；其餘列＝該 UTC 月底。年付／月付依當時最近一筆已付款訂閱訂單；無訂單的付費訂閱列為「後台開通」。</p>
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th>月份</th>
                    <th class="text-end">會員</th>
                    <th class="text-end">免費</th>
                    <th class="text-end">付費</th>
                    <th class="text-end">年付</th>
                    <th class="text-end">月付</th>
                    <th class="text-end">後台開通</th>
                    <th class="text-end">一般</th>
                    <th class="text-end">進階</th>
                    <th class="text-end">尊榮</th>
                    <th class="text-end">VIP</th>
                  </tr>
                </thead>
                <tbody id="tblMonthly"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/auth-middleware.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
    (function () {
      function $(id) { return document.getElementById(id); }
      function showMsg(text, isErr) {
        var el = $('pageMsg');
        el.className = 'alert small py-2 ' + (isErr ? 'alert-danger' : 'alert-info');
        el.textContent = text;
        el.classList.remove('d-none');
      }
      function hideMsg() { $('pageMsg').classList.add('d-none'); }
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function n(v) { return (v || 0).toLocaleString(); }
      function pct(v) { return (v != null ? v : 0).toFixed(1) + '%'; }
      function cellPct(count, p) {
        return n(count) + '<div class="stat-sub">' + pct(p) + '</div>';
      }
      function levelCount(rows, name) {
        var i, row;
        for (i = 0; i < (rows || []).length; i++) {
          row = rows[i];
          if (row && row.key === name) return row;
        }
        return { count: 0, pct: 0 };
      }
      function fillKvTable(tbodyId, rows) {
        var html = '';
        (rows || []).forEach(function (r) {
          html += '<tr><td>' + esc(r.label) + '</td><td class="text-end">' + n(r.count) + '</td><td class="text-end">' + pct(r.pct) + '</td></tr>';
        });
        $(tbodyId).innerHTML = html || '<tr><td colspan="3" class="text-muted">無資料</td></tr>';
      }
      function renderCurrent(cur) {
        $('currentCards').innerHTML =
          '<div class="col-md-3 col-6"><div class="card stat-card"><div class="card-body py-2 px-3"><div class="text-muted small">會員（不含職員）</div><div class="stat-num">' + n(cur.member_count) + '</div><div class="stat-sub">職員 ' + n(cur.staff_excluded) + ' 人未列入</div></div></div></div>' +
          '<div class="col-md-3 col-6"><div class="card stat-card"><div class="card-body py-2 px-3"><div class="text-muted small">免費</div><div class="stat-num">' + n(cur.free_count) + '</div><div class="stat-sub">' + pct(cur.free_pct) + '</div></div></div></div>' +
          '<div class="col-md-3 col-6"><div class="card stat-card"><div class="card-body py-2 px-3"><div class="text-muted small">付費</div><div class="stat-num">' + n(cur.paid_count) + '</div><div class="stat-sub">' + pct(cur.paid_pct) + '</div></div></div></div>' +
          '<div class="col-md-3 col-6"><div class="card stat-card"><div class="card-body py-2 px-3"><div class="text-muted small">年付／月付</div><div class="stat-num">' + n(cur.billing.yearly.count) + ' / ' + n(cur.billing.monthly.count) + '</div><div class="stat-sub">' + pct(cur.billing.yearly.pct) + ' / ' + pct(cur.billing.monthly.pct) + '</div></div></div></div>';
        fillKvTable('tblBilling', [
          { label: '年付', count: cur.billing.yearly.count, pct: cur.billing.yearly.pct },
          { label: '月付', count: cur.billing.monthly.count, pct: cur.billing.monthly.pct },
          { label: '後台開通', count: cur.billing.paid_other.count, pct: cur.billing.paid_other.pct },
          { label: '免費', count: cur.billing.free.count, pct: cur.billing.free.pct }
        ]);
        fillKvTable('tblLevels', (cur.levels || []).map(function (r) { return { label: r.key, count: r.count, pct: r.pct }; }));
        fillKvTable('tblPlans', (cur.plans || []).map(function (r) { return { label: r.key, count: r.count, pct: r.pct }; }));
      }
      function renderMonthly(rows) {
        var html = '';
        (rows || []).forEach(function (m) {
          var g = levelCount(m.levels, '一般');
          var a = levelCount(m.levels, '進階');
          var z = levelCount(m.levels, '尊榮');
          var v = levelCount(m.levels, 'VIP');
          html += '<tr>' +
            '<td>' + esc(m.label) + '</td>' +
            '<td class="text-end">' + n(m.member_count) + '</td>' +
            '<td class="text-end">' + cellPct(m.free_count, m.free_pct) + '</td>' +
            '<td class="text-end">' + cellPct(m.paid_count, m.paid_pct) + '</td>' +
            '<td class="text-end">' + cellPct(m.billing.yearly.count, m.billing.yearly.pct) + '</td>' +
            '<td class="text-end">' + cellPct(m.billing.monthly.count, m.billing.monthly.pct) + '</td>' +
            '<td class="text-end">' + cellPct(m.billing.paid_other.count, m.billing.paid_other.pct) + '</td>' +
            '<td class="text-end">' + cellPct(g.count, g.pct) + '</td>' +
            '<td class="text-end">' + cellPct(a.count, a.pct) + '</td>' +
            '<td class="text-end">' + cellPct(z.count, z.pct) + '</td>' +
            '<td class="text-end">' + cellPct(v.count, v.pct) + '</td>' +
            '</tr>';
        });
        $('tblMonthly').innerHTML = html || '<tr><td colspan="11" class="text-muted">無資料</td></tr>';
      }
      async function load() {
        hideMsg();
        $('tblMonthly').innerHTML = '<tr><td colspan="11" class="text-muted">載入中…</td></tr>';
        try {
          if (!window.AuthService || !AuthService.getSession) throw new Error('未載入登入狀態');
          var session = await AuthService.getSession();
          var token = session && session.access_token;
          if (!token) throw new Error('請先登入管理員帳號');
          var months = $('monthsSel').value || '12';
          var res = await fetch('/api/admin/membership-structure-stats?months=' + encodeURIComponent(months), {
            headers: { Authorization: 'Bearer ' + token }
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || '載入失敗');
          renderCurrent(data.current || {});
          renderMonthly(data.monthly || []);
        } catch (e) {
          showMsg(e.message || '載入失敗', true);
          $('tblMonthly').innerHTML = '<tr><td colspan="11" class="text-danger">載入失敗</td></tr>';
        }
      }
      $('btnRefresh').addEventListener('click', load);
      $('monthsSel').addEventListener('change', load);
      load();
    })();
  </script>
</body>
</html>
