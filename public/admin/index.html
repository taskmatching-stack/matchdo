<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MATCHDO 後台儀表板</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-3">儀表板</h4>
        <p class="text-muted small mb-3">常用功能請用左側選單；以下為快速入口。</p>

        <h6 class="text-muted small text-uppercase mb-2">帳號與計費</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-users me-2 text-primary"></i>一般會員</h5>
                <p class="card-text small">帳號、身分工作區、訂閱帳期、每月消耗。</p>
                <a href="/admin/user-management.html" class="btn btn-sm btn-primary">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-coins me-2 text-primary"></i>方案／點數</h5>
                <p class="card-text small">方案價、點數規則、每月點數彙總、流水。</p>
                <a href="/admin/membership.html" class="btn btn-sm btn-primary">前往</a>
              </div>
            </div>
          </div>
        </div>

        <h6 class="text-muted small text-uppercase mb-2">廠商與供應商</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-industry me-2 text-success"></i>廠商管理</h5>
                <p class="card-text small">全部廠商、認證、訂閱。</p>
                <a href="/admin/manufacturers.html" class="btn btn-sm btn-success">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-truck me-2 text-warning"></i>產業供應商</h5>
                <p class="card-text small">B 線供應商、綁定帳號、目錄。</p>
                <a href="/admin/industry-suppliers.html" class="btn btn-sm btn-warning">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-seedling me-2 text-success"></i>種子入駐</h5>
                <p class="card-text small">種子建立、代傳素材、轉付費。</p>
                <a href="/admin/seed-vendors.html" class="btn btn-sm btn-outline-success">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-book me-2 text-primary"></i>官方版型庫</h5>
                <p class="card-text small">共用官方原型／配件／材料（無 MAP）。</p>
                <a href="/admin/official-library.html" class="btn btn-sm btn-primary">前往</a>
              </div>
            </div>
          </div>
        </div>

        <h6 class="text-muted small text-uppercase mb-2">分類與內容</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-tags me-2 text-success"></i>AI 分類</h5>
                <a href="/admin/categories.html" class="btn btn-sm btn-success">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-comments me-2 text-secondary"></i>對話紀錄</h5>
                <a href="/admin/conversations.html" class="btn btn-sm btn-outline-secondary">前往</a>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title h6"><i class="fas fa-robot me-2 text-info"></i>AI 設定</h5>
                <a href="/admin/ai-settings.html" class="btn btn-sm btn-info">前往</a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
</body>
</html>
