<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>操作介紹 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .og-tree-item { cursor: pointer; }
    .og-tree-item.active { background: #e8eef4; }
    .og-block { border: 1px solid #dee2e6; border-radius: .35rem; padding: .75rem; margin-bottom: .75rem; background: #fff; }
    .og-media-slot { border: 1px dashed #ced4da; border-radius: .3rem; padding: .5rem; background: #f8f9fa; }
    .og-media-slot img { max-height: 140px; }
    .og-env-dot { white-space: nowrap; cursor: pointer; }
    .og-text-preview { background: #fff; border: 1px solid #dee2e6; border-radius: .35rem; padding: .75rem 1rem; min-height: 10rem; max-height: 28rem; overflow: auto; }
    .og-text-preview.help-prose h2 { font-size: 1.15rem; margin-top: 1.25rem; }
    .og-text-preview.help-prose h3 { font-size: 1.05rem; margin-top: 1rem; }
    .og-text-preview.help-prose p:last-child { margin-bottom: 0; }
    .og-text-preview .og-preview-empty { color: #6c757d; font-size: .875rem; }
  </style>
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-1">操作介紹</h4>
        <p class="text-muted small mb-3">
          資料夾＝大功能，文章＝可分享的獨立網址 <code>/help/{資料夾}/{篇}</code>。
          未發佈前台 404。文字區塊右側即時預覽前台樣式；可用工具列插入標題／粗體／清單，或「套用教學範本」。
          名稱與內文請填<strong>英文欄</strong>，前台 <code>?lang=en</code> 才會顯示英文。
          圖片／GIF／YouTube 請依語系與桌面／行動各傳一檔，前台會依訪客語系與手機／電腦自動切（缺的會往下退）。圖說與文字仍只中英兩套。
          可按「翻譯成英文」，沿用 <a href="/admin/ai-settings.html">AI 設定</a> 的「Gemini 翻譯模型」。
          請先到「資料庫維護」執行 <code>help-guides</code>。
        </p>
        <div id="ogMsg" class="alert mb-3 py-2 d-none"></div>
        <div class="row">
          <div class="col-lg-4 mb-3">
            <div class="card">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>資料夾／文章</span>
                <button type="button" class="btn btn-sm btn-primary" id="btnNewFolder">新增資料夾</button>
              </div>
              <div class="card-body p-2" id="ogTree"><span class="text-muted small">載入中…</span></div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card">
              <div class="card-body" id="ogEditor">
                <p class="text-muted mb-0">請從左側選擇資料夾或文章。</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
(function () {
  var tree = [];
  var sel = { kind: '', folderId: '', pageId: '' };
  var token = '';

  function showMsg(text, isErr) {
    var el = document.getElementById('ogMsg');
    el.className = 'alert mb-3 py-2 ' + (isErr ? 'alert-danger' : 'alert-success');
    el.textContent = text;
    el.classList.remove('d-none');
  }
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var TEXT_TEMPLATES = {
    purpose: {
      text: '## 這是做什麼\n\n設計稿是訂製產品的**生圖工作區**：選分類、寫你要的成品，必要時加上參考圖或版型，再生成設計圖。列表與目錄不在這一頁。\n\n讀完這篇，你應能開啟設計頁、選分類、寫描述並完成第一次生圖。（若你寫的是別的功能，請把本段改成該功能的說明，但保留「讀完能做什麼」。）',
      text_en: '## What this is for\n\nThe design draft workspace is where you **generate product visuals**: pick a category, describe the item, add references or a template, then generate. Browsing lists happens on separate pages, not here.\n\nAfter this guide, you should be able to open the design page, pick a category, write a prompt, and run your first generation. (If you are documenting another tool, replace this paragraph but keep the outcome sentence.)'
    },
    steps: {
      text: '## 怎麼操作\n\n### 第一步：開啟設計稿\n\n1. 登入 MatchDO。\n2. 頂部選單點「客製產品」→「設計稿」，或開啟 `/custom-product.html`。\n3. 若從官方版型或廠商版型列表點「用此款進行設計」，會自動帶入該版型。\n\n### 第二步：選分類並描述\n\n1. 選**主分類**（必選）；有子分類時再選一項。\n2. 在描述欄寫外型、材質、顏色、結構（越具體越好）。\n3. 需要時在參考圖區按「＋」上傳本機圖，或點「從廠商素材庫選擇」。\n\n### 第三步：生成並儲存\n\n1. 看按鈕旁的點數（無參考／有參考可能不同，**以當頁顯示為準**）。\n2. 按「生成」，等預覽出來。\n3. 滿意後按「儲存」，設計圖會進「我的數位資產」。',
      text_en: '## How to do it\n\n### Step 1: Open the design workspace\n\n1. Sign in to MatchDO.\n2. From the menu, open **Custom product → Design draft**, or go to `/custom-product.html`.\n3. If you clicked **Design with this template** on an official or vendor template list, that template is loaded for you.\n\n### Step 2: Category and description\n\n1. Pick a **main category** (required); choose a subcategory when shown.\n2. Describe shape, materials, colors, and structure as specifically as you can.\n3. Optionally upload a local reference image, or pick from the vendor asset library.\n\n### Step 3: Generate and save\n\n1. Check the points shown beside the button (with/without references may differ—**use the on-page number**).\n2. Click generate and wait for the preview.\n3. When satisfied, save to **My digital assets**.'
    },
    notes: {
      text: '## 注意\n\n- 設計稿頁面只做**建立／編輯與生圖**，不是官方版型或廠商版型的總目錄。\n- 從廠商素材庫選圖前，請先選好**主分類**，否則可能顯示尚無素材。\n- 免費帳號可生圖（需點數），但**不能上傳**產品／素材給別人用。\n- 不想出現在首頁靈感牆，儲存時可選「不上媒體牆」。\n\n相關：[/help/design-draft/references](/help/design-draft/references)、[/help/membership/free-limits](/help/membership/free-limits)',
      text_en: '## Notes\n\n- The design page is for **creating and generating**, not for browsing the full official or vendor template catalogs.\n- Pick a **main category** before opening the vendor asset library, or you may see no assets.\n- Free accounts can generate (with points) but **cannot upload** products/assets for others.\n- To keep a design off the public inspiration wall, choose hide from wall when saving.\n\nSee also: [/help/design-draft/references](/help/design-draft/references), [/help/membership/free-limits](/help/membership/free-limits)'
    }
  };

  function defaultArticleBlocks() {
    return [
      Object.assign({ type: 'text' }, TEXT_TEMPLATES.purpose),
      { type: 'image', url: '', caption: '圖 1：設計稿主畫面（左側分類與描述、右側生成結果）', caption_en: 'Fig. 1: Design workspace main screen' },
      Object.assign({ type: 'text' }, TEXT_TEMPLATES.steps),
      { type: 'image', url: '', caption: '圖 2：參考圖區—按「＋」上傳，或「從廠商素材庫選擇」', caption_en: 'Fig. 2: Reference image area' },
      Object.assign({ type: 'text' }, TEXT_TEMPLATES.notes)
    ];
  }

  function renderSimpleMarkupPreview(md) {
    var src = String(md || '').replace(/\r\n/g, '\n');
    var lines = src.split('\n');
    var html = [];
    var list = [];
    var listTag = 'ul';
    function inlineFmt(s) {
      var e = esc(s);
      e = e.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      e = e.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
        var h = String(href || '').trim();
        if (!/^https?:\/\//i.test(h) && !/^\//.test(h)) return _;
        return '<a href="' + esc(h) + '">' + esc(label) + '</a>';
      });
      return e;
    }
    function flushList() {
      if (!list.length) return;
      html.push('<' + listTag + '>' + list.map(function (item) { return '<li>' + inlineFmt(item) + '</li>'; }).join('') + '</' + listTag + '>');
      list = [];
      listTag = 'ul';
    }
    lines.forEach(function (line) {
      var t = line.trim();
      if (!t) { flushList(); return; }
      if (/^###\s+/.test(t)) {
        flushList();
        var h3 = t.replace(/^###\s+/, '');
        html.push('<h3>' + inlineFmt(h3) + '</h3>');
        return;
      }
      if (/^##\s+/.test(t)) {
        flushList();
        var h2 = t.replace(/^##\s+/, '');
        html.push('<h2>' + inlineFmt(h2) + '</h2>');
        return;
      }
      if (/^[-*]\s+/.test(t)) {
        if (list.length && listTag !== 'ul') flushList();
        listTag = 'ul';
        list.push(t.replace(/^[-*]\s+/, ''));
        return;
      }
      if (/^\d+\.\s+/.test(t)) {
        if (list.length && listTag !== 'ol') flushList();
        listTag = 'ol';
        list.push(t.replace(/^\d+\.\s+/, ''));
        return;
      }
      flushList();
      html.push('<p>' + inlineFmt(t) + '</p>');
    });
    flushList();
    return html.join('\n');
  }

  function updateTextPreview(blockEl) {
    var ta = blockEl.querySelector('.blk-text');
    var enTa = blockEl.querySelector('.blk-text-en');
    var zhBox = blockEl.querySelector('.og-preview-zh');
    var enBox = blockEl.querySelector('.og-preview-en');
    var zh = ta ? ta.value : '';
    var en = enTa ? enTa.value : '';
    if (zhBox) {
      zhBox.innerHTML = String(zh || '').trim()
        ? renderSimpleMarkupPreview(zh)
        : '<p class="og-preview-empty mb-0">中文預覽：在左側輸入後會顯示成前台樣式</p>';
    }
    if (enBox) {
      enBox.innerHTML = String(en || '').trim()
        ? renderSimpleMarkupPreview(en)
        : '<p class="og-preview-empty mb-0">英文預覽：填英文欄或按「翻譯成英文」</p>';
    }
  }

  function insertAtCursor(textarea, snippet) {
    if (!textarea) return;
    var start = textarea.selectionStart;
    var end = textarea.selectionEnd;
    var val = textarea.value;
    textarea.value = val.slice(0, start) + snippet + val.slice(end);
    textarea.focus();
    var pos = start + snippet.length;
    textarea.setSelectionRange(pos, pos);
    updateTextPreview(textarea.closest('.og-block'));
  }

  function textToolbarHtml() {
    return '<div class="btn-toolbar flex-wrap gap-1 mb-2" role="toolbar">' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="## 這是做什麼\n\n" title="章節：用途說明">這是做什麼</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="## 怎麼操作\n\n### 第一步\n\n1. \n2. \n" title="章節：操作步驟">怎麼操作</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="## 注意\n\n- \n" title="章節：注意事項">注意</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="### 小標題\n\n" title="步驟小標">小標題</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="**粗體文字**" title="粗體">粗體</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="- 項目一\n- 項目二\n" title="項目符號">清單</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary og-fmt" data-snippet="1. 第一步\n2. 第二步\n" title="編號步驟">編號</button>' +
      '</div>';
  }

  function textEditorHtml(b) {
    return textToolbarHtml() +
      '<div class="row g-2">' +
      '<div class="col-lg-6">' +
      '<label class="form-label small mb-0">中文內文</label>' +
      '<textarea class="form-control blk-text mb-2" rows="12" placeholder="例：## 用途&#10;&#10;這篇說明如何…">' + esc(b.text || '') + '</textarea>' +
      '<label class="form-label small mb-0">英文內文</label>' +
      '<textarea class="form-control blk-text-en" rows="6" placeholder="English body (optional)">' + esc(b.text_en || '') + '</textarea>' +
      '</div>' +
      '<div class="col-lg-6">' +
      '<label class="form-label small mb-0">前台預覽（中文）</label>' +
      '<div class="og-text-preview help-prose og-preview-zh mb-2"></div>' +
      '<label class="form-label small mb-0">前台預覽（英文）</label>' +
      '<div class="og-text-preview help-prose og-preview-en"></div>' +
      '</div></div>';
  }
  async function headersJson() {
    var session = await AuthService.getSession();
    token = session && session.access_token;
    if (!token) return {};
    return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
  }
  async function api(method, url, body) {
    var h = await headersJson();
    var opt = { method: method, headers: h };
    if (body !== undefined) opt.body = JSON.stringify(body);
    var r = await fetch(url, opt);
    var data = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(data.error || '請求失敗');
    return data;
  }

  function findFolder(id) {
    return tree.find(function (f) { return f.id === id; });
  }
  function findPage(id) {
    for (var i = 0; i < tree.length; i++) {
      var p = (tree[i].pages || []).find(function (x) { return x.id === id; });
      if (p) return { folder: tree[i], page: p };
    }
    return null;
  }

  function renderTree() {
    var el = document.getElementById('ogTree');
    if (!tree.length) {
      el.innerHTML = '<p class="small text-muted mb-0 px-2">尚無資料夾。請先新增。</p>';
      return;
    }
    el.innerHTML = tree.map(function (f) {
      var open = sel.folderId === f.id;
      var pages = (f.pages || []).map(function (p) {
        var active = sel.kind === 'page' && sel.pageId === p.id ? ' active' : '';
        return '<div class="og-tree-item rounded px-2 py-1 ms-3 small' + active + '" data-kind="page" data-id="' + esc(p.id) + '">' +
          esc(p.title) + (p.is_published ? '' : ' <span class="text-muted">草稿</span>') + '</div>';
      }).join('');
      var fActive = sel.kind === 'folder' && sel.folderId === f.id ? ' active' : '';
      return '<div class="mb-2">' +
        '<div class="og-tree-item rounded px-2 py-1' + fActive + '" data-kind="folder" data-id="' + esc(f.id) + '">' +
        '<strong>' + esc(f.title) + '</strong> <span class="text-muted small">/' + esc(f.slug) + '</span>' +
        (f.is_published ? '' : ' <span class="badge bg-secondary">草稿</span>') +
        '</div>' + pages +
        '<button type="button" class="btn btn-link btn-sm py-0 ms-3 btn-new-page" data-folder="' + esc(f.id) + '">＋新增文章</button>' +
        '</div>';
    }).join('');
  }

  var MEDIA_ENVS = [
    { lang: 'zh', vp: 'desktop', img: 'url_desktop_zh', yt: 'video_id_desktop_zh', short: '桌面·中' },
    { lang: 'en', vp: 'desktop', img: 'url_desktop_en', yt: 'video_id_desktop_en', short: '桌面·英' },
    { lang: 'zh', vp: 'mobile', img: 'url_mobile_zh', yt: 'video_id_mobile_zh', short: '行動·中' },
    { lang: 'en', vp: 'mobile', img: 'url_mobile_en', yt: 'video_id_mobile_en', short: '行動·英' }
  ];

  function mediaFieldHtml(slot, url, kind) {
    var isYt = kind === 'youtube';
    var cls = isYt ? 'blk-yt' : 'blk-url';
    var ph = isYt ? 'YouTube 網址或影片 id' : '圖片網址';
    var file = isYt ? '' :
      '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="form-control form-control-sm mt-1 blk-file" data-slot="' + esc(slot) + '">';
    var preview = (!isYt && url) ? '<img src="' + esc(url) + '" alt="" class="img-fluid mt-1 rounded">' : '';
    return '<input type="text" class="form-control form-control-sm ' + cls + '" data-slot="' + esc(slot) + '" placeholder="' + ph + '" value="' + esc(url || '') + '">' +
      file + preview;
  }

  function mediaEnvEditorHtml(b, i, kind) {
    var isYt = kind === 'youtube';
    var prefix = 'og' + i + (isYt ? 'y' : 'i');
    var values = {};
    MEDIA_ENVS.forEach(function (e) {
      var key = isYt ? e.yt : e.img;
      if (isYt) {
        values[key] = (b && (b[key] || (key === 'video_id_desktop_zh' ? b.video_id : ''))) || '';
      } else {
        values[key] = (b && (b[key] || (key === 'url_desktop_zh' ? b.url : ''))) || '';
      }
    });
    var status = MEDIA_ENVS.map(function (e) {
      var key = isYt ? e.yt : e.img;
      var filled = String(values[key] || '').trim();
      return '<span class="og-env-dot me-2 small" data-slot="' + esc(key) + '">' + e.short +
        ' <span class="og-env-fill ' + (filled ? 'text-success' : 'text-muted') + '">' +
        (filled ? '已填' : '未填') + '</span></span>';
    }).join('');
    var slots = MEDIA_ENVS.map(function (e, idx) {
      var key = isYt ? e.yt : e.img;
      return '<div class="og-media-slot' + (idx === 0 ? '' : ' d-none') + '" data-slot="' + esc(key) + '">' +
        mediaFieldHtml(key, values[key], kind) + '</div>';
    }).join('');
    return '<div class="og-media-env mb-2" data-kind="' + esc(kind) + '">' +
      '<div class="d-flex flex-wrap gap-3 mb-2 align-items-center">' +
      '<div><span class="small text-muted me-1">語系</span>' +
      '<div class="btn-group btn-group-sm" role="group">' +
      '<input type="radio" class="btn-check og-env-lang" name="' + prefix + '-lang" id="' + prefix + '-lang-zh" value="zh" autocomplete="off" checked>' +
      '<label class="btn btn-outline-secondary" for="' + prefix + '-lang-zh">中文</label>' +
      '<input type="radio" class="btn-check og-env-lang" name="' + prefix + '-lang" id="' + prefix + '-lang-en" value="en" autocomplete="off">' +
      '<label class="btn btn-outline-secondary" for="' + prefix + '-lang-en">英文</label>' +
      '</div></div>' +
      '<div><span class="small text-muted me-1">畫面</span>' +
      '<div class="btn-group btn-group-sm" role="group">' +
      '<input type="radio" class="btn-check og-env-vp" name="' + prefix + '-vp" id="' + prefix + '-vp-desk" value="desktop" autocomplete="off" checked>' +
      '<label class="btn btn-outline-secondary" for="' + prefix + '-vp-desk">桌面</label>' +
      '<input type="radio" class="btn-check og-env-vp" name="' + prefix + '-vp" id="' + prefix + '-vp-mob" value="mobile" autocomplete="off">' +
      '<label class="btn btn-outline-secondary" for="' + prefix + '-vp-mob">行動</label>' +
      '</div></div></div>' +
      '<div class="mb-1">' + status + '</div>' +
      '<p class="form-text mt-0 mb-2">這是目前語系＋畫面的檔；前台會依訪客語系與手機／電腦自動切。</p>' +
      slots +
      '</div>';
  }

  function imageEditorHtml(b, i) {
    return mediaEnvEditorHtml(b, i, 'image') +
      '<input type="text" class="form-control form-control-sm mb-1 blk-caption" placeholder="圖說（中文）" value="' + esc((b && b.caption) || '') + '">' +
      '<input type="text" class="form-control form-control-sm blk-caption-en" placeholder="圖說（英文）" value="' + esc((b && b.caption_en) || '') + '">';
  }

  function youtubeEditorHtml(b, i) {
    return mediaEnvEditorHtml(b, i, 'youtube');
  }

  function blockEditorHtml(blocks) {
    return (blocks || []).map(function (b, i) {
      var type = b.type || 'text';
      return '<div class="og-block" data-i="' + i + '">' +
        '<div class="d-flex gap-2 mb-2 align-items-center">' +
        '<select class="form-select form-select-sm blk-type" style="width:8rem;">' +
        '<option value="text"' + (type === 'text' ? ' selected' : '') + '>文字</option>' +
        '<option value="image"' + (type === 'image' ? ' selected' : '') + '>圖片／GIF</option>' +
        '<option value="youtube"' + (type === 'youtube' ? ' selected' : '') + '>YouTube</option>' +
        '</select>' +
        '<button type="button" class="btn btn-sm btn-outline-secondary blk-up">上移</button>' +
        '<button type="button" class="btn btn-sm btn-outline-secondary blk-down">下移</button>' +
        '<button type="button" class="btn btn-sm btn-outline-danger ms-auto blk-del">刪</button>' +
        '</div>' +
        (type === 'text'
          ? textEditorHtml(b)
          : type === 'image' ? imageEditorHtml(b, i) : youtubeEditorHtml(b, i)) +
        '</div>';
    }).join('');
  }

  function collectBlocks() {
    var out = [];
    document.querySelectorAll('#ogEditor .og-block').forEach(function (el) {
      var type = el.querySelector('.blk-type').value;
      var val = function (sel) { var n = el.querySelector(sel); return n ? n.value : ''; };
      var slot = function (cls, key) {
        var n = el.querySelector('.' + cls + '[data-slot="' + key + '"]');
        return n ? String(n.value || '').trim() : '';
      };
      if (type === 'text') {
        out.push({ type: 'text', text: val('.blk-text'), text_en: val('.blk-text-en') });
      } else if (type === 'image') {
        var dz = slot('blk-url', 'url_desktop_zh');
        out.push({
          type: 'image',
          url: dz,
          url_desktop_zh: dz,
          url_desktop_en: slot('blk-url', 'url_desktop_en'),
          url_mobile_zh: slot('blk-url', 'url_mobile_zh'),
          url_mobile_en: slot('blk-url', 'url_mobile_en'),
          caption: val('.blk-caption'),
          caption_en: val('.blk-caption-en')
        });
      } else {
        var yz = slot('blk-yt', 'video_id_desktop_zh');
        out.push({
          type: 'youtube',
          video_id: yz,
          video_id_desktop_zh: yz,
          video_id_desktop_en: slot('blk-yt', 'video_id_desktop_en'),
          video_id_mobile_zh: slot('blk-yt', 'video_id_mobile_zh'),
          video_id_mobile_en: slot('blk-yt', 'video_id_mobile_en')
        });
      }
    });
    return out;
  }

  function envSlotKey(kind, lang, vp) {
    var prefix = kind === 'youtube' ? 'video_id_' : 'url_';
    return prefix + (vp === 'mobile' ? 'mobile_' : 'desktop_') + (lang === 'en' ? 'en' : 'zh');
  }

  function applyMediaEnv(wrap) {
    var langEl = wrap.querySelector('.og-env-lang:checked');
    var vpEl = wrap.querySelector('.og-env-vp:checked');
    var lang = langEl ? langEl.value : 'zh';
    var vp = vpEl ? vpEl.value : 'desktop';
    var slot = envSlotKey(wrap.getAttribute('data-kind'), lang, vp);
    wrap.querySelectorAll('.og-media-slot').forEach(function (s) {
      if (s.getAttribute('data-slot') === slot) s.classList.remove('d-none');
      else s.classList.add('d-none');
    });
  }

  function refreshEnvFills(wrap) {
    wrap.querySelectorAll('.og-env-dot').forEach(function (dot) {
      var key = dot.getAttribute('data-slot');
      var inp = wrap.querySelector('.blk-url[data-slot="' + key + '"], .blk-yt[data-slot="' + key + '"]');
      var filled = !!(inp && String(inp.value || '').trim());
      var mark = dot.querySelector('.og-env-fill');
      if (!mark) return;
      mark.textContent = filled ? '已填' : '未填';
      mark.className = 'og-env-fill ' + (filled ? 'text-success' : 'text-muted');
    });
  }

  function bindMediaEnv(wrap) {
    wrap.querySelectorAll('.og-env-lang, .og-env-vp').forEach(function (inp) {
      inp.onchange = function () { applyMediaEnv(wrap); };
    });
    wrap.querySelectorAll('.og-env-dot').forEach(function (dot) {
      dot.onclick = function () {
        var key = dot.getAttribute('data-slot') || '';
        var lang = /_en$/.test(key) ? 'en' : 'zh';
        var vp = /mobile/.test(key) ? 'mobile' : 'desktop';
        var langInp = wrap.querySelector('.og-env-lang[value="' + lang + '"]');
        var vpInp = wrap.querySelector('.og-env-vp[value="' + vp + '"]');
        if (langInp) langInp.checked = true;
        if (vpInp) vpInp.checked = true;
        applyMediaEnv(wrap);
      };
    });
    wrap.querySelectorAll('.blk-url, .blk-yt').forEach(function (inp) {
      inp.oninput = function () { refreshEnvFills(wrap); };
    });
  }

  function bindBlockUi() {
    document.querySelectorAll('#ogEditor .og-block').forEach(function (blockEl) {
      updateTextPreview(blockEl);
    });
    document.querySelectorAll('#ogEditor .blk-text, #ogEditor .blk-text-en').forEach(function (ta) {
      ta.oninput = function () { updateTextPreview(ta.closest('.og-block')); };
    });
    document.querySelectorAll('#ogEditor .og-fmt').forEach(function (btn) {
      btn.onclick = function () {
        var blockEl = btn.closest('.og-block');
        var ta = blockEl.querySelector('.blk-text');
        insertAtCursor(ta, btn.getAttribute('data-snippet') || '');
      };
    });
    document.querySelectorAll('#ogEditor .blk-type').forEach(function (selEl) {
      selEl.onchange = function () {
        var blocks = collectBlocks();
        document.getElementById('blocksWrap').innerHTML = blockEditorHtml(blocks);
        bindBlockUi();
      };
    });
    document.querySelectorAll('#ogEditor .blk-del').forEach(function (btn) {
      btn.onclick = function () {
        var blocks = collectBlocks();
        var i = parseInt(btn.closest('.og-block').getAttribute('data-i'), 10);
        blocks.splice(i, 1);
        document.getElementById('blocksWrap').innerHTML = blockEditorHtml(blocks);
        bindBlockUi();
      };
    });
    document.querySelectorAll('#ogEditor .blk-up').forEach(function (btn) {
      btn.onclick = function () {
        var blocks = collectBlocks();
        var i = parseInt(btn.closest('.og-block').getAttribute('data-i'), 10);
        if (i <= 0) return;
        var t = blocks[i - 1]; blocks[i - 1] = blocks[i]; blocks[i] = t;
        document.getElementById('blocksWrap').innerHTML = blockEditorHtml(blocks);
        bindBlockUi();
      };
    });
    document.querySelectorAll('#ogEditor .blk-down').forEach(function (btn) {
      btn.onclick = function () {
        var blocks = collectBlocks();
        var i = parseInt(btn.closest('.og-block').getAttribute('data-i'), 10);
        if (i >= blocks.length - 1) return;
        var t = blocks[i + 1]; blocks[i + 1] = blocks[i]; blocks[i] = t;
        document.getElementById('blocksWrap').innerHTML = blockEditorHtml(blocks);
        bindBlockUi();
      };
    });
    document.querySelectorAll('#ogEditor .og-media-env').forEach(bindMediaEnv);
    document.querySelectorAll('#ogEditor .blk-file').forEach(function (inp) {
      inp.onchange = async function () {
        if (!inp.files || !inp.files[0]) return;
        var fd = new FormData();
        fd.append('file', inp.files[0]);
        var session = await AuthService.getSession();
        var r = await fetch('/api/admin/help-guides/upload', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + (session && session.access_token) },
          body: fd
        });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) { showMsg(data.error || '上傳失敗', true); return; }
        var slot = inp.getAttribute('data-slot') || 'url_desktop_zh';
        var wrap = inp.closest('.og-media-slot') || inp.closest('.og-block');
        var target = wrap.querySelector('.blk-url[data-slot="' + slot + '"]') || wrap.querySelector('.blk-url');
        if (target) target.value = data.url;
        var img = wrap.querySelector('img');
        if (img) {
          img.src = data.url;
        } else if (wrap.classList.contains('og-media-slot')) {
          var thumb = document.createElement('img');
          thumb.src = data.url;
          thumb.alt = '';
          thumb.className = 'img-fluid mt-1 rounded';
          wrap.appendChild(thumb);
        }
        var envWrap = inp.closest('.og-media-env');
        if (envWrap) refreshEnvFills(envWrap);
        showMsg('已上傳');
      };
    });
  }

  function renderFolderEditor(f) {
    var editor = document.getElementById('ogEditor');
    editor.innerHTML =
      '<h5 class="mb-3">資料夾</h5>' +
      '<div class="row g-2 mb-2"><div class="col-md-6"><label class="form-label small">名稱</label>' +
      '<input id="fTitle" class="form-control form-control-sm" value="' + esc(f.title) + '"></div>' +
      '<div class="col-md-6"><label class="form-label small">名稱（英文）</label>' +
      '<input id="fTitleEn" class="form-control form-control-sm" value="' + esc(f.title_en || '') + '"></div></div>' +
      '<div class="row g-2 mb-2"><div class="col-md-6"><label class="form-label small">slug（網址）</label>' +
      '<input id="fSlug" class="form-control form-control-sm" value="' + esc(f.slug) + '">' +
      '<div class="form-text">/help/' + esc(f.slug) + '/</div></div>' +
      '<div class="col-md-3"><label class="form-label small">排序</label>' +
      '<input id="fSort" type="number" class="form-control form-control-sm" value="' + esc(f.sort_order) + '"></div>' +
      '<div class="col-md-3 d-flex align-items-end"><div class="form-check">' +
      '<input class="form-check-input" type="checkbox" id="fPub"' + (f.is_published ? ' checked' : '') + '>' +
      '<label class="form-check-label" for="fPub">發佈</label></div></div></div>' +
      '<div class="d-flex gap-2">' +
      '<button type="button" class="btn btn-primary btn-sm" id="btnSaveFolder">儲存</button>' +
      '<button type="button" class="btn btn-outline-primary btn-sm" id="btnTranslateFolder">翻譯成英文</button>' +
      '<a class="btn btn-outline-secondary btn-sm" target="_blank" href="/help/' + esc(f.slug) + '/">開啟前台</a>' +
      '<button type="button" class="btn btn-outline-danger btn-sm ms-auto" id="btnDelFolder">刪除資料夾</button></div>';
    document.getElementById('btnSaveFolder').onclick = async function () {
      try {
        await api('PATCH', '/api/admin/help-guides/folders/' + f.id, {
          title: document.getElementById('fTitle').value,
          title_en: document.getElementById('fTitleEn').value,
          slug: document.getElementById('fSlug').value,
          sort_order: document.getElementById('fSort').value,
          is_published: document.getElementById('fPub').checked
        });
        showMsg('已儲存');
        await loadTree(true);
      } catch (e) { showMsg(e.message, true); }
    };
    document.getElementById('btnTranslateFolder').onclick = async function () {
      var btn = document.getElementById('btnTranslateFolder');
      var titleZh = document.getElementById('fTitle').value;
      var enEl = document.getElementById('fTitleEn');
      if (!String(titleZh || '').trim()) { showMsg('請先填中文名稱', true); return; }
      if (String(enEl.value || '').trim() && !confirm('英文名稱已有內容，要覆蓋嗎？')) return;
      btn.disabled = true;
      try {
        var data = await api('POST', '/api/admin/help-guides/translate', { kind: 'folder', title: titleZh });
        enEl.value = data.title_en || '';
        showMsg('已填入英文（' + (data.model || '翻譯模型') + '），請核對後再儲存');
      } catch (e) { showMsg(e.message, true); }
      finally { btn.disabled = false; }
    };
    document.getElementById('btnDelFolder').onclick = async function () {
      if (!confirm('刪除此資料夾及底下所有文章？')) return;
      try {
        await api('DELETE', '/api/admin/help-guides/folders/' + f.id);
        sel = { kind: '', folderId: '', pageId: '' };
        document.getElementById('ogEditor').innerHTML = '<p class="text-muted mb-0">已刪除。</p>';
        await loadTree(true);
      } catch (e) { showMsg(e.message, true); }
    };
  }

  function renderPageEditor(folder, p) {
    var editor = document.getElementById('ogEditor');
    var blocks = Array.isArray(p.blocks_json) ? p.blocks_json : [];
    var preview = '/help/' + folder.slug + '/' + p.slug;
    editor.innerHTML =
      '<h5 class="mb-3">文章 · ' + esc(folder.title) + '</h5>' +
      '<div class="row g-2 mb-2"><div class="col-md-6"><label class="form-label small">標題</label>' +
      '<input id="pTitle" class="form-control form-control-sm" value="' + esc(p.title) + '"></div>' +
      '<div class="col-md-6"><label class="form-label small">標題（英文）</label>' +
      '<input id="pTitleEn" class="form-control form-control-sm" value="' + esc(p.title_en || '') + '"></div></div>' +
      '<div class="row g-2 mb-2"><div class="col-md-5"><label class="form-label small">slug</label>' +
      '<input id="pSlug" class="form-control form-control-sm" value="' + esc(p.slug) + '">' +
      '<div class="form-text">' + esc(preview) + '</div></div>' +
      '<div class="col-md-3"><label class="form-label small">排序</label>' +
      '<input id="pSort" type="number" class="form-control form-control-sm" value="' + esc(p.sort_order) + '"></div>' +
      '<div class="col-md-4 d-flex align-items-end"><div class="form-check">' +
      '<input class="form-check-input" type="checkbox" id="pPub"' + (p.is_published ? ' checked' : '') + '>' +
      '<label class="form-check-label" for="pPub">發佈</label></div></div></div>' +
      '<label class="form-label small">摘要</label><textarea id="pSummary" class="form-control form-control-sm mb-2" rows="2">' + esc(p.summary || '') + '</textarea>' +
      '<label class="form-label small">摘要（英文）</label><textarea id="pSummaryEn" class="form-control form-control-sm mb-3" rows="2">' + esc(p.summary_en || '') + '</textarea>' +
      '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">' +
      '<strong>區塊</strong>' +
      '<div class="d-flex flex-wrap gap-1">' +
      '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnTplFull">套用教學範本</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnAddTextPurpose">＋用途</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnAddTextSteps">＋操作</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnAddTextNotes">＋注意</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary" id="btnAddImage">＋圖片</button>' +
      '<button type="button" class="btn btn-sm btn-outline-primary" id="btnAddBlock">＋文字</button>' +
      '</div></div>' +
      '<div id="blocksWrap">' + blockEditorHtml(blocks) + '</div>' +
      '<div class="d-flex gap-2 mt-3">' +
      '<button type="button" class="btn btn-primary btn-sm" id="btnSavePage">儲存</button>' +
      '<button type="button" class="btn btn-outline-primary btn-sm" id="btnTranslatePage">翻譯成英文</button>' +
      '<a class="btn btn-outline-secondary btn-sm" target="_blank" href="' + esc(preview) + '">開啟前台</a>' +
      '<button type="button" class="btn btn-outline-danger btn-sm ms-auto" id="btnDelPage">刪除文章</button></div>';
    bindBlockUi();
    function addBlocks(items) {
      var blocksNow = collectBlocks();
      items.forEach(function (item) { blocksNow.push(item); });
      document.getElementById('blocksWrap').innerHTML = blockEditorHtml(blocksNow);
      bindBlockUi();
    }
    document.getElementById('btnAddBlock').onclick = function () {
      addBlocks([{ type: 'text', text: '', text_en: '' }]);
    };
    document.getElementById('btnAddTextPurpose').onclick = function () {
      addBlocks([Object.assign({ type: 'text' }, TEXT_TEMPLATES.purpose)]);
    };
    document.getElementById('btnAddTextSteps').onclick = function () {
      addBlocks([Object.assign({ type: 'text' }, TEXT_TEMPLATES.steps)]);
    };
    document.getElementById('btnAddTextNotes').onclick = function () {
      addBlocks([Object.assign({ type: 'text' }, TEXT_TEMPLATES.notes)]);
    };
    document.getElementById('btnAddImage').onclick = function () {
      addBlocks([{ type: 'image', url: '', caption: '', caption_en: '' }]);
    };
    document.getElementById('btnTplFull').onclick = function () {
      if (collectBlocks().length && !confirm('要取代目前所有區塊為教學範本嗎？')) return;
      document.getElementById('blocksWrap').innerHTML = blockEditorHtml(defaultArticleBlocks());
      bindBlockUi();
      showMsg('已套用完整範本（設計稿範例）：請改文字、上傳截圖，再儲存');
    };
    document.getElementById('btnSavePage').onclick = async function () {
      try {
        await api('PATCH', '/api/admin/help-guides/pages/' + p.id, {
          title: document.getElementById('pTitle').value,
          title_en: document.getElementById('pTitleEn').value,
          slug: document.getElementById('pSlug').value,
          sort_order: document.getElementById('pSort').value,
          is_published: document.getElementById('pPub').checked,
          summary: document.getElementById('pSummary').value,
          summary_en: document.getElementById('pSummaryEn').value,
          blocks_json: collectBlocks()
        });
        showMsg('已儲存');
        await loadTree(true);
      } catch (e) { showMsg(e.message, true); }
    };
    document.getElementById('btnTranslatePage').onclick = async function () {
      var btn = document.getElementById('btnTranslatePage');
      var titleZh = document.getElementById('pTitle').value;
      var summaryZh = document.getElementById('pSummary').value;
      var blocksNow = collectBlocks();
      var hasZh = String(titleZh || '').trim() || String(summaryZh || '').trim()
        || blocksNow.some(function (b) { return String(b.text || '').trim() || String(b.caption || '').trim(); });
      if (!hasZh) { showMsg('請先填中文標題、摘要或內文', true); return; }
      var hasEn = String(document.getElementById('pTitleEn').value || '').trim()
        || String(document.getElementById('pSummaryEn').value || '').trim()
        || blocksNow.some(function (b) { return String(b.text_en || '').trim() || String(b.caption_en || '').trim(); });
      if (hasEn && !confirm('英文欄已有內容，要覆蓋嗎？')) return;
      btn.disabled = true;
      try {
        var data = await api('POST', '/api/admin/help-guides/translate', {
          kind: 'page',
          title: titleZh,
          summary: summaryZh,
          blocks: blocksNow.map(function (b) { return { text: b.text || '', caption: b.caption || '' }; })
        });
        document.getElementById('pTitleEn').value = data.title_en || '';
        document.getElementById('pSummaryEn').value = data.summary_en || '';
        var enBlocks = Array.isArray(data.blocks) ? data.blocks : [];
        var merged = blocksNow.map(function (b, i) {
          var hit = enBlocks[i] || {};
          return Object.assign({}, b, {
            text_en: hit.text_en != null ? hit.text_en : (b.text_en || ''),
            caption_en: hit.caption_en != null ? hit.caption_en : (b.caption_en || '')
          });
        });
        document.getElementById('blocksWrap').innerHTML = blockEditorHtml(merged);
        bindBlockUi();
        showMsg('已填入英文（' + (data.model || '翻譯模型') + '），請核對後再儲存');
      } catch (e) { showMsg(e.message, true); }
      finally { btn.disabled = false; }
    };
    document.getElementById('btnDelPage').onclick = async function () {
      if (!confirm('刪除此文章？')) return;
      try {
        await api('DELETE', '/api/admin/help-guides/pages/' + p.id);
        sel = { kind: 'folder', folderId: folder.id, pageId: '' };
        await loadTree(true);
      } catch (e) { showMsg(e.message, true); }
    };
  }

  async function loadTree(keepSel) {
    var data = await api('GET', '/api/admin/help-guides');
    tree = data.folders || [];
    renderTree();
    if (keepSel && sel.kind === 'page' && sel.pageId) {
      var found = findPage(sel.pageId);
      if (found) renderPageEditor(found.folder, found.page);
      else if (sel.folderId && findFolder(sel.folderId)) renderFolderEditor(findFolder(sel.folderId));
    } else if (keepSel && sel.kind === 'folder' && sel.folderId && findFolder(sel.folderId)) {
      renderFolderEditor(findFolder(sel.folderId));
    }
  }

  document.getElementById('ogTree').addEventListener('click', function (e) {
    var pageBtn = e.target.closest('.btn-new-page');
    if (pageBtn) {
      e.preventDefault();
      var folderId = pageBtn.getAttribute('data-folder');
      (async function () {
        try {
          var created = await api('POST', '/api/admin/help-guides/pages', {
            folder_id: folderId,
            slug: 'page-' + Date.now().toString(16).slice(-6),
            title: '新文章',
            title_en: '',
            is_published: false,
            blocks_json: defaultArticleBlocks()
          });
          sel = { kind: 'page', folderId: folderId, pageId: created.page.id };
          await loadTree(true);
        } catch (err) { showMsg(err.message, true); }
      })();
      return;
    }
    var item = e.target.closest('.og-tree-item');
    if (!item) return;
    var kind = item.getAttribute('data-kind');
    var id = item.getAttribute('data-id');
    if (kind === 'folder') {
      sel = { kind: 'folder', folderId: id, pageId: '' };
      renderTree();
      renderFolderEditor(findFolder(id));
    } else {
      var found = findPage(id);
      if (!found) return;
      sel = { kind: 'page', folderId: found.folder.id, pageId: found.page.id };
      renderTree();
      renderPageEditor(found.folder, found.page);
    }
  });

  document.getElementById('btnNewFolder').onclick = async function () {
    try {
      var created = await api('POST', '/api/admin/help-guides/folders', {
        slug: 'topic-' + Date.now().toString(16).slice(-6),
        title: '新資料夾',
        title_en: '',
        sort_order: tree.length * 10,
        is_published: false
      });
      sel = { kind: 'folder', folderId: created.folder.id, pageId: '' };
      await loadTree(true);
    } catch (e) { showMsg(e.message, true); }
  };

  loadTree(false).catch(function (e) { showMsg(e.message, true); });
})();
  </script>
