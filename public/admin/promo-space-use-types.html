<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空間攝影・空間用途 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-1">空間攝影・空間用途</h4>
        <p class="text-muted small mb-3">
          對應前台「空間攝影 → Space use」下拉。請填<strong>名稱</strong>與<strong>名稱（英文）</strong>，前台 <code>?lang=en</code> 才會顯示英文。
          首次請至「資料庫維護」執行 <code>promo-space-use-types</code>，或手動跑 <code>docs/add-promo-space-use-types.sql</code>。
        </p>
        <div id="statusWrap" class="alert mb-3 py-2 d-none"><span id="statusMsg"></span></div>

        <div class="card mb-4">
          <div class="card-header fw-semibold">新增</div>
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-2"><label class="form-label small mb-0">key</label><input id="addKey" class="form-control form-control-sm" placeholder="residential" title="小寫英文＋底線"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱</label><input id="addName" class="form-control form-control-sm" placeholder="住家空間"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱（英文）</label><input id="addNameEn" class="form-control form-control-sm" placeholder="Residential"></div>
              <div class="col-md-2">
                <label class="form-label small mb-0">其他語系（選填）</label>
                <div class="d-flex flex-wrap gap-1">
                  <input id="addNameJa" class="form-control form-control-sm" style="width:72px;" placeholder="日文">
                  <input id="addNameEs" class="form-control form-control-sm" style="width:72px;" placeholder="西文">
                  <input id="addNameDe" class="form-control form-control-sm" style="width:72px;" placeholder="德文">
                  <input id="addNameFr" class="form-control form-control-sm" style="width:72px;" placeholder="法文">
                </div>
              </div>
              <div class="col-md-1"><label class="form-label small mb-0">排序</label><input id="addSort" type="number" class="form-control form-control-sm" value="80"></div>
              <div class="col-md-2"><button type="button" class="btn btn-primary btn-sm" id="btnAdd">新增</button></div>
            </div>
            <div class="row g-2 mt-1">
              <div class="col-md-4"><label class="form-label small mb-0">提示詞描述（選填）</label><input id="addLayout" class="form-control form-control-sm" placeholder="住家／住宅空間"></div>
              <div class="col-md-4"><label class="form-label small mb-0">提示詞描述（英文）</label><input id="addLayoutEn" class="form-control form-control-sm" placeholder="residential / home interior"></div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">列表</h6>
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="showInactive">
            <label class="form-check-label small" for="showInactive">顯示已停用</label>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-bordered align-middle bg-white">
            <thead class="table-light">
              <tr>
                <th>key</th>
                <th>名稱</th>
                <th>英文</th>
                <th>其他語系</th>
                <th>排序</th>
                <th>狀態</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">編輯空間用途</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editKey">
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label small">key</label><input id="editKeyShow" class="form-control form-control-sm" disabled></div>
            <div class="col-md-4"><label class="form-label small">名稱</label><input id="editName" class="form-control form-control-sm"></div>
            <div class="col-md-4"><label class="form-label small">名稱（英文）</label><input id="editNameEn" class="form-control form-control-sm"></div>
            <div class="col-12">
              <label class="form-label small">其他語系（選填）</label>
              <div class="d-flex flex-wrap gap-1">
                <input id="editNameJa" class="form-control form-control-sm" style="width:90px;" placeholder="日文">
                <input id="editNameEs" class="form-control form-control-sm" style="width:90px;" placeholder="西文">
                <input id="editNameDe" class="form-control form-control-sm" style="width:90px;" placeholder="德文">
                <input id="editNameFr" class="form-control form-control-sm" style="width:90px;" placeholder="法文">
              </div>
            </div>
            <div class="col-md-6"><label class="form-label small">提示詞描述</label><input id="editLayout" class="form-control form-control-sm"></div>
            <div class="col-md-6"><label class="form-label small">提示詞描述（英文）</label><input id="editLayoutEn" class="form-control form-control-sm"></div>
            <div class="col-md-3"><label class="form-label small">排序</label><input id="editSort" type="number" class="form-control form-control-sm"></div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="editActive" checked>
                <label class="form-check-label" for="editActive">啟用</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="btnSaveEdit">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
(function () {
  var API = '/api/admin/promo-space-use-types';
  var items = [];
  var editModal = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function setStatus(msg, ok) {
    var wrap = document.getElementById('statusWrap');
    var el = document.getElementById('statusMsg');
    if (!wrap || !el) return;
    if (!msg) { wrap.classList.add('d-none'); return; }
    wrap.className = 'alert mb-3 py-2 ' + (ok ? 'alert-success' : 'alert-danger');
    el.textContent = msg;
  }
  async function authHeaders() {
    if (!window.AuthService) return {};
    var session = await AuthService.getSession();
    var t = session && session.access_token;
    return t ? { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
  }
  function otherLangCell(row) {
    var bits = [];
    if (row.name_ja) bits.push('JA: ' + row.name_ja);
    if (row.name_es) bits.push('ES: ' + row.name_es);
    if (row.name_de) bits.push('DE: ' + row.name_de);
    if (row.name_fr) bits.push('FR: ' + row.name_fr);
    return bits.length ? esc(bits.join(' · ')) : '<span class="text-muted">—</span>';
  }
  function render() {
    var body = document.getElementById('listBody');
    if (!body) return;
    var showInactive = document.getElementById('showInactive').checked;
    var rows = items.filter(function (r) { return showInactive || r.is_active !== false; });
    body.innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td><code>' + esc(r.key) + '</code></td>' +
        '<td>' + esc(r.name) + '</td>' +
        '<td>' + (r.name_en ? esc(r.name_en) : '<span class="text-muted">未填</span>') + '</td>' +
        '<td class="small">' + otherLangCell(r) + '</td>' +
        '<td>' + esc(r.sort_order) + '</td>' +
        '<td>' + (r.is_active === false ? '<span class="text-danger">停用</span>' : '<span class="text-success">啟用</span>') + '</td>' +
        '<td class="text-nowrap">' +
          '<button type="button" class="btn btn-sm btn-outline-primary me-1" data-act="edit" data-key="' + esc(r.key) + '">編輯</button>' +
          '<button type="button" class="btn btn-sm btn-outline-secondary" data-act="toggle" data-key="' + esc(r.key) + '">' +
            (r.is_active === false ? '啟用' : '停用') +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="7" class="text-muted text-center">尚無資料</td></tr>';
  }
  async function load() {
    setStatus('');
    var headers = await authHeaders();
    var q = document.getElementById('showInactive').checked ? '?include_inactive=1' : '';
    var res = await fetch(API + q, { headers: headers });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      setStatus(data.error || '載入失敗', false);
      items = [];
      render();
      return;
    }
    items = data.items || [];
    render();
  }
  function openEdit(key) {
    var row = items.find(function (r) { return r.key === key; });
    if (!row) return;
    document.getElementById('editKey').value = row.key;
    document.getElementById('editKeyShow').value = row.key;
    document.getElementById('editName').value = row.name || '';
    document.getElementById('editNameEn').value = row.name_en || '';
    document.getElementById('editNameJa').value = row.name_ja || '';
    document.getElementById('editNameEs').value = row.name_es || '';
    document.getElementById('editNameDe').value = row.name_de || '';
    document.getElementById('editNameFr').value = row.name_fr || '';
    document.getElementById('editLayout').value = row.layout_label || '';
    document.getElementById('editLayoutEn').value = row.layout_label_en || '';
    document.getElementById('editSort').value = row.sort_order != null ? row.sort_order : 10;
    document.getElementById('editActive').checked = row.is_active !== false;
    if (!editModal) editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
  }
  document.getElementById('listBody').addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var key = btn.getAttribute('data-key');
    var act = btn.getAttribute('data-act');
    if (act === 'edit') return openEdit(key);
    if (act === 'toggle') {
      var row = items.find(function (r) { return r.key === key; });
      if (!row) return;
      var headers = await authHeaders();
      var res = await fetch(API + '/' + encodeURIComponent(key), {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ is_active: row.is_active === false })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) return setStatus(data.error || '更新失敗', false);
      setStatus('已更新', true);
      load();
    }
  });
  document.getElementById('btnAdd').addEventListener('click', async function () {
    var payload = {
      key: document.getElementById('addKey').value,
      name: document.getElementById('addName').value,
      name_en: document.getElementById('addNameEn').value,
      name_ja: document.getElementById('addNameJa').value,
      name_es: document.getElementById('addNameEs').value,
      name_de: document.getElementById('addNameDe').value,
      name_fr: document.getElementById('addNameFr').value,
      layout_label: document.getElementById('addLayout').value,
      layout_label_en: document.getElementById('addLayoutEn').value,
      sort_order: document.getElementById('addSort').value
    };
    var headers = await authHeaders();
    var res = await fetch(API, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) return setStatus(data.error || '新增失敗', false);
    setStatus('已新增', true);
    ['addKey', 'addName', 'addNameEn', 'addNameJa', 'addNameEs', 'addNameDe', 'addNameFr', 'addLayout', 'addLayoutEn'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    load();
  });
  document.getElementById('btnSaveEdit').addEventListener('click', async function () {
    var key = document.getElementById('editKey').value;
    var payload = {
      name: document.getElementById('editName').value,
      name_en: document.getElementById('editNameEn').value,
      name_ja: document.getElementById('editNameJa').value,
      name_es: document.getElementById('editNameEs').value,
      name_de: document.getElementById('editNameDe').value,
      name_fr: document.getElementById('editNameFr').value,
      layout_label: document.getElementById('editLayout').value,
      layout_label_en: document.getElementById('editLayoutEn').value,
      sort_order: document.getElementById('editSort').value,
      is_active: document.getElementById('editActive').checked
    };
    var headers = await authHeaders();
    var res = await fetch(API + '/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: headers,
      body: JSON.stringify(payload)
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) return setStatus(data.error || '儲存失敗', false);
    if (editModal) editModal.hide();
    setStatus('已儲存', true);
    load();
  });
  document.getElementById('showInactive').addEventListener('change', load);
  load();
})();
  </script>
</body>
</html>
