<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>描述審核紀錄 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .prompt-clip { max-width: 280px; }
    .stat-card { border: 0; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); }
    .stat-card .stat-num { font-size: 1.35rem; font-weight: 600; }
    .evt-row { cursor: pointer; }
    .evt-row:hover td { background: #f8f9fa; }
  </style>
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-1">描述審核紀錄</h4>
        <p class="text-muted small mb-3">自動潤飾（仍生圖）與攔截（無法生圖）分開列出，供後續檢討。通過且未改寫的不記錄。</p>

        <div class="row g-2 mb-3">
          <div class="col-6 col-md-4">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">潤飾</div>
              <div class="stat-num text-primary" id="sumPolished">—</div>
            </div></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="card stat-card"><div class="card-body py-2 px-3">
              <div class="text-muted small">擋下</div>
              <div class="stat-num text-danger" id="sumBlocked">—</div>
            </div></div>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-2">
                <label class="form-label small mb-1">類型</label>
                <select class="form-select form-select-sm" id="filterAction">
                  <option value="all">全部</option>
                  <option value="polished">潤飾</option>
                  <option value="blocked">擋下</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small mb-1">關鍵字</label>
                <input type="text" class="form-control form-control-sm" id="filterQ" placeholder="描述／原因／帳號" />
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">起始</label>
                <input type="date" class="form-control form-control-sm" id="filterFrom" />
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">結束</label>
                <input type="date" class="form-control form-control-sm" id="filterTo" />
              </div>
              <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary btn-sm flex-fill" id="btnSearch"><i class="bi bi-search me-1"></i>查詢</button>
                <button class="btn btn-outline-secondary btn-sm" id="btnReset" title="清除"><i class="bi bi-x-lg"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th>類型</th>
                  <th>帳號</th>
                  <th>原始描述</th>
                  <th>潤飾後</th>
                  <th>原因</th>
                  <th>時間</th>
                </tr>
              </thead>
              <tbody id="eventsBody">
                <tr><td colspan="6" class="text-center text-muted py-4">載入中…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2">
            <button class="btn btn-outline-secondary btn-sm" id="btnPrev" disabled>上一頁</button>
            <span class="small text-muted" id="pageInfo">第 1 頁</span>
            <button class="btn btn-outline-secondary btn-sm" id="btnNext" disabled>下一頁</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title mb-0">審核詳情</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/auth-middleware.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script src="/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    var token = null;
    var page = 0;
    var perPage = 50;
    var hasMore = false;
    var items = [];
    var detailModal = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function fmtTime(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch (_) { return String(iso).slice(0, 16); }
    }
    function clip(s, n) {
      s = String(s || '').replace(/\s+/g, ' ').trim();
      if (s.length <= n) return s;
      return s.slice(0, n) + '…';
    }
    async function getToken() {
      if (token) return token;
      if (window.AuthService && typeof AuthService.getSession === 'function') {
        var s = await AuthService.getSession();
        token = s && (s.access_token || (s.session && s.session.access_token));
      }
      return token;
    }

    function actionBadge(action) {
      if (action === 'blocked') return '<span class="badge bg-danger">擋下</span>';
      return '<span class="badge bg-primary">潤飾</span>';
    }

    function renderRows() {
      var body = document.getElementById('eventsBody');
      if (!items.length) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">沒有紀錄</td></tr>';
        return;
      }
      body.innerHTML = items.map(function (row, idx) {
        var who = esc(row.user_email || row.user_name || (row.user_id ? row.user_id.slice(0, 8) : '—'));
        return '<tr class="evt-row" data-idx="' + idx + '">' +
          '<td>' + actionBadge(row.action) + '</td>' +
          '<td class="small">' + who + '</td>' +
          '<td><div class="text-truncate prompt-clip" title="' + esc(row.original_prompt) + '">' + esc(clip(row.original_prompt, 80) || '—') + '</div></td>' +
          '<td><div class="text-truncate prompt-clip" title="' + esc(row.rewritten_prompt) + '">' + esc(clip(row.rewritten_prompt, 80) || '—') + '</div></td>' +
          '<td class="small">' + esc(clip(row.reason, 40) || '—') + '</td>' +
          '<td class="small text-nowrap">' + esc(fmtTime(row.created_at)) + '</td></tr>';
      }).join('');
      body.querySelectorAll('.evt-row').forEach(function (tr) {
        tr.addEventListener('click', function () { openDetail(parseInt(tr.dataset.idx, 10)); });
      });
    }

    function openDetail(idx) {
      var row = items[idx];
      if (!row) return;
      document.getElementById('detailBody').innerHTML =
        '<dl class="row mb-0">' +
        '<dt class="col-sm-3">類型</dt><dd class="col-sm-9">' + actionBadge(row.action) + '</dd>' +
        '<dt class="col-sm-3">時間</dt><dd class="col-sm-9">' + esc(fmtTime(row.created_at)) + '</dd>' +
        '<dt class="col-sm-3">帳號</dt><dd class="col-sm-9">' + esc(row.user_email || row.user_id || '—') + '</dd>' +
        '<dt class="col-sm-3">自動潤飾開關</dt><dd class="col-sm-9">' + (row.auto_polish ? '開' : (row.auto_polish === false ? '關' : '—')) + '</dd>' +
        '<dt class="col-sm-3">通道</dt><dd class="col-sm-9">' + esc(row.client_channel || '—') + '</dd>' +
        '<dt class="col-sm-3">原因</dt><dd class="col-sm-9">' + esc(row.reason || '—') + '</dd>' +
        '<dt class="col-sm-3">原始描述</dt><dd class="col-sm-9"><pre class="bg-light p-2 rounded small mb-0" style="white-space:pre-wrap">' + esc(row.original_prompt || '—') + '</pre></dd>' +
        '<dt class="col-sm-3">潤飾後</dt><dd class="col-sm-9"><pre class="bg-light p-2 rounded small mb-0" style="white-space:pre-wrap">' + esc(row.rewritten_prompt || '—') + '</pre></dd>' +
        '</dl>';
      if (!detailModal) detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
      detailModal.show();
    }

    async function loadPage() {
      var tok = await getToken();
      if (!tok) return;
      document.getElementById('eventsBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">載入中…</td></tr>';
      var qs = new URLSearchParams({
        limit: String(perPage),
        offset: String(page * perPage),
        action: document.getElementById('filterAction').value || 'all'
      });
      var q = document.getElementById('filterQ').value.trim();
      var from = document.getElementById('filterFrom').value;
      var to = document.getElementById('filterTo').value;
      if (q) qs.set('q', q);
      if (from) qs.set('from', from);
      if (to) qs.set('to', to);
      var r = await fetch('/api/admin/prompt-review-events?' + qs.toString(), {
        headers: { Authorization: 'Bearer ' + tok }
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        document.getElementById('eventsBody').innerHTML = '<tr><td colspan="6" class="text-danger text-center py-4">' + esc(data.error || '載入失敗') + '</td></tr>';
        return;
      }
      items = data.items || [];
      hasMore = !!data.has_more;
      var sum = data.summary || {};
      document.getElementById('sumPolished').textContent = String(sum.polished != null ? sum.polished : '—');
      document.getElementById('sumBlocked').textContent = String(sum.blocked != null ? sum.blocked : '—');
      document.getElementById('pageInfo').textContent = '第 ' + (page + 1) + ' 頁' + (data.total != null ? '（共 ' + data.total + ' 筆）' : '');
      document.getElementById('btnPrev').disabled = page <= 0;
      document.getElementById('btnNext').disabled = !hasMore;
      if (data.hint) {
        document.getElementById('eventsBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">' + esc(data.hint) + '</td></tr>';
        return;
      }
      renderRows();
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('btnSearch').addEventListener('click', function () { page = 0; loadPage(); });
      document.getElementById('btnReset').addEventListener('click', function () {
        document.getElementById('filterAction').value = 'all';
        document.getElementById('filterQ').value = '';
        document.getElementById('filterFrom').value = '';
        document.getElementById('filterTo').value = '';
        page = 0;
        loadPage();
      });
      document.getElementById('btnPrev').addEventListener('click', function () { if (page > 0) { page--; loadPage(); } });
      document.getElementById('btnNext').addEventListener('click', function () { if (hasMore) { page++; loadPage(); } });
      document.getElementById('filterQ').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { page = 0; loadPage(); }
      });
      setTimeout(loadPage, 400);
    });
  })();
  </script>
</body>
</html>
