<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>材料組合分析 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    main.stats-main { max-width: 960px; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: flex-end; }
    .tab-bar { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.75rem; }
    .tab-bar .tab-btn {
      border: 1px solid #dee2e6; background: #fff; border-radius: 0.375rem;
      padding: 0.35rem 0.65rem; font-size: 0.8125rem; cursor: pointer; line-height: 1.3;
    }
    .tab-bar .tab-btn:hover { background: #f8f9fa; }
    .tab-bar .tab-btn.active { border-color: #7A8FA3; background: #eef2f5; font-weight: 600; }
    .tab-bar .tab-btn .tab-meta { color: #6c757d; font-weight: 400; margin-left: 0.25rem; }
    .panel-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 1rem;
      padding: 0.5rem 0.75rem; background: #fff; border: 1px solid #dee2e6; border-bottom: 0;
      border-radius: 0.375rem 0.375rem 0 0; font-size: 0.8125rem;
    }
    .panel-head .ph-title { font-weight: 600; }
    .panel-head .ph-nums strong { color: #212529; }
    .stats-table-wrap {
      border: 1px solid #dee2e6; border-radius: 0 0 0.375rem 0.375rem;
      background: #fff; overflow-x: auto;
    }
    .stats-table { width: auto; min-width: 100%; margin: 0; font-size: 0.8125rem; }
    .stats-table th, .stats-table td { padding: 0.3rem 0.5rem; vertical-align: middle; }
    .stats-table .col-num { text-align: right; white-space: nowrap; min-width: 3rem; }
    .stats-table td.col-label { max-width: 22rem; }
    .overview-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
      gap: 0.5rem; padding: 0.65rem 0.75rem; background: #fff;
      border: 1px solid #dee2e6; border-radius: 0 0 0.375rem 0.375rem; font-size: 0.8125rem;
    }
    .overview-grid .og-item { border: 1px solid #eee; border-radius: 0.25rem; padding: 0.35rem 0.5rem; }
    .overview-grid .og-label { color: #6c757d; font-size: 0.75rem; }
    .overview-grid .og-val { font-weight: 600; font-size: 1.05rem; }
    .dual-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    @media (max-width: 767px) { .dual-tables { grid-template-columns: 1fr; } }
    .dual-tables .sub-head {
      padding: 0.35rem 0.5rem; font-size: 0.75rem; font-weight: 600;
      background: #f8f9fa; border-bottom: 1px solid #dee2e6;
    }
    .dual-tables .half { border-right: 1px solid #dee2e6; }
    .dual-tables .half:last-child { border-right: 0; }
  </style>
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-3 stats-main">
        <h5 class="mb-1">材料組合分析</h5>
        <p class="text-muted small mb-2">聚合材料組合生成與設計稿引用中的 material_combo。</p>

        <div id="analyticsMsg" class="alert mb-2 py-2 d-none small"></div>

        <div class="card mb-2">
          <div class="card-body py-2 px-3">
            <div class="toolbar-row">
              <div>
                <label class="form-label small mb-0">起日</label>
                <input type="date" class="form-control form-control-sm" id="fromDate" />
              </div>
              <div>
                <label class="form-label small mb-0">迄日</label>
                <input type="date" class="form-control form-control-sm" id="toDate" />
              </div>
              <div class="d-flex flex-wrap gap-1 align-items-end pb-1">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-range="all">全部</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-range="7">7 日</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-range="30">30 日</button>
              </div>
              <button type="button" class="btn btn-sm btn-primary mb-1" id="btnLoad">載入</button>
            </div>
            <div class="small text-muted mt-1" id="rangeMeta">—</div>
          </div>
        </div>

        <div class="tab-bar" role="tablist">
          <button type="button" class="tab-btn active" data-panel="overview" role="tab">
            概覽<span class="tab-meta" id="tabMetaOverview">—</span>
          </button>
          <button type="button" class="tab-btn" data-panel="materials" role="tab">
            材質 TOP<span class="tab-meta" id="tabMetaMaterials">—</span>
          </button>
          <button type="button" class="tab-btn" data-panel="pairs" role="tab">
            組合 TOP<span class="tab-meta" id="tabMetaPairs">—</span>
          </button>
          <button type="button" class="tab-btn" data-panel="palette" role="tab">
            配色來源<span class="tab-meta" id="tabMetaPalette">—</span>
          </button>
        </div>

        <section class="panel-section" id="panelOverview">
          <div class="panel-head">
            <span class="ph-title">概覽</span>
            <span class="ph-nums">總 <strong id="sumTotal">—</strong>｜生成 <strong id="sumGen">—</strong>｜設計稿 <strong id="sumDesign">—</strong></span>
          </div>
          <div class="overview-grid">
            <div class="og-item"><div class="og-label">雙色</div><div class="og-val" id="sumDual">—</div></div>
            <div class="og-item"><div class="og-label">三色</div><div class="og-val" id="sumTri">—</div></div>
            <div class="og-item"><div class="og-label">有配色來源</div><div class="og-val" id="sumPalette">—</div></div>
          </div>
        </section>

        <section class="panel-section d-none" id="panelMaterials">
          <div class="panel-head">
            <span class="ph-title">材質 TOP</span>
            <span class="ph-nums text-muted">主色區 / 配色區</span>
          </div>
          <div class="stats-table-wrap">
            <div class="dual-tables">
              <div class="half">
                <div class="sub-head">主色區</div>
                <table class="table table-sm mb-0 stats-table">
                  <thead><tr><th>材質</th><th class="col-num">次數</th></tr></thead>
                  <tbody id="tblMain"></tbody>
                </table>
              </div>
              <div class="half">
                <div class="sub-head">配色區</div>
                <table class="table table-sm mb-0 stats-table">
                  <thead><tr><th>材質</th><th class="col-num">次數</th></tr></thead>
                  <tbody id="tblAccent"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

        <section class="panel-section d-none" id="panelPairs">
          <div class="panel-head">
            <span class="ph-title">材質組合 TOP</span>
            <span class="ph-nums text-muted">主 + 配 + 輔</span>
          </div>
          <div class="stats-table-wrap">
            <table class="table table-sm mb-0 stats-table">
              <thead><tr><th>組合</th><th class="col-num">次數</th></tr></thead>
              <tbody id="tblPairs"></tbody>
            </table>
          </div>
        </section>

        <section class="panel-section d-none" id="panelPalette">
          <div class="panel-head">
            <span class="ph-title">配色範例來源 TOP</span>
            <span class="ph-nums text-muted">套用官方／我的配色後才有</span>
          </div>
          <div class="stats-table-wrap">
            <table class="table table-sm mb-0 stats-table">
              <thead><tr><th>類型</th><th>配色名稱</th><th>scope</th><th class="col-num">次數</th></tr></thead>
              <tbody id="tblPalette"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
(function () {
  var PANELS = {
    overview: document.getElementById('panelOverview'),
    materials: document.getElementById('panelMaterials'),
    pairs: document.getElementById('panelPairs'),
    palette: document.getElementById('panelPalette')
  };

  function showPanel(name) {
    var key = PANELS[name] ? name : 'overview';
    Object.keys(PANELS).forEach(function (k) {
      if (PANELS[k]) PANELS[k].classList.toggle('d-none', k !== key);
    });
    document.querySelectorAll('.tab-btn').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-panel') === key);
    });
    if (window.history && window.history.replaceState) {
      var u = new URL(window.location.href);
      u.searchParams.set('tab', key);
      window.history.replaceState(null, '', u.pathname + u.search);
    }
  }

  function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        showPanel(el.getAttribute('data-panel'));
      });
    });
    var tab = (new URLSearchParams(window.location.search).get('tab') || '').trim();
    var valid = { overview: 1, materials: 1, pairs: 1, palette: 1 };
    showPanel(valid[tab] ? tab : 'overview');
  }

  function showMsg(text, isErr) {
    var el = document.getElementById('analyticsMsg');
    el.className = 'alert mb-2 py-2 small ' + (isErr ? 'alert-danger' : 'alert-info');
    el.textContent = text;
    el.classList.remove('d-none');
  }
  async function getAuthHeaders() {
    if (!window.AuthService || !AuthService.getSession) return {};
    var session = await AuthService.getSession();
    var token = session && session.access_token;
    if (!token) return {};
    return { Authorization: 'Bearer ' + token };
  }
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fillTable(tbodyId, rows, renderRow, colSpan) {
    var tb = document.getElementById(tbodyId);
    if (!tb) return;
    var cs = colSpan || 4;
    if (!rows || !rows.length) {
      tb.innerHTML = '<tr><td colspan="' + cs + '" class="text-muted p-2">尚無資料</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(renderRow).join('');
  }
  function fmtDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function setQuickRange(kind) {
    var fromEl = document.getElementById('fromDate');
    var toEl = document.getElementById('toDate');
    var today = new Date();
    toEl.value = fmtDate(today);
    if (kind === 'all') {
      fromEl.value = '';
      toEl.value = '';
      return;
    }
    var days = parseInt(kind, 10) || 7;
    var from = new Date(today);
    from.setDate(from.getDate() - (days - 1));
    fromEl.value = fmtDate(from);
  }
  function showRangeMeta(data) {
    var el = document.getElementById('rangeMeta');
    if (!el) return;
    var from = data && data.from_date;
    var to = data && data.to_date;
    if (!from && !to) {
      el.textContent = '全部時間';
      return;
    }
    el.textContent = (from || '…') + ' ～ ' + (to || '…');
  }
  async function load() {
    var headers = await getAuthHeaders();
    if (!headers.Authorization) {
      showMsg('請先登入管理員帳號', true);
      return;
    }
    var from = document.getElementById('fromDate').value;
    var to = document.getElementById('toDate').value;
    var qs = new URLSearchParams();
    if (from) qs.set('from_date', from);
    if (to) qs.set('to_date', to);
    showMsg('載入中…', false);
    try {
      var res = await fetch('/api/admin/material-combo-analytics?' + qs.toString(), { headers: headers });
      var data = await res.json();
      if (!res.ok) {
        showMsg(data.error || '載入失敗', true);
        return;
      }
      document.getElementById('analyticsMsg').classList.add('d-none');
      showRangeMeta(data);
      var s = data.summary || {};
      document.getElementById('sumTotal').textContent = s.total != null ? s.total : '—';
      document.getElementById('sumGen').textContent = s.from_generations != null ? s.from_generations : '—';
      document.getElementById('sumDesign').textContent = s.from_design_references != null ? s.from_design_references : '—';
      document.getElementById('sumDual').textContent = s.dual_count != null ? s.dual_count : '—';
      document.getElementById('sumTri').textContent = s.tri_count != null ? s.tri_count : '—';
      document.getElementById('sumPalette').textContent = s.with_palette_source != null ? s.with_palette_source : '—';
      document.getElementById('tabMetaOverview').textContent = '· 總 ' + (s.total != null ? s.total : '—');
      var topMain = (data.top_main_materials && data.top_main_materials[0]) ? data.top_main_materials[0] : null;
      var topPair = (data.top_material_combinations && data.top_material_combinations[0]) ? data.top_material_combinations[0] : null;
      document.getElementById('tabMetaMaterials').textContent = topMain
        ? ('· ' + topMain.label + ' ' + topMain.count)
        : '· —';
      document.getElementById('tabMetaPairs').textContent = topPair
        ? ('· ' + topPair.count)
        : '· —';
      document.getElementById('tabMetaPalette').textContent =
        '· ' + (s.with_palette_source != null ? s.with_palette_source : '—');
      if (data.generations_table_missing) {
        showMsg('材料組合生成表尚未建立；設計稿引用仍會統計。', false);
      }
      fillTable('tblMain', data.top_main_materials, function (r) {
        return '<tr><td class="col-label">' + esc(r.label) + '</td><td class="col-num">' + r.count + '</td></tr>';
      }, 2);
      fillTable('tblAccent', data.top_accent_materials, function (r) {
        return '<tr><td class="col-label">' + esc(r.label) + '</td><td class="col-num">' + r.count + '</td></tr>';
      }, 2);
      fillTable('tblPairs', data.top_material_combinations, function (r) {
        return '<tr><td class="col-label">' + esc(r.label) + '</td><td class="col-num">' + r.count + '</td></tr>';
      }, 2);
      fillTable('tblPalette', data.top_palette_sources, function (r) {
        return '<tr><td>' + esc(r.type_name) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.scope) + '</td><td class="col-num">' + r.count + '</td></tr>';
      }, 4);
    } catch (e) {
      showMsg('載入失敗', true);
    }
  }
  initTabs();
  document.getElementById('btnLoad').addEventListener('click', load);
  document.querySelectorAll('[data-range]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setQuickRange(btn.getAttribute('data-range'));
      load();
    });
  });
  load();
})();
  </script>
</body>
</html>
