<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>攝影模擬參數 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-1">攝影模擬參數</h4>
        <p class="text-muted small mb-3">
          供 <code>/client/promo-camera.html</code> 使用。請先執行 <code>docs/add-promo-camera-params.sql</code>，再執行 <code>docs/add-promo-camera-param-categories.sql</code>（分類可後台增刪改、含英文）。
          各選項 <code>prompt_fragment</code>（英文）送 FLUX；分類與分組名稱支援多語系（對齊訂製品分類）。
          點數於 <a href="/admin/membership.html">方案／點數</a> 設定。
        </p>
        <div id="statusWrap" class="alert mb-3 py-2 d-none"><span id="statusMsg"></span></div>

        <div class="card mb-3">
          <div class="card-header fw-semibold">參數分類（可新增／編輯）</div>
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-2"><label class="form-label small mb-0">key</label><input id="catKey" class="form-control form-control-sm" placeholder="my_category"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱</label><input id="catName" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">英文名</label><input id="catNameEn" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">UI 類型</label>
                <select id="catUiType" class="form-select form-select-sm">
                  <option value="dropdown">下拉選單</option>
                  <option value="angle_buttons">角度按鈕列</option>
                  <option value="hidden">隱藏（legacy）</option>
                </select>
              </div>
              <div class="col-md-1"><label class="form-label small mb-0">排序</label><input id="catSort" type="number" class="form-control form-control-sm" value="100"></div>
              <div class="col-md-3 d-flex align-items-end gap-2 flex-wrap">
                <div class="form-check"><input class="form-check-input" type="checkbox" id="catGroupable"><label class="form-check-label small" for="catGroupable">選項可分组</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="catLensPrimary"><label class="form-check-label small" for="catLensPrimary">主鏡頭分類</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="catActive" checked><label class="form-check-label small" for="catActive">啟用</label></div>
              </div>
              <div class="col-md-2"><label class="form-label small mb-0">互斥群組 id</label><input id="catExclusiveGroup" class="form-control form-control-sm" placeholder="look"></div>
              <div class="col-md-2"><label class="form-label small mb-0">群組標籤</label><input id="catExclusiveLabel" class="form-control form-control-sm" placeholder="成像來源"></div>
              <div class="col-md-2"><label class="form-label small mb-0">群組標籤（英）</label><input id="catExclusiveLabelEn" class="form-control form-control-sm" placeholder="Look"></div>
              <div class="col-md-1"><label class="form-label small mb-0">群組序</label><input id="catExclusiveOrder" type="number" class="form-control form-control-sm" value="0"></div>
              <div class="col-md-2 d-flex align-items-end"><button type="button" id="btnAddCat" class="btn btn-primary btn-sm">新增分類</button></div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-bordered mb-0 align-middle">
                <thead class="table-light"><tr><th>key</th><th>名稱</th><th>EN</th><th>UI</th><th>分组</th><th>互斥群組</th><th>排序</th><th>狀態</th><th></th></tr></thead>
                <tbody id="catBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header fw-semibold">新增選項</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-2">
                <label class="form-label small mb-0">category</label>
                <select id="addCategory" class="form-select form-select-sm"></select>
              </div>
              <div class="col-md-2"><label class="form-label small mb-0">key</label><input id="addKey" class="form-control form-control-sm" placeholder="f28"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱</label><input id="addName" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">英文名</label><input id="addNameEn" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">排序</label><input id="addSort" type="number" class="form-control form-control-sm" value="10"></div>
              <div class="col-md-2"><label class="form-label small mb-0">分組（中）</label><input id="addGroup" class="form-control form-control-sm" placeholder="标准定焦"></div>
              <div class="col-md-2"><label class="form-label small mb-0">分組（英）</label><input id="addGroupEn" class="form-control form-control-sm" placeholder="Standard prime"></div>
              <div class="col-md-3 d-flex align-items-end gap-3">
                <div class="form-check"><input class="form-check-input" type="checkbox" id="addDefault"><label class="form-check-label small" for="addDefault">此類預設</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="addActive" checked><label class="form-check-label small" for="addActive">啟用</label></div>
              </div>
              <div class="col-12"><label class="form-label small mb-0">prompt_fragment（英文，進 FLUX）</label><textarea id="addFragment" class="form-control form-control-sm" rows="2"></textarea></div>
              <div class="col-md-6"><label class="form-label small mb-0">說明（前台提示）</label><input id="addDesc" class="form-control form-control-sm"></div>
              <div class="col-md-6"><label class="form-label small mb-0">說明（英文）</label><input id="addDescEn" class="form-control form-control-sm"></div>
              <div class="col-12"><button type="button" id="btnAdd" class="btn btn-primary btn-sm">新增</button></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
              <span class="fw-semibold">選項列表</span>
              <select id="filterCategory" class="form-select form-select-sm" style="width:auto;"></select>
              <select id="filterGroup" class="form-select form-select-sm" style="width:auto;"><option value="">全部分組</option></select>
            </div>
            <button type="button" id="btnReload" class="btn btn-sm btn-outline-secondary">重新載入</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered mb-0 align-middle">
              <thead class="table-light">
                <tr><th>category</th><th>分組</th><th>key</th><th>名稱</th><th>EN</th><th>prompt</th><th>預設</th><th>排序</th><th>狀態</th><th></th></tr>
              </thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="editModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header py-2"><h6 class="modal-title">編輯選項</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row g-2">
                  <div class="col-md-4"><label class="form-label small">category</label><select id="editCategory" class="form-select form-select-sm"></select></div>
                  <div class="col-md-4"><label class="form-label small">key</label><input id="editKey" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">名稱</label><input id="editName" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">英文名</label><input id="editNameEn" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">排序</label><input id="editSort" type="number" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">分組（中）</label><input id="editGroup" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">分組（英）</label><input id="editGroupEn" class="form-control form-control-sm"></div>
                  <div class="col-md-4 d-flex align-items-end gap-3">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editDefault"><label class="form-check-label small" for="editDefault">預設</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editActive"><label class="form-check-label small" for="editActive">啟用</label></div>
                  </div>
                  <div class="col-12"><label class="form-label small">prompt_fragment</label><textarea id="editFragment" class="form-control form-control-sm" rows="3"></textarea></div>
                  <div class="col-md-6"><label class="form-label small">說明（中）</label><input id="editDesc" class="form-control form-control-sm"></div>
                  <div class="col-md-6"><label class="form-label small">說明（英）</label><input id="editDescEn" class="form-control form-control-sm"></div>
                </div>
              </div>
              <div class="modal-footer py-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" id="btnSaveEdit">儲存</button>
              </div>
            </div>
          </div>
        </div>

        <div class="modal fade" id="editCatModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header py-2"><h6 class="modal-title">編輯分類</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <input type="hidden" id="editCatId">
                <div class="mb-2"><label class="form-label small">key</label><input id="editCatKey" class="form-control form-control-sm"></div>
                <div class="mb-2"><label class="form-label small">名稱</label><input id="editCatName" class="form-control form-control-sm"></div>
                <div class="mb-2"><label class="form-label small">英文名</label><input id="editCatNameEn" class="form-control form-control-sm"></div>
                <div class="mb-2"><label class="form-label small">UI 類型</label><select id="editCatUiType" class="form-select form-select-sm"><option value="dropdown">下拉選單</option><option value="angle_buttons">角度按鈕列</option><option value="hidden">隱藏</option></select></div>
                <div class="row g-2 mb-2">
                  <div class="col-4"><label class="form-label small">排序</label><input id="editCatSort" type="number" class="form-control form-control-sm"></div>
                  <div class="col-8 d-flex align-items-end gap-2 flex-wrap">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editCatGroupable"><label class="form-check-label small" for="editCatGroupable">可分组</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editCatLensPrimary"><label class="form-check-label small" for="editCatLensPrimary">主鏡頭</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editCatActive"><label class="form-check-label small" for="editCatActive">啟用</label></div>
                  </div>
                </div>
                <div class="mb-2"><label class="form-label small">互斥群組 id</label><input id="editCatExclusiveGroup" class="form-control form-control-sm"></div>
                <div class="mb-2"><label class="form-label small">群組標籤</label><input id="editCatExclusiveLabel" class="form-control form-control-sm"></div>
                <div class="mb-0"><label class="form-label small">群組標籤（英）</label><input id="editCatExclusiveLabelEn" class="form-control form-control-sm"></div>
                <div class="mt-2"><label class="form-label small">群組序</label><input id="editCatExclusiveOrder" type="number" class="form-control form-control-sm"></div>
              </div>
              <div class="modal-footer py-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" id="btnSaveCat">儲存</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
(function () {
  var API = '/api/admin/promo-camera-params';
  var CAT_API = '/api/admin/promo-camera-param-categories';
  var categories = [];
  var items = [];
  var editModal = null;
  var editCatModal = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function catLabel(key) {
    var hit = categories.find(function (c) { return c.key === key; });
    return hit ? (hit.name + ' (' + hit.key + ')') : key;
  }
  function paramGroup(row) {
    var m = row && row.meta;
    return (m && typeof m === 'object' && m.group != null) ? String(m.group).trim() : '';
  }
  function paramGroupEn(row) {
    var m = row && row.meta;
    return (m && typeof m === 'object' && m.group_en != null) ? String(m.group_en).trim() : '';
  }
  function catMeta(row, k) {
    var m = row && row.meta && typeof row.meta === 'object' ? row.meta : {};
    return m[k];
  }
  function showStatus(msg, ok) {
    var w = document.getElementById('statusWrap');
    document.getElementById('statusMsg').textContent = msg;
    w.classList.remove('d-none','alert-success','alert-danger');
    w.classList.add(ok ? 'alert-success' : 'alert-danger');
  }
  async function authHeaders() {
    if (!window.AuthService) return {};
    var session = await AuthService.getSession();
    var t = session && session.access_token;
    return t ? { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } : {};
  }
  function fillCategorySelects() {
    ['addCategory','editCategory','filterCategory'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var html = id === 'filterCategory' ? '<option value="">全部</option>' : '';
      categories.forEach(function (c) {
        if (c.is_active === false && id !== 'filterCategory') return;
        html += '<option value="' + esc(c.key) + '">' + esc(c.name || c.key) + '</option>';
      });
      el.innerHTML = html;
    });
  }
  function renderCategories() {
    var tb = document.getElementById('catBody');
    if (!tb) return;
    tb.innerHTML = categories.map(function (row) {
      return '<tr><td><code>' + esc(row.key) + '</code></td><td>' + esc(row.name) + '</td><td class="small">' + esc(row.name_en || '—') + '</td>' +
        '<td class="small">' + esc(catMeta(row, 'ui_type') || 'dropdown') + '</td>' +
        '<td>' + (catMeta(row, 'groupable') ? '✓' : '') + '</td>' +
        '<td class="small">' + esc(catMeta(row, 'exclusive_group') || '—') + '</td>' +
        '<td>' + esc(row.sort_order) + '</td><td>' + (row.is_active !== false ? '啟用' : '停用') + '</td>' +
        '<td><button type="button" class="btn btn-sm btn-outline-primary btn-edit-cat" data-id="' + esc(row.id) + '">編輯</button> ' +
        '<button type="button" class="btn btn-sm btn-outline-danger btn-del-cat" data-id="' + esc(row.id) + '">刪</button></td></tr>';
    }).join('');
    tb.querySelectorAll('.btn-edit-cat').forEach(function (btn) {
      btn.addEventListener('click', function () { openEditCat(btn.getAttribute('data-id')); });
    });
    tb.querySelectorAll('.btn-del-cat').forEach(function (btn) {
      btn.addEventListener('click', function () { delCat(btn.getAttribute('data-id')); });
    });
  }
  async function loadCategories() {
    var headers = await authHeaders();
    var r = await fetch(CAT_API, { headers: headers, cache: 'no-store' });
    var d = await r.json().catch(function(){ return {}; });
    if (!r.ok) {
      if (d.code === 'MIGRATION_REQUIRED') showStatus(d.error || '請執行 docs/add-promo-camera-param-categories.sql', false);
      return false;
    }
    categories = d.items || [];
    fillCategorySelects();
    renderCategories();
    return true;
  }
  function fillGroupFilter() {
    var el = document.getElementById('filterGroup');
    if (!el) return;
    var cur = el.value;
    var set = {};
    items.forEach(function (row) {
      var g = paramGroup(row);
      if (g) set[g] = true;
    });
    var groups = Object.keys(set).sort();
    el.innerHTML = '<option value="">全部分組</option>' + groups.map(function (g) {
      return '<option value="' + esc(g) + '">' + esc(g) + '</option>';
    }).join('');
    if (cur && set[cur]) el.value = cur;
  }
  async function loadList() {
    var cat = document.getElementById('filterCategory').value;
    var q = cat ? ('?category=' + encodeURIComponent(cat)) : '';
    var headers = await authHeaders();
    var r = await fetch(API + q, { headers: headers, cache: 'no-store' });
    var d = await r.json().catch(function(){ return {}; });
    if (!r.ok) { showStatus(d.error || '載入失敗', false); return; }
    if (d.category_defs && d.category_defs.length) categories = d.category_defs;
    else await loadCategories();
    items = d.items || [];
    if (d.categories_migration_hint) showStatus(d.categories_migration_hint, false);
    fillCategorySelects();
    fillGroupFilter();
    renderList();
  }
  function renderList() {
    var groupFilter = (document.getElementById('filterGroup') || {}).value || '';
    var filtered = items.filter(function (row) {
      if (!groupFilter) return true;
      return paramGroup(row) === groupFilter;
    });
    var tb = document.getElementById('listBody');
    tb.innerHTML = filtered.map(function (row) {
      var frag = (row.prompt_fragment || '').trim();
      var short = frag.length > 40 ? frag.slice(0, 40) + '…' : (frag || '—');
      var g = paramGroup(row);
      var ge = paramGroupEn(row);
      return '<tr><td><code>' + esc(row.category) + '</code><div class="small text-muted">' + esc(catLabel(row.category)) + '</div></td>' +
        '<td class="small">' + esc(g || '—') + (ge ? ('<div class="text-muted">EN: ' + esc(ge) + '</div>') : '') + '</td>' +
        '<td><code>' + esc(row.key) + '</code></td><td>' + esc(row.name) + '</td><td class="small">' + esc(row.name_en || '—') + '</td>' +
        '<td class="small">' + esc(short) + '</td><td>' + (row.is_default ? '✓' : '') + '</td><td>' + esc(row.sort_order) + '</td>' +
        '<td>' + (row.is_active !== false ? '啟用' : '停用') + '</td>' +
        '<td><button type="button" class="btn btn-sm btn-outline-primary btn-edit" data-id="' + esc(row.id) + '">編輯</button> ' +
        '<button type="button" class="btn btn-sm btn-outline-danger btn-del" data-id="' + esc(row.id) + '">刪</button></td></tr>';
    }).join('');
    tb.querySelectorAll('.btn-edit').forEach(function (btn) {
      btn.addEventListener('click', function () { openEdit(btn.getAttribute('data-id')); });
    });
    tb.querySelectorAll('.btn-del').forEach(function (btn) {
      btn.addEventListener('click', function () { delRow(btn.getAttribute('data-id')); });
    });
  }
  function openEdit(id) {
    var row = items.find(function (x) { return x.id === id; });
    if (!row) return;
    document.getElementById('editId').value = row.id;
    document.getElementById('editCategory').value = row.category;
    document.getElementById('editKey').value = row.key;
    document.getElementById('editName').value = row.name || '';
    document.getElementById('editNameEn').value = row.name_en || '';
    document.getElementById('editSort').value = row.sort_order || 0;
    document.getElementById('editDefault').checked = !!row.is_default;
    document.getElementById('editActive').checked = row.is_active !== false;
    document.getElementById('editFragment').value = row.prompt_fragment || '';
    document.getElementById('editDesc').value = row.description || '';
    document.getElementById('editDescEn').value = row.description_en || '';
    document.getElementById('editGroup').value = paramGroup(row);
    document.getElementById('editGroupEn').value = paramGroupEn(row);
    if (!editModal) editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
  }
  function openEditCat(id) {
    var row = categories.find(function (x) { return x.id === id; });
    if (!row) return;
    document.getElementById('editCatId').value = row.id;
    document.getElementById('editCatKey').value = row.key || '';
    document.getElementById('editCatName').value = row.name || '';
    document.getElementById('editCatNameEn').value = row.name_en || '';
    document.getElementById('editCatUiType').value = catMeta(row, 'ui_type') || 'dropdown';
    document.getElementById('editCatSort').value = row.sort_order || 0;
    document.getElementById('editCatGroupable').checked = !!catMeta(row, 'groupable');
    document.getElementById('editCatLensPrimary').checked = !!catMeta(row, 'lens_primary');
    document.getElementById('editCatActive').checked = row.is_active !== false;
    document.getElementById('editCatExclusiveGroup').value = catMeta(row, 'exclusive_group') || '';
    document.getElementById('editCatExclusiveLabel').value = catMeta(row, 'exclusive_group_label') || '';
    document.getElementById('editCatExclusiveLabelEn').value = catMeta(row, 'exclusive_group_label_en') || '';
    document.getElementById('editCatExclusiveOrder').value = catMeta(row, 'exclusive_group_order') || 0;
    if (!editCatModal) editCatModal = new bootstrap.Modal(document.getElementById('editCatModal'));
    editCatModal.show();
  }
  async function delRow(id) {
    if (!confirm('確定刪除？')) return;
    var headers = await authHeaders();
    var r = await fetch(API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: headers });
    var d = await r.json().catch(function(){ return {}; });
    if (!r.ok) { showStatus(d.error || '刪除失敗', false); return; }
    showStatus('已刪除', true);
    loadList();
  }
  async function delCat(id) {
    if (!confirm('確定刪除此分類？（底下不能有選項）')) return;
    var headers = await authHeaders();
    var r = await fetch(CAT_API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: headers });
    var d = await r.json().catch(function(){ return {}; });
    if (!r.ok) { showStatus(d.error || '刪除失敗', false); return; }
    showStatus('分類已刪除', true);
    loadCategories();
    loadList();
  }
  function buildOptionPayload(prefix) {
    return {
      category: document.getElementById(prefix + 'Category').value,
