<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>攝影模擬參數 - MATCHDO 後台</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div id="admin-header"></div>
  <div class="container-fluid">
    <div class="row">
      <aside id="admin-sidebar" class="col-md-3 col-lg-2 bg-white border-end min-vh-100"></aside>
      <main class="col-md-9 col-lg-10 py-4">
        <h4 class="mb-3">攝影模擬參數</h4>
        <div id="statusWrap" class="alert mb-3 py-2 d-none"><span id="statusMsg"></span></div>

        <div class="card mb-3 d-none" id="groupManageCard">
          <div class="card-header fw-semibold">分組管理 · <span id="groupCategoryLabel" class="text-primary">—</span></div>
          <div class="card-body">
            <p class="small text-muted mb-2">先在此建立分組（如柯達彩負、標準定焦），新增／編輯選項時從下拉選擇，前台下拉 optgroup 會依此顯示。</p>
            <div class="row g-2 mb-3">
              <div class="col-md-2"><label class="form-label small mb-0">key</label><input id="grpKey" class="form-control form-control-sm" placeholder="kodak_color_neg"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱（前台分組標題）</label><input id="grpName" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">英文名</label><input id="grpNameEn" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">排序</label><input id="grpSort" type="number" class="form-control form-control-sm" value="10"></div>
              <div class="col-md-2 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" id="grpActive" checked><label class="form-check-label small" for="grpActive">啟用</label></div></div>
              <div class="col-md-2 d-flex align-items-end"><button type="button" id="btnAddGroup" class="btn btn-primary btn-sm">新增分組</button></div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-bordered mb-0 align-middle">
                <thead class="table-light"><tr><th>key</th><th>名稱</th><th>EN</th><th>排序</th><th>狀態</th><th>選項數</th><th></th></tr></thead>
                <tbody id="groupListBody"></tbody>
              </table>
            </div>
            <p id="groupListEmpty" class="text-muted small mb-0 mt-2 d-none">此參數尚無分組，請先新增。</p>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header fw-semibold">新增選項 · <span id="addCategoryLabel" class="text-primary">—</span></div>
          <div class="card-body">
            <div class="row g-2">
              <input type="hidden" id="addCategory" value="">
              <div class="col-md-2"><label class="form-label small mb-0">key</label><input id="addKey" class="form-control form-control-sm" placeholder="portra_400"></div>
              <div class="col-md-2"><label class="form-label small mb-0">名稱</label><input id="addName" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">英文名</label><input id="addNameEn" class="form-control form-control-sm"></div>
              <div class="col-md-2"><label class="form-label small mb-0">排序</label><input id="addSort" type="number" class="form-control form-control-sm" value="10"></div>
              <div class="col-md-2" id="addGroupCol"><label class="form-label small mb-0">分組</label><select id="addGroupId" class="form-select form-select-sm"><option value="">（無分組）</option></select></div>
              <div class="col-md-3 d-flex align-items-end gap-3">
                <div class="form-check"><input class="form-check-input" type="checkbox" id="addDefault"><label class="form-check-label small" for="addDefault">此類預設</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="addActive" checked><label class="form-check-label small" for="addActive">啟用</label></div>
              </div>
              <div class="col-12"><label class="form-label small mb-0">prompt_fragment（英文，進 FLUX）</label><textarea id="addFragment" class="form-control form-control-sm" rows="2"></textarea></div>
              <div class="col-md-6"><label class="form-label small mb-0">說明（前台提示）</label><input id="addDesc" class="form-control form-control-sm"></div>
              <div class="col-md-6"><label class="form-label small mb-0">說明（英文）</label><input id="addDescEn" class="form-control form-control-sm"></div>
              <div class="col-12"><button type="button" id="btnAdd" class="btn btn-primary btn-sm">新增</button></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2 pb-0 border-bottom-0 bg-white">
            <span class="fw-semibold">選項列表</span>
            <div class="d-flex align-items-center gap-2">
              <div class="d-flex align-items-center gap-2" id="groupFilterWrap">
                <label class="small text-muted mb-0" for="filterGroup">分組</label>
                <select id="filterGroup" class="form-select form-select-sm" style="width:auto;"><option value="">全部</option></select>
              </div>
              <button type="button" id="btnReload" class="btn btn-sm btn-outline-secondary">重新載入</button>
            </div>
          </div>
          <ul class="nav nav-tabs px-3 border-bottom" id="optionCategoryTabs" role="tablist"></ul>
          <div class="card-body pt-3">
            <div id="groupableHint" class="alert alert-info py-2 small mb-3 d-none">
              此 TAB 需分組：請在上方「分組管理」建立分組，再於新增／編輯選項時選擇分組。
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-bordered mb-0 align-middle">
                <thead class="table-light">
                  <tr><th id="thGroup">分組</th><th>key</th><th>名稱</th><th>EN</th><th>prompt</th><th>預設</th><th>排序</th><th>狀態</th><th></th></tr>
                </thead>
                <tbody id="listBody"></tbody>
              </table>
            </div>
            <p id="listEmptyHint" class="text-muted small mb-0 mt-2 d-none">此參數尚無選項。</p>
          </div>
        </div>

        <div class="modal fade" id="editModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header py-2"><h6 class="modal-title">編輯選項</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <input type="hidden" id="editId">
                <input type="hidden" id="editCategory" value="">
                <div class="row g-2">
                  <div class="col-md-4"><label class="form-label small">key</label><input id="editKey" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">名稱</label><input id="editName" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">英文名</label><input id="editNameEn" class="form-control form-control-sm"></div>
                  <div class="col-md-4"><label class="form-label small">排序</label><input id="editSort" type="number" class="form-control form-control-sm"></div>
                  <div class="col-md-4" id="editGroupCol"><label class="form-label small">分組</label><select id="editGroupId" class="form-select form-select-sm"><option value="">（無分組）</option></select></div>
                  <div class="col-md-4 d-flex align-items-end gap-3">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editDefault"><label class="form-check-label small" for="editDefault">預設</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="editActive"><label class="form-check-label small" for="editActive">啟用</label></div>
                  </div>
                  <div class="col-12"><label class="form-label small">prompt_fragment</label><textarea id="editFragment" class="form-control form-control-sm" rows="3"></textarea></div>
                  <div class="col-md-6"><label class="form-label small">說明（中）</label><input id="editDesc" class="form-control form-control-sm"></div>
                  <div class="col-md-6"><label class="form-label small">說明（英）</label><input id="editDescEn" class="form-control form-control-sm"></div>
                </div>
              </div>
              <div class="modal-footer py-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" id="btnSaveEdit">儲存</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal fade" id="editGroupModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header py-2"><h6 class="modal-title">編輯分組</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <input type="hidden" id="editGrpId">
                <div class="row g-2">
                  <div class="col-md-6"><label class="form-label small">key</label><input id="editGrpKey" class="form-control form-control-sm"></div>
                  <div class="col-md-6"><label class="form-label small">排序</label><input id="editGrpSort" type="number" class="form-control form-control-sm"></div>
                  <div class="col-md-6"><label class="form-label small">名稱</label><input id="editGrpName" class="form-control form-control-sm"></div>
                  <div class="col-md-6"><label class="form-label small">英文名</label><input id="editGrpNameEn" class="form-control form-control-sm"></div>
                  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="editGrpActive"><label class="form-check-label small" for="editGrpActive">啟用</label></div></div>
                </div>
              </div>
              <div class="modal-footer py-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" id="btnSaveGroupEdit">儲存</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
(function () {
  var API = '/api/admin/promo-camera-params';
  var CAT_API = '/api/admin/promo-camera-param-categories';
  var GROUP_API = '/api/admin/promo-camera-param-groups';
  var GROUPABLE_KEYS = ['film_simulation', 'lens'];
  var FALLBACK_CATEGORIES = [
    { key: 'camera_brand', name: '品牌色彩', sort_order: 10, is_active: true, meta: { ui_type: 'dropdown' } },
    { key: 'film_simulation', name: '底片模擬', sort_order: 20, is_active: true, meta: { ui_type: 'dropdown', groupable: true } },
    { key: 'shooting_angle', name: '拍攝角度', sort_order: 30, is_active: true, meta: { ui_type: 'angle_buttons' } },
    { key: 'aperture', name: '光圈', sort_order: 40, is_active: true, meta: { ui_type: 'dropdown' } },
    { key: 'exposure_ev', name: 'EV 曝光', sort_order: 50, is_active: true, meta: { ui_type: 'dropdown' } },
    { key: 'lens', name: '鏡頭', sort_order: 60, is_active: true, meta: { ui_type: 'dropdown', groupable: true } },
    { key: 'aperture_blades', name: '光圈葉片', sort_order: 70, is_active: true, meta: { ui_type: 'dropdown' } }
  ];
  var categories = [];
  var items = [];
  var groups = [];
  var activeOptionTab = '';
  var editModal = null;
  var editGroupModal = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function catMeta(row, k) {
    var m = row && row.meta && typeof row.meta === 'object' ? row.meta : {};
    return m[k];
  }
  function catLabel(key) {
    var hit = categories.find(function (c) { return c.key === key; });
    return hit ? ((hit.name || key) + ' (' + key + ')') : key;
  }
  function isCategoryGroupable(key) {
    if (!key) return false;
    if (GROUPABLE_KEYS.indexOf(key) >= 0) return true;
    var cat = categories.find(function (c) { return c.key === key; });
    return !!(cat && catMeta(cat, 'groupable'));
  }
  function paramGroup(row) {
    var m = row && row.meta;
    return (m && typeof m === 'object' && m.group != null) ? String(m.group).trim() : '';
  }
  function paramGroupEn(row) {
    var m = row && row.meta;
    return (m && typeof m === 'object' && m.group_en != null) ? String(m.group_en).trim() : '';
  }
  function tabCategories() {
    var list = categories.length ? categories : FALLBACK_CATEGORIES;
    return list.filter(function (c) {
      if (c.is_active === false) return false;
      return (catMeta(c, 'ui_type') || 'dropdown') !== 'hidden';
    }).sort(function (a, b) {
      return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
    });
  }
  function showStatus(msg, ok) {
    var w = document.getElementById('statusWrap');
    document.getElementById('statusMsg').textContent = msg;
    w.classList.remove('d-none', 'alert-success', 'alert-danger');
    w.classList.add(ok ? 'alert-success' : 'alert-danger');
  }
  async function authHeaders() {
    if (!window.AuthService) return {};
    var session = await AuthService.getSession();
    var t = session && session.access_token;
    return t ? { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } : {};
  }
  function groupsForCategory(key) {
    return groups.filter(function (g) { return g.category === key; }).sort(function (a, b) {
      return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
    });
  }
  function groupNameById(id) {
    if (!id) return '';
    var hit = groups.find(function (g) { return g.id === id; });
    return hit ? (hit.name || hit.key || '') : '';
  }
  function optionCountForGroup(groupId) {
    return items.filter(function (r) { return r.group_id === groupId; }).length;
  }
  function fillGroupSelects() {
    var list = groupsForCategory(activeOptionTab);
    ['addGroupId', 'editGroupId'].forEach(function (selId) {
      var el = document.getElementById(selId);
      if (!el) return;
      var cur = el.value;
      el.innerHTML = '<option value="">（無分組）</option>' + list.map(function (g) {
        return '<option value="' + esc(g.id) + '">' + esc(g.name || g.key) + '</option>';
      }).join('');
      if (cur && list.some(function (g) { return g.id === cur; })) el.value = cur;
    });
  }
  function renderGroupList() {
    var card = document.getElementById('groupManageCard');
    var tb = document.getElementById('groupListBody');
    var empty = document.getElementById('groupListEmpty');
    var groupable = isCategoryGroupable(activeOptionTab);
    if (card) card.classList.toggle('d-none', !groupable);
    document.getElementById('groupCategoryLabel').textContent = activeOptionTab ? catLabel(activeOptionTab) : '—';
    if (!groupable) return;
    var list = groupsForCategory(activeOptionTab);
    if (!list.length) {
      tb.innerHTML = '';
      empty.classList.remove('d-none');
    } else {
      empty.classList.add('d-none');
      tb.innerHTML = list.map(function (g) {
        var cnt = optionCountForGroup(g.id);
        return '<tr>' +
          '<td><code>' + esc(g.key) + '</code></td>' +
          '<td>' + esc(g.name) + '</td>' +
          '<td class="small">' + esc(g.name_en || '—') + '</td>' +
          '<td>' + esc(g.sort_order) + '</td>' +
          '<td>' + (g.is_active !== false ? '啟用' : '停用') + '</td>' +
          '<td>' + cnt + '</td>' +
          '<td><button type="button" class="btn btn-sm btn-outline-primary btn-edit-grp" data-id="' + esc(g.id) + '">編輯</button> ' +
          '<button type="button" class="btn btn-sm btn-outline-danger btn-del-grp" data-id="' + esc(g.id) + '">刪</button></td></tr>';
      }).join('');
      tb.querySelectorAll('.btn-edit-grp').forEach(function (btn) {
        btn.addEventListener('click', function () { openEditGroup(btn.getAttribute('data-id')); });
      });
      tb.querySelectorAll('.btn-del-grp').forEach(function (btn) {
        btn.addEventListener('click', function () { delGroup(btn.getAttribute('data-id')); });
      });
    }
    fillGroupSelects();
  }
  function syncTabUi() {
    var key = activeOptionTab || '';
    document.getElementById('addCategory').value = key;
    document.getElementById('addCategoryLabel').textContent = key ? catLabel(key) : '—';
    var groupable = isCategoryGroupable(key);
    ['addGroupCol', 'editGroupCol'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('d-none', !groupable);
    });
    document.getElementById('groupFilterWrap').classList.toggle('d-none', !groupable);
    document.getElementById('groupableHint').classList.toggle('d-none', !groupable);
    document.getElementById('thGroup').classList.toggle('d-none', !groupable);
    renderGroupList();
  }
  function setActiveOptionTab(key) {
    activeOptionTab = key || '';
    syncTabUi();
    fillGroupFilter();
    renderList();
    document.querySelectorAll('#optionCategoryTabs .nav-link').forEach(function (btn) {
      var on = btn.getAttribute('data-cat') === activeOptionTab;
      btn.classList.toggle('active', on);
    });
  }
  function renderCategoryTabs() {
    var ul = document.getElementById('optionCategoryTabs');
    var tabs = tabCategories();
    if (!tabs.length) {
      ul.innerHTML = '<li class="nav-item"><span class="nav-link disabled text-muted">無參數</span></li>';
      return;
    }
    if (!activeOptionTab || !tabs.some(function (c) { return c.key === activeOptionTab; })) {
      activeOptionTab = tabs[0].key;
    }
    ul.innerHTML = tabs.map(function (c) {
      var active = c.key === activeOptionTab ? ' active' : '';
      var count = items.filter(function (r) { return r.category === c.key; }).length;
      return '<li class="nav-item"><button type="button" class="nav-link' + active + '" data-cat="' + esc(c.key) + '">' +
        esc(c.name || c.key) + ' <span class="badge text-bg-secondary ms-1">' + count + '</span></button></li>';
    }).join('');
    ul.querySelectorAll('.nav-link[data-cat]').forEach(function (btn) {
      btn.addEventListener('click', function () { setActiveOptionTab(btn.getAttribute('data-cat')); });
    });
    syncTabUi();
  }
  function fillGroupFilter() {
    var el = document.getElementById('filterGroup');
    var list = groupsForCategory(activeOptionTab);
    var cur = el.value;
    el.innerHTML = '<option value="">全部</option>' + list.map(function (g) {
      return '<option value="' + esc(g.id) + '">' + esc(g.name || g.key) + '</option>';
    }).join('');
    el.value = (cur && list.some(function (g) { return g.id === cur; })) ? cur : '';
  }
  async function loadCategories() {
    var headers = await authHeaders();
    var r = await fetch(CAT_API, { headers: headers, cache: 'no-store' });
    var d = await r.json().catch(function () { return {}; });
    if (r.ok && d.items && d.items.length) categories = d.items;
    else categories = FALLBACK_CATEGORIES.slice();
  }
  async function loadList() {
    var headers = await authHeaders();
    var r = await fetch(API, { headers: headers, cache: 'no-store' });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '載入失敗', false); return; }
    if (d.category_defs && d.category_defs.length) categories = d.category_defs;
    else if (!categories.length) await loadCategories();
    items = d.items || [];
    groups = d.groups || [];
    if (d.groups_migration_hint) showStatus(d.groups_migration_hint, false);
    renderCategoryTabs();
    fillGroupFilter();
    renderList();
  }
  async function loadGroupsOnly() {
    var headers = await authHeaders();
    var r = await fetch(GROUP_API + '?category=' + encodeURIComponent(activeOptionTab || ''), { headers: headers, cache: 'no-store' });
    var d = await r.json().catch(function () { return {}; });
    if (r.ok) groups = d.items || [];
  }
  function renderList() {
    var groupFilter = document.getElementById('filterGroup').value || '';
    var groupable = isCategoryGroupable(activeOptionTab);
    var filtered = items.filter(function (row) {
      if (row.category !== activeOptionTab) return false;
      if (!groupFilter) return true;
      return String(row.group_id || '') === groupFilter;
    });
    var tb = document.getElementById('listBody');
    var emptyHint = document.getElementById('listEmptyHint');
    if (!filtered.length) {
      tb.innerHTML = '';
      emptyHint.classList.remove('d-none');
    } else {
      emptyHint.classList.add('d-none');
      tb.innerHTML = filtered.map(function (row) {
        var frag = (row.prompt_fragment || '').trim();
        var short = frag.length > 40 ? frag.slice(0, 40) + '…' : (frag || '—');
        var g = paramGroup(row);
        var ge = paramGroupEn(row);
        return '<tr>' +
          '<td class="small' + (groupable ? '' : ' d-none') + '">' + esc(g || '—') + (ge ? ('<div class="text-muted">EN: ' + esc(ge) + '</div>') : '') + '</td>' +
          '<td><code>' + esc(row.key) + '</code></td><td>' + esc(row.name) + '</td><td class="small">' + esc(row.name_en || '—') + '</td>' +
          '<td class="small">' + esc(short) + '</td><td>' + (row.is_default ? '✓' : '') + '</td><td>' + esc(row.sort_order) + '</td>' +
          '<td>' + (row.is_active !== false ? '啟用' : '停用') + '</td>' +
          '<td><button type="button" class="btn btn-sm btn-outline-primary btn-edit" data-id="' + esc(row.id) + '">編輯</button> ' +
          '<button type="button" class="btn btn-sm btn-outline-danger btn-del" data-id="' + esc(row.id) + '">刪</button></td></tr>';
      }).join('');
    }
    tb.querySelectorAll('.btn-edit').forEach(function (btn) {
      btn.addEventListener('click', function () { openEdit(btn.getAttribute('data-id')); });
    });
    tb.querySelectorAll('.btn-del').forEach(function (btn) {
      btn.addEventListener('click', function () { delRow(btn.getAttribute('data-id')); });
    });
    document.querySelectorAll('#optionCategoryTabs .nav-link[data-cat]').forEach(function (btn) {
      var key = btn.getAttribute('data-cat');
      var badge = btn.querySelector('.badge');
      if (badge) badge.textContent = String(items.filter(function (r) { return r.category === key; }).length);
    });
  }
  function openEdit(id) {
    var row = items.find(function (x) { return x.id === id; });
    if (!row) return;
    document.getElementById('editId').value = row.id;
    document.getElementById('editCategory').value = row.category;
    document.getElementById('editKey').value = row.key;
    document.getElementById('editName').value = row.name || '';
    document.getElementById('editNameEn').value = row.name_en || '';
    document.getElementById('editSort').value = row.sort_order || 0;
    document.getElementById('editDefault').checked = !!row.is_default;
    document.getElementById('editActive').checked = row.is_active !== false;
    document.getElementById('editFragment').value = row.prompt_fragment || '';
    document.getElementById('editDesc').value = row.description || '';
    document.getElementById('editDescEn').value = row.description_en || '';
    fillGroupSelects();
    document.getElementById('editGroupId').value = row.group_id || '';
    var groupable = isCategoryGroupable(row.category);
    document.getElementById('editGroupCol').classList.toggle('d-none', !groupable);
    if (!editModal) editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
  }
  function buildOptionPayload(prefix) {
    return {
      category: document.getElementById(prefix + 'Category').value || activeOptionTab,
      key: document.getElementById(prefix + 'Key').value,
      name: document.getElementById(prefix + 'Name').value,
      name_en: document.getElementById(prefix + 'NameEn').value,
      prompt_fragment: document.getElementById(prefix + 'Fragment').value,
      description: document.getElementById(prefix + 'Desc').value,
      description_en: document.getElementById(prefix + 'DescEn').value,
      group_id: document.getElementById(prefix + 'GroupId').value || null,
      sort_order: parseInt(document.getElementById(prefix + 'Sort').value, 10) || 0,
      is_default: document.getElementById(prefix + 'Default').checked,
      is_active: document.getElementById(prefix + 'Active').checked
    };
  }
  async function delRow(id) {
    if (!confirm('確定刪除此選項？')) return;
    var headers = await authHeaders();
    var r = await fetch(API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: headers });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '刪除失敗', false); return; }
    showStatus('已刪除選項', true);
    loadList();
  }
  function openEditGroup(id) {
    var row = groups.find(function (x) { return x.id === id; });
    if (!row) return;
    document.getElementById('editGrpId').value = row.id;
    document.getElementById('editGrpKey').value = row.key || '';
    document.getElementById('editGrpName').value = row.name || '';
    document.getElementById('editGrpNameEn').value = row.name_en || '';
    document.getElementById('editGrpSort').value = row.sort_order || 0;
    document.getElementById('editGrpActive').checked = row.is_active !== false;
    if (!editGroupModal) editGroupModal = new bootstrap.Modal(document.getElementById('editGroupModal'));
    editGroupModal.show();
  }
  async function delGroup(id) {
    if (!confirm('確定刪除此分組？（若仍有選項使用中會失敗）')) return;
    var headers = await authHeaders();
    var r = await fetch(GROUP_API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: headers });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '刪除失敗', false); return; }
    showStatus('已刪除分組', true);
    loadList();
  }
  document.getElementById('btnAddGroup').addEventListener('click', async function () {
    if (!activeOptionTab) return;
    var payload = {
      category: activeOptionTab,
      key: document.getElementById('grpKey').value,
      name: document.getElementById('grpName').value,
      name_en: document.getElementById('grpNameEn').value,
      sort_order: parseInt(document.getElementById('grpSort').value, 10) || 0,
      is_active: document.getElementById('grpActive').checked
    };
    var headers = await authHeaders();
    var r = await fetch(GROUP_API, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '新增分組失敗', false); return; }
    showStatus('已新增分組', true);
    document.getElementById('grpKey').value = '';
    document.getElementById('grpName').value = '';
    document.getElementById('grpNameEn').value = '';
    loadList();
  });
  document.getElementById('btnSaveGroupEdit').addEventListener('click', async function () {
    var id = document.getElementById('editGrpId').value;
    var payload = {
      key: document.getElementById('editGrpKey').value,
      name: document.getElementById('editGrpName').value,
      name_en: document.getElementById('editGrpNameEn').value,
      sort_order: parseInt(document.getElementById('editGrpSort').value, 10) || 0,
      is_active: document.getElementById('editGrpActive').checked
    };
    var headers = await authHeaders();
    var r = await fetch(GROUP_API + '/' + encodeURIComponent(id), { method: 'PUT', headers: headers, body: JSON.stringify(payload) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '儲存失敗', false); return; }
    if (editGroupModal) editGroupModal.hide();
    showStatus('已儲存分組', true);
    loadList();
  });
  document.getElementById('btnAdd').addEventListener('click', async function () {
    if (!activeOptionTab) return;
    var payload = buildOptionPayload('add');
    payload.category = activeOptionTab;
    var headers = await authHeaders();
    var r = await fetch(API, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '新增失敗', false); return; }
    showStatus('已新增', true);
    loadList();
  });
  document.getElementById('btnSaveEdit').addEventListener('click', async function () {
    var id = document.getElementById('editId').value;
    var headers = await authHeaders();
    var r = await fetch(API + '/' + encodeURIComponent(id), { method: 'PUT', headers: headers, body: JSON.stringify(buildOptionPayload('edit')) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { showStatus(d.error || '儲存失敗', false); return; }
    if (editModal) editModal.hide();
    showStatus('已儲存', true);
    loadList();
  });
  document.getElementById('btnReload').addEventListener('click', loadList);
  document.getElementById('filterGroup').addEventListener('change', renderList);
  loadCategories().then(loadList);
})();
  </script>
</body>
</html>
