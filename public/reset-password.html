<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>設定密碼 - MatchDO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/img/favicon.ico" rel="icon">
  <link href="/iStudio-1.0.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
    .card-box { background: #fff; border-radius: 16px; padding: 2.5rem; max-width: 440px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <div class="card-box">
    <h2 class="h4 mb-2">設定／重設密碼</h2>
    <p class="text-muted small mb-3">設定後可用 Email＋密碼登入，<strong>Google 登入仍然保留</strong>，兩種方式都指向同一個帳號。</p>
    <div id="alertBox"></div>
    <div id="waitBox" class="text-muted small mb-3">正在確認重設連結…</div>
    <form id="form" style="display:none;">
      <div class="mb-3">
        <label class="form-label">新密碼（至少 6 字）</label>
        <input type="password" class="form-control" id="pw1" required minlength="6" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label class="form-label">再輸入一次</label>
        <input type="password" class="form-control" id="pw2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btn">儲存密碼</button>
    </form>
    <p class="small mt-3 mb-0"><a href="/login.html">返回登入</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script>
    function show(msg, type) {
      var el = document.getElementById('alertBox');
      el.innerHTML = '<div class="alert alert-' + (type || 'info') + ' py-2">' + msg + '</div>';
    }
    function isRecovery() {
      var hash = window.location.hash || '';
      var q = window.location.search || '';
      return hash.indexOf('type=recovery') !== -1 || q.indexOf('type=recovery') !== -1 || hash.indexOf('access_token') !== -1;
    }
    async function waitSession() {
      if (isRecovery()) await new Promise(function (r) { setTimeout(r, 700); });
      if (!window.AuthService) return null;
      return AuthService.getSession();
    }
    waitSession().then(function (session) {
      document.getElementById('waitBox').style.display = 'none';
      if (!session) {
        show('連結無效或已過期。請回登入頁再點「忘記密碼」重寄一封。', 'warning');
        return;
      }
      document.getElementById('form').style.display = '';
    });
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var a = document.getElementById('pw1').value;
      var b = document.getElementById('pw2').value;
      if (a.length < 6) { show('密碼至少 6 個字元', 'warning'); return; }
      if (a !== b) { show('兩次密碼不一致', 'warning'); return; }
      var btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        await AuthService.updatePassword(a);
        show('密碼已設定。之後可用 Google 或 Email＋密碼登入同一個帳號。正在前往登入頁…', 'success');
        setTimeout(function () { location.href = '/login.html'; }, 1200);
      } catch (err) {
        show((err && err.message) || '儲存失敗', 'danger');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
