<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title data-i18n="authPage.resetPageTitle">設定密碼 - MatchDO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/ga4-loader.js?v=20260917ga4" async></script>
  <link href="/img/favicon.ico" rel="icon">
  <link href="/iStudio-1.0.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F0F0F0; }
    .card-box { background: #fff; border-radius: 16px; padding: 2.5rem; max-width: 440px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <div class="card-box">
    <h2 class="h4 mb-2" data-i18n="authPage.resetHeading">設定／重設密碼</h2>
    <p class="text-muted small mb-3" data-i18n-html="authPage.resetHint">設定後可用 Email＋密碼登入，<strong>Google 登入仍然保留</strong>，兩種方式都指向同一個帳號。</p>
    <div id="alertBox"></div>
    <div id="waitBox" class="text-muted small mb-3" data-i18n="authPage.resetVerifying">正在確認重設連結…</div>
    <form id="form" style="display:none;">
      <div class="mb-3">
        <label class="form-label" data-i18n="authPage.passwordMinLabel">新密碼（至少 6 字）</label>
        <input type="password" class="form-control" id="pw1" required minlength="6" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label class="form-label" data-i18n="authPage.passwordAgain">再輸入一次</label>
        <input type="password" class="form-control" id="pw2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btn" data-i18n="profile.savePassword">儲存密碼</button>
    </form>
    <p class="small mt-3 mb-0"><a href="/login.html" data-i18n="authPage.backToLogin">返回登入</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    function tr(k, fb) {
      if (window.i18n && window.i18n.t) {
        var v = window.i18n.t(k);
        if (v && v !== k) return v;
      }
      return fb != null ? fb : k;
    }
    function applyResetI18n() {
      if (window.i18n && window.i18n.applyPage) window.i18n.applyPage();
      document.title = tr('authPage.resetPageTitle', document.title);
    }
    var _resetI18nReady = (window.i18n && window.i18n.ready) ? window.i18n.ready : Promise.resolve();
    _resetI18nReady.then(applyResetI18n);

    function show(msg, type) {
      var el = document.getElementById('alertBox');
      el.innerHTML = '<div class="alert alert-' + (type || 'info') + ' py-2">' + msg + '</div>';
    }
    function isRecovery() {
      var hash = window.location.hash || '';
      var q = window.location.search || '';
      return hash.indexOf('type=recovery') !== -1 || q.indexOf('type=recovery') !== -1 || hash.indexOf('access_token') !== -1;
    }
    async function waitSession() {
      if (isRecovery()) await new Promise(function (r) { setTimeout(r, 700); });
      if (!window.AuthService) return null;
      return AuthService.getSession();
    }
    waitSession().then(function (session) {
      document.getElementById('waitBox').style.display = 'none';
      if (!session) {
        show(tr('authPage.resetInvalidLink', '連結無效或已過期…'), 'warning');
        return;
      }
      document.getElementById('form').style.display = '';
    });
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var a = document.getElementById('pw1').value;
      var b = document.getElementById('pw2').value;
      if (a.length < 6) { show(tr('profile.passwordTooShort', '密碼至少 6 個字元'), 'warning'); return; }
      if (a !== b) { show(tr('profile.passwordMismatch', '兩次密碼不一致'), 'warning'); return; }
      var btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        await AuthService.updatePassword(a);
        show(tr('authPage.resetSaved', '密碼已設定…'), 'success');
        setTimeout(function () { location.href = '/login.html'; }, 1200);
      } catch (err) {
        show((err && err.message) || tr('authPage.resetSaveFail', '儲存失敗'), 'danger');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
