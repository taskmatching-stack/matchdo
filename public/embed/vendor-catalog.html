<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>數位原型試做 - MATCHDO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --embed-brand: #445D7E; --embed-dark: #2d4059; }
        html, body { margin: 0; min-height: 480px; background: #f8fafc; }
        .embed-shell { min-height: 480px; display: flex; flex-direction: column; }
        .embed-header {
            background: #fff; border-bottom: 1px solid rgba(68,93,126,.12);
            padding: .75rem 1rem;
        }
        .embed-header-logo {
            width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
            background: #f0f4f8; flex-shrink: 0;
        }
        .embed-header-logo-ph {
            width: 36px; height: 36px; border-radius: 8px; background: #e8ecf0;
            display: flex; align-items: center; justify-content: center; color: var(--embed-brand);
            flex-shrink: 0;
        }
        .embed-tagline { font-size: .78rem; color: #6c757d; }
        .embed-body { flex: 1; padding: .75rem 1rem 1rem; }
        .catalog-pill {
            display: inline-block; padding: .3rem .75rem; border-radius: 20px;
            font-size: .78rem; border: 1px solid rgba(68,93,126,.25); background: #fff;
            color: var(--embed-brand); cursor: pointer; transition: all .15s; margin: 0 .25rem .35rem 0;
        }
        .catalog-pill:hover, .catalog-pill.active { background: var(--embed-brand); color: #fff; border-color: var(--embed-brand); }
        .portfolio-card {
            border: 1px solid rgba(68,93,126,.15); border-radius: 12px; overflow: hidden;
            background: #fff; transition: transform .15s, box-shadow .15s; height: 100%;
            display: flex; flex-direction: column;
        }
        .portfolio-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(68,93,126,.1); }
        .vendor-asset-thumb {
            width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f0f4f8;
        }
        .portfolio-no-img {
            width: 100%; aspect-ratio: 1; background: #f0f4f8;
            display: flex; align-items: center; justify-content: center; color: #adb5bd; font-size: 1.75rem;
        }
        .vendor-asset-card .btn { font-size: .78rem; }
        .embed-footer {
            border-top: 1px solid rgba(68,93,126,.1); padding: .5rem 1rem; background: #fff;
            font-size: .72rem; color: #6c757d; text-align: center;
        }
        .embed-footer a { color: var(--embed-brand); text-decoration: none; }
        .embed-footer a:hover { text-decoration: underline; }
        @media (max-width: 575.98px) {
            .embed-body { padding: .5rem .65rem .75rem; }
        }
    </style>
</head>
<body>
    <div class="embed-shell">
        <header class="embed-header" id="embedHeader" style="display:none;">
            <div class="d-flex align-items-center gap-2">
                <div id="embedLogoWrap"></div>
                <div class="min-w-0 flex-grow-1">
                    <div class="fw-semibold text-truncate" id="embedMfrName" style="color:var(--embed-dark);font-size:.95rem;">—</div>
                    <div class="embed-tagline" id="embedTagline">選擇款式後，將前往 MATCHDO 試做與生圖</div>
                </div>
            </div>
            <div id="embedCatalogNav" class="mt-2 d-flex flex-wrap align-items-center"></div>
        </header>

        <main class="embed-body">
            <div id="embedLoading" class="text-center py-5">
                <div class="spinner-border text-secondary mb-2" role="status" style="width:2rem;height:2rem;"></div>
                <p class="text-muted small mb-0">載入款式中…</p>
            </div>
            <div id="embedError" class="text-center py-5 d-none">
                <i class="bi bi-exclamation-circle text-muted" style="font-size:2rem;"></i>
                <p class="text-muted small mt-2 mb-0" id="embedErrorMsg">找不到廠商或尚無公開款式。</p>
            </div>
            <div id="embedEmpty" class="text-center py-5 d-none">
                <i class="bi bi-grid-3x3-gap text-muted" style="font-size:2rem;"></i>
                <p class="text-muted small mt-2 mb-0">尚無公開的數位原型。</p>
            </div>
            <div id="embedGrid" class="row g-2 g-md-3 d-none"></div>
        </main>

        <footer class="embed-footer">
            <span>Powered by </span><a href="https://matchdo.cc/" target="_blank" rel="noopener noreferrer">MATCHDO 合做</a>
            <span id="embedProfileLinkWrap"></span>
        </footer>
    </div>

    <script src="/js/vendor-asset-share-urls.js"></script>
    <script>
    (function () {
        var BUILD = 'vendor-embed-catalog-20260626';
        var params = new URLSearchParams(window.location.search);
        var mfrId = (params.get('manufacturer_id') || '').trim();
        var activeGroupId = (params.get('catalog_group_id') || '').trim();
        var lang = (params.get('lang') || '').trim().toLowerCase();
        if (lang !== 'en') lang = 'zh';

        var mfrName = '';
        var mfrLogo = '';
        var catalogFlat = [];
        var listItems = [];

        function esc(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function t(zh, en) { return lang === 'en' ? (en || zh) : zh; }
        function langQ() { return lang === 'en' ? '&lang=en' : ''; }

        function showError(msg) {
            document.getElementById('embedLoading').classList.add('d-none');
            document.getElementById('embedGrid').classList.add('d-none');
            document.getElementById('embedEmpty').classList.add('d-none');
            var el = document.getElementById('embedError');
            el.classList.remove('d-none');
            if (msg) document.getElementById('embedErrorMsg').textContent = msg;
        }

        function ctaUrl(item, type) {
            var Share = window.VendorAssetShareUrls;
            var origin = window.location.origin;
            var enriched = Object.assign({}, item, { manufacturer_id: mfrId || item.manufacturer_id });
            var url = '';
            if (type === 'design') {
                url = (item.design_share_url && String(item.design_share_url).trim())
                    ? String(item.design_share_url).trim()
                    : (Share && Share.buildShareDesignUrl
                        ? Share.buildShareDesignUrl(enriched, origin, { vendorName: mfrName })
                        : '/custom-product.html?tab=product-design&prototype_asset_id=' + encodeURIComponent(item.id));
            } else {
                url = (item.guide_share_url && String(item.guide_share_url).trim())
                    ? String(item.guide_share_url).trim()
                    : (Share && Share.buildShareGuideUrl ? Share.buildShareGuideUrl(enriched, origin) : '');
            }
            if (Share && Share.appendEmbedUtm && url) url = Share.appendEmbedUtm(url);
            return url;
        }

        function vendorAssetImageItems(item) {
            if (!item) return [];
            if (item.image_items && item.image_items.length) {
                return item.image_items.filter(function (it) { return it && it.url; });
            }
            var urls = (item.image_urls && item.image_urls.length) ? item.image_urls.filter(Boolean)
                : (item.image_url ? [item.image_url] : []);
            return urls.map(function (u, idx) {
                return { url: u, sort_order: idx, is_cover: idx === 0 };
            });
        }

        function renderCatalogNav() {
            var nav = document.getElementById('embedCatalogNav');
            if (!nav) return;
            var protoGroups = catalogFlat.filter(function (g) { return !g.asset_kind || g.asset_kind === 'prototype'; });
            if (!protoGroups.length) {
                nav.innerHTML = '';
                return;
            }
            var allLbl = t('全部', 'All');
            var html = '<button type="button" class="catalog-pill' + (!activeGroupId ? ' active' : '') + '" data-group="">' + esc(allLbl) + '</button>';
            protoGroups.forEach(function (g) {
                var active = activeGroupId === g.id ? ' active' : '';
                html += '<button type="button" class="catalog-pill' + active + '" data-group="' + esc(g.id) + '">' +
                    esc(g.name) + (g.asset_count ? ' (' + g.asset_count + ')' : '') + '</button>';
            });
            nav.innerHTML = html;
            nav.querySelectorAll('.catalog-pill').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activeGroupId = btn.getAttribute('data-group') || '';
                    loadAssets();
                    renderCatalogNav();
                });
            });
        }

        function renderGrid(items) {
            document.getElementById('embedLoading').classList.add('d-none');
            document.getElementById('embedError').classList.add('d-none');
            var grid = document.getElementById('embedGrid');
            var empty = document.getElementById('embedEmpty');
            var protos = (items || []).filter(function (it) {
                var k = (it.asset_kind || 'prototype').toLowerCase();
                return k === 'prototype';
            });
            if (!protos.length) {
                grid.classList.add('d-none');
                empty.classList.remove('d-none');
                return;
            }
            empty.classList.add('d-none');
            grid.classList.remove('d-none');
            grid.innerHTML = '';
            var designLbl = t('用此款試做', 'Try this design');
            var guideLbl = t('看可搭配', 'View options');
            protos.forEach(function (item) {
                var col = document.createElement('div');
                col.className = 'col-6 col-md-4 col-xl-3';
                var imageItems = vendorAssetImageItems(item);
                var imgUrl = (imageItems[0] && imageItems[0].url) || item.image_url || '';
                var designUrl = ctaUrl(item, 'design');
                var guideUrl = ctaUrl(item, 'guide');
                var showGuide = window.VendorAssetShareUrls && window.VendorAssetShareUrls.shouldShowGuideLink
                    ? window.VendorAssetShareUrls.shouldShowGuideLink(item)
                    : !!(item.link_count > 0 || item.guide_share_url);
                var capBadges = '';
                if (item.production_type_label) {
                    capBadges += '<span class="badge bg-info-subtle text-info border me-1 mb-1" style="font-size:.62rem;">' + esc(item.production_type_label) + '</span>';
                }
                (item.capabilities || []).slice(0, 3).forEach(function (cap) {
                    var lbl = cap && (cap.label || cap.name_zh) ? (cap.label || cap.name_zh) : '';
                    if (lbl) capBadges += '<span class="badge bg-light text-secondary border me-1 mb-1" style="font-size:.62rem;">' + esc(lbl) + '</span>';
                });
                var multiBadge = imageItems.length > 1
                    ? '<span class="badge bg-dark position-absolute top-0 start-0 m-1" style="z-index:2;font-size:.62rem;">' + imageItems.length + '</span>' : '';
                var thumbHtml = imgUrl
                    ? '<div class="position-relative"><a href="' + esc(designUrl) + '" target="_top" rel="noopener noreferrer" class="d-block">' + multiBadge +
                      '<img src="' + esc(imgUrl) + '" class="vendor-asset-thumb" loading="lazy" alt=""></a></div>'
                    : '<div class="portfolio-no-img"><i class="bi bi-image"></i></div>';
                var guideBtn = showGuide && guideUrl
                    ? '<a href="' + esc(guideUrl) + '" target="_top" rel="noopener noreferrer" class="btn btn-sm btn-outline-secondary w-100">' + esc(guideLbl) + '</a>'
                    : '';
                col.innerHTML = '<div class="portfolio-card vendor-asset-card">' + thumbHtml +
                    '<div class="p-2 flex-grow-1 d-flex flex-column">' +
                    (item.title ? '<div class="fw-semibold small text-truncate mb-1" style="color:#2d4059" title="' + esc(item.title) + '">' + esc(item.title) + '</div>' : '') +
                    (capBadges ? '<div class="mb-1">' + capBadges + '</div>' : '') +
                    '<div class="d-grid gap-1 mt-auto pt-1">' +
                    '<a href="' + esc(designUrl) + '" target="_top" rel="noopener noreferrer" class="btn btn-sm btn-primary w-100">' + esc(designLbl) + '</a>' +
                    guideBtn +
                    '</div></div></div>';
                grid.appendChild(col);
            });
        }

        function loadAssets() {
            document.getElementById('embedLoading').classList.remove('d-none');
            document.getElementById('embedGrid').classList.add('d-none');
            document.getElementById('embedEmpty').classList.add('d-none');
            document.getElementById('embedError').classList.add('d-none');
            var url = '/api/vendor-assets?manufacturer_id=' + encodeURIComponent(mfrId) +
                '&for_profile=1&asset_kind=prototype' + langQ();
            if (activeGroupId) url += '&catalog_group_id=' + encodeURIComponent(activeGroupId);
            fetch(url).then(function (r) { return r.json(); }).then(function (data) {
                listItems = (data && data.items) ? data.items : [];
                renderGrid(listItems);
            }).catch(function () {
                showError(t('載入失敗，請稍後再試。', 'Failed to load. Please try again.'));
            });
        }

        function initHeader(mfr) {
            mfrName = (lang === 'en' && mfr.name_en) ? mfr.name_en : (mfr.name || '');
            mfrLogo = mfr.logo_url || '';
            document.getElementById('embedMfrName').textContent = mfrName || '—';
            document.getElementById('embedTagline').textContent = t(
                '選擇款式後，將前往 MATCHDO 試做與生圖',
                'Select a style to try design and generate on MATCHDO'
            );
            var logoWrap = document.getElementById('embedLogoWrap');
            if (mfrLogo) {
                logoWrap.innerHTML = '<img src="' + esc(mfrLogo) + '" alt="" class="embed-header-logo">';
            } else {
                logoWrap.innerHTML = '<div class="embed-header-logo-ph"><i class="bi bi-building"></i></div>';
            }
            var profileUrl = '/vendor-profile.html?id=' + encodeURIComponent(mfrId) + (lang === 'en' ? '&lang=en' : '');
            document.getElementById('embedProfileLinkWrap').innerHTML =
                ' · <a href="' + esc(profileUrl) + '" target="_top" rel="noopener noreferrer">' +
                esc(t('廠商頁', 'Vendor page')) + '</a>';
            document.getElementById('embedHeader').style.display = '';
            document.title = (mfrName || 'MATCHDO') + ' - ' + t('數位原型試做', 'Design prototypes');
        }

        if (!mfrId) {
            showError(t('請提供 manufacturer_id 參數。', 'Missing manufacturer_id parameter.'));
        } else {
            fetch('/api/manufacturers/' + encodeURIComponent(mfrId) + langQ())
                .then(function (r) {
                    if (!r.ok) throw new Error('mfr');
                    return r.json();
                })
                .then(function (mfr) {
                    initHeader(mfr);
                    return fetch('/api/manufacturers/' + encodeURIComponent(mfrId) + '/catalog-groups' + langQ())
                        .then(function (r) { return r.ok ? r.json() : { flat: [] }; })
                        .then(function (cg) {
                            catalogFlat = (cg && cg.flat) ? cg.flat : [];
                            renderCatalogNav();
                            loadAssets();
                        });
                })
                .catch(function () {
                    showError(t('找不到廠商或尚無公開款式。', 'Vendor not found or no public styles.'));
                });
        }
        window.__MATCHDO_EMBED_CATALOG_BUILD = BUILD;
    })();
    </script>
</body>
</html>
