<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Embed 預覽（模擬官網 iframe）- MATCHDO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9ecef; min-height: 100vh; }
        .fake-site-header {
            background: #fff; border-bottom: 1px solid #dee2e6; padding: .75rem 1rem;
            font-weight: 600; color: #333;
        }
        .fake-site-content { max-width: 960px; margin: 0 auto; padding: 1rem; }
        .embed-frame-wrap {
            background: #fff; border-radius: 8px; border: 1px solid #dee2e6;
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        iframe { display: block; width: 100%; border: 0; min-height: 640px; }
    </style>
</head>
<body>
    <div class="fake-site-header">模擬廠商官網（外層頁面）</div>
    <div class="fake-site-content">
        <p class="text-muted small mb-2">此頁用於驗收 iframe 嵌入：下方 iframe 載入 <code>/embed/vendor-catalog.html</code>。點「用此款試做」應以 <code>target=_top</code> 跳至 Matchdo 全頁。</p>
        <div class="mb-2">
            <label class="form-label small mb-1">manufacturer_id</label>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control font-monospace" id="mfrIdInput" placeholder="廠商 UUID">
                <button type="button" class="btn btn-primary" id="btnReload">載入 iframe</button>
            </div>
        </div>
        <div class="embed-frame-wrap">
            <iframe id="embedFrame" title="Matchdo 數位原型試做" loading="lazy"></iframe>
        </div>
        <p class="text-muted small mt-3 mb-0">建議在 320px、768px、1280px 寬度下檢視 RWD；並確認僅公開上架原型出現於卡片列表。</p>
    </div>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var input = document.getElementById('mfrIdInput');
        var frame = document.getElementById('embedFrame');
        input.value = (params.get('manufacturer_id') || '').trim();
        function reload() {
            var id = (input.value || '').trim();
            if (!id) {
                frame.removeAttribute('src');
                return;
            }
            var url = '/embed/vendor-catalog.html?manufacturer_id=' + encodeURIComponent(id);
            if (params.get('lang')) url += '&lang=' + encodeURIComponent(params.get('lang'));
            frame.src = url;
            var u = new URL(window.location.href);
            u.searchParams.set('manufacturer_id', id);
            window.history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
        }
        document.getElementById('btnReload').addEventListener('click', reload);
        if (input.value) reload();
    })();
    </script>
</body>
</html>
