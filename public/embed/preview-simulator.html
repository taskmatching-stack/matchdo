<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>嵌入式模擬器 - 預覽測試</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      padding: 1rem;
    }
    .preview-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #2d4059;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .info {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info.collapsed {
      padding: 0.5rem 1rem;
    }
    .info.collapsed .info-content {
      display: none;
    }
    .info h2 {
      font-size: 1rem;
      color: #7B8FA1;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .info.collapsed h2 {
      margin-bottom: 0;
    }
    .info h2 .toggle-icon {
      transition: transform 0.2s;
    }
    .info.collapsed h2 .toggle-icon {
      transform: rotate(180deg);
    }
    .info p {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0.25rem 0;
    }
    .info code {
      background: #f1f5f9;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .iframe-wrapper {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 800px;
      border: none;
      display: block;
    }
    @media (max-width: 767.98px) {
      iframe {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>🎨 嵌入式模擬器 - 預覽測試</h1>
    
    <div class="info collapsed">
      <h2 onclick="this.parentElement.classList.toggle('collapsed')">
        <span>📌 測試說明</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="info-content">
        <p>此頁面模擬廠商網站嵌入 iframe 的效果。</p>
        <p><strong>測試模式：</strong>使用假資料 <code>?mock=1</code></p>
        <p><strong>真實模式：</strong>需要後端 API（Phase B 完成後）</p>
        <p><strong>功能測試：</strong></p>
        <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
          <li>點擊主產品卡片複選（藍框＋打勾，最多 3 個）</li>
          <li>選擇材料（單選）+ 配件（複選）</li>
          <li>勾選工藝（刺繡、絲印、燙金、雷射）</li>
          <li>輸入參考圖（5 個槽位）</li>
          <li>輸入描述 → 點擊「立即生成」</li>
          <li>查看模擬成圖（3 秒延遲）</li>
        </ul>
      </div>
    </div>
    
    <div class="iframe-wrapper">
      <iframe src="/embed/simulator.html?mock=1"></iframe>
    </div>
  </div>
</body>
</html>
