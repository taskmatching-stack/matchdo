<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>登入中… - MatchDO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f0f0f0; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #ddd; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>登入成功，正在導向…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
  <script src="/config/auth-config.js"></script>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = new URLSearchParams(search);
      var hasCode = params.has('code');
      var hasTokens = hash.indexOf('access_token') !== -1 || hash.indexOf('refresh_token') !== -1;
      var isRecovery = hash.indexOf('type=recovery') !== -1 || search.indexOf('type=recovery') !== -1;
      var oauthError = params.get('error') || params.get('error_description');

      function go() {
        if (isRecovery) {
          window.location.replace('/reset-password.html' + hash + search);
          return;
        }
        var url = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('auth_return_url')) || '/index.html';
        try { if (sessionStorage) sessionStorage.removeItem('auth_return_url'); } catch (e) {}
        if (!url || url === '/login.html' || url.indexOf('login') !== -1) url = '/index.html';
        if (url.charAt(0) !== '/') url = '/' + url;
        window.location.replace(url);
      }

      function failLogin() {
        window.location.replace('/login.html?oauth=failed');
      }

      function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      async function waitForSession(maxAttempts) {
        var attempts = maxAttempts || 20;
        for (var i = 0; i < attempts; i++) {
          try {
            if (window.AuthService) {
              var session = await AuthService.getSession();
              if (session && session.access_token) return session;
            }
          } catch (e) {}
          await wait(250);
        }
        return null;
      }

      async function tryGo() {
        if (oauthError) {
          failLogin();
          return;
        }
        if (!window.AuthService) {
          go();
          return;
        }
        try {
          if (hasCode && window.supabaseClient && window.supabaseClient.auth) {
            var code = params.get('code');
            if (code && typeof window.supabaseClient.auth.exchangeCodeForSession === 'function') {
              await window.supabaseClient.auth.exchangeCodeForSession(code);
            }
          }
          var session = await waitForSession(hasCode || hasTokens ? 24 : 8);
          if (session) go();
          else failLogin();
        } catch (e) {
          failLogin();
        }
      }

      if (hasTokens || hasCode || oauthError) {
        setTimeout(tryGo, hasCode ? 150 : 900);
      } else {
        tryGo();
      }
    })();
  </script>
</body>
</html>
