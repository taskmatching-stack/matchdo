<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title data-i18n="profile.accountPageTitle">帳號資訊 - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="../img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Space+Grotesk&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config/auth-config.js"></script>
    <script src="/js/auth-middleware.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div id="site-header"></div>

    <div class="container-fluid page-title-bar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h3 class="mb-0 text-dark" data-i18n="profile.accountTitle">帳號資訊</h3>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/index.html" data-i18n="profile.breadcrumbHome">首頁</a></li>
                        <li class="breadcrumb-item active" data-i18n="profile.accountBreadcrumb">帳號資訊</li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-xxl py-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div id="auth-alert" class="alert alert-warning d-none"><span data-i18n="profile.authPrefix">請先</span> <a href="/index.html" class="alert-link" data-i18n="credits.loginRequiredLink">登入</a><span data-i18n="profile.authSuffix">。</span></div>
                    <div id="main-content" class="d-none">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i><span data-i18n="profile.myAccount">我的帳號</span></h5>
                            </div>
                            <div class="card-body p-4">
                                <dl class="row mb-0">
                                    <dt class="col-sm-3 text-muted" data-i18n="profile.email">Email</dt>
                                    <dd class="col-sm-9" id="profile-email">—</dd>
                                    <dt class="col-sm-3 text-muted" data-i18n="profile.displayName">顯示名稱</dt>
                                    <dd class="col-sm-9" id="profile-name">—</dd>
                                    <dt class="col-sm-3 text-muted" data-i18n="profile.role">角色</dt>
                                    <dd class="col-sm-9" id="profile-role">—</dd>
                                    <dt class="col-sm-3 text-muted" data-i18n="profile.currentCredits">目前點數</dt>
                                    <dd class="col-sm-9" id="profile-credits">—</dd>
                                </dl>
                                <hr>
                                <h6 class="text-muted mb-2"><i class="bi bi-telephone me-2"></i><span data-i18n="profile.contactSection">聯絡資訊</span></h6>
                                <div id="profile-contact-wrap" class="mb-3">
                                    <p class="text-muted small mb-0" id="profile-contact-empty" data-i18n="profile.contactEmpty">尚未填寫，請至「聯絡資訊設定」填寫。</p>
                                    <dl class="row mb-0 d-none" id="profile-contact-dl"></dl>
                                </div>
                                <a href="/profile/contact-info.html" class="btn btn-outline-primary"><i class="bi bi-telephone me-2"></i><span data-i18n="nav.contactSettings">聯絡資訊設定</span></a>
                                <a href="/credits.html" class="btn btn-outline-secondary ms-2"><i class="bi bi-currency-exchange me-2"></i><span data-i18n="nav.myCredits">我的點數</span></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site-header.js?v=20260807-i18n1"></script>
    <script>
    (function () {
        function t(key, fb) {
            var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
            return (v && v !== key) ? v : (fb || key);
        }
        function tf(key, fb, map) {
            var s = t(key, fb);
            if (map) Object.keys(map).forEach(function (k) {
                s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), String(map[k]));
            });
            return s;
        }
        function bootI18n() {
            if (window.i18n && window.i18n.ready) {
                window.i18n.ready.then(function () {
                    if (window.i18n.applyPage) window.i18n.applyPage();
                    var titleEl = document.querySelector('title[data-i18n]');
                    if (titleEl) document.title = t(titleEl.getAttribute('data-i18n'), titleEl.textContent);
                });
            }
        }
        bootI18n();
        async function getToken() {
            if (typeof AuthService === 'undefined') return null;
            try {
                var s = await AuthService.getSession();
                return (s && (s.access_token || (s.session && s.session.access_token))) || null;
            } catch (e) { return null; }
        }
        async function init() {
            var token = await getToken();
            if (!token) {
                document.getElementById('auth-alert').classList.remove('d-none');
                return;
            }
            document.getElementById('main-content').classList.remove('d-none');
            var headers = { Authorization: 'Bearer ' + token };
            try {
                var profileRes = await fetch('/api/me/profile', { headers: headers });
                var creditsRes = await fetch('/api/me/credits', { headers: headers });
                var contactRes = await fetch('/api/me/contact-info', { headers: headers });
                if (!profileRes.ok) throw new Error(t('profile.loadFailed', '載入失敗'));
                var p = await profileRes.json();
                document.getElementById('profile-email').textContent = p.email || '—';
                document.getElementById('profile-name').textContent = p.full_name || '—';
                var roleKey = p.role === 'admin' ? 'profile.roleAdmin' : (p.role === 'tester' ? 'profile.roleTester' : 'profile.roleUser');
                document.getElementById('profile-role').textContent = t(roleKey, p.role || '—');

                if (creditsRes.ok) {
                    var cred = await creditsRes.json();
                    document.getElementById('profile-credits').textContent = (cred.balance != null ? cred.balance : 0) + ' ' + t('nav.pointsUnit', '點');
                } else {
                    document.getElementById('profile-credits').textContent = '0 ' + t('nav.pointsUnit', '點');
                }

                var contact = contactRes.ok ? await contactRes.json() : {};
                var contactLabels = {
                    company_name: t('profile.companyName', '公司/工作室名稱'),
                    phone: t('profile.phone', '市話'),
                    mobile: t('profile.mobile', '手機'),
                    email: t('profile.email', 'Email'),
                    line_id: 'LINE ID',
                    wechat_id: 'WeChat',
                    telegram_id: 'Telegram',
                    website_url: t('profile.website', '官網'),
                    facebook_url: 'Facebook',
                    instagram_url: 'Instagram'
                };
                var contactOrder = ['company_name', 'phone', 'mobile', 'email', 'line_id', 'wechat_id', 'telegram_id', 'website_url', 'facebook_url', 'instagram_url'];
                var hasAny = false;
                var dl = document.getElementById('profile-contact-dl');
                var emptyEl = document.getElementById('profile-contact-empty');
                contactOrder.forEach(function (key) {
                    var val = contact[key];
                    if (val && String(val).trim()) {
                        hasAny = true;
                        var dt = document.createElement('dt');
                        dt.className = 'col-sm-3 text-muted small';
                        dt.textContent = (contactLabels[key] || key) + ': ';
                        var dd = document.createElement('dd');
                        dd.className = 'col-sm-9 small mb-1';
                        dd.textContent = String(val).trim();
                        dl.appendChild(dt);
                        dl.appendChild(dd);
                    }
                });
                if (hasAny) {
                    emptyEl.classList.add('d-none');
                    dl.classList.remove('d-none');
                }
            } catch (e) {
                document.getElementById('main-content').innerHTML = '<div class="alert alert-danger">' +
                    tf('profile.loadFailed', '載入失敗：{msg}', { msg: e.message || t('credits.loginRequiredLink', '請重新登入') }) + '</div>';
            }
        }
        if (window.i18n && window.i18n.ready) {
            window.i18n.ready.then(init).catch(init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
