<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title data-i18n="authPage.registerTitle">註冊 - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="註冊 MATCHDO 合做會員，開始使用客製產品設計與廠商媒合服務。">
    <link rel="canonical" href="https://matchdo.cc/register.html">
    <script src="/js/ga4-loader.js?v=20260917ga4" async></script>

    <!-- Favicon -->
    <link href="/img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Space+Grotesk&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="iStudio-1.0.0/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
        }

        .register-container {
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .register-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
            text-align: center;
        }

        .register-card .subtitle {
            color: #666;
            margin-bottom: 50px;
            text-align: center;
            font-size: 16px;
        }

        .role-card {
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
            text-align: center;
        }

        .role-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .role-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ebff 100%);
        }

        .role-card .icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .role-card h4 {
            color: #333;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .role-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }

        .role-card ul {
            text-align: left;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        .role-card ul li {
            margin-bottom: 8px;
        }

        .btn-continue {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 18px;
            margin-top: 40px;
            transition: all 0.3s ease;
        }

        .btn-continue:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-continue:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .user-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .user-info .info {
            flex: 1;
        }

        .user-info .name {
            font-weight: 600;
            color: #333;
        }

        .user-info .email {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-card">
            <h2 data-i18n="authPage.registerHeadline">歡迎加入 MatchDO 合做！</h2>
            <p class="subtitle" data-i18n="authPage.registerSubtitle">登入或註冊後即可使用發案、接案等所有功能，無需選擇身份。</p>

            <!-- 未登入時：登入/註冊 -->
            <div id="pleaseLogin">
                <p class="text-center text-muted mb-3" data-i18n="authPage.registerDualLogin">Google 與 Email＋密碼都可註冊／登入，同一個 Email 是同一個帳號。</p>
                <div class="text-center mb-4">
                <button type="button" class="btn btn-outline-primary" onclick="signUpWithGoogle()">
                    <i class="bi bi-google me-1"></i><span data-i18n="authPage.googleRegister">使用 Google 註冊／登入</span>
                </button>
                </div>
                <div class="text-center text-muted small mb-3" data-i18n="authPage.orEmailRegister">或用 Email 註冊</div>
                <form id="emailRegisterForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail" required placeholder="your@email.com" autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="authPage.passwordMinLabel">密碼（至少 6 字）</label>
                        <input type="password" class="form-control" id="regPassword" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="authPage.passwordAgain">再輸入一次密碼</label>
                        <input type="password" class="form-control" id="regPassword2" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="regBtn" data-i18n="authPage.emailRegisterSubmit">Email 註冊</button>
                    <div id="regAlert" class="mt-3"></div>
                </form>
            </div>

            <!-- 已登入：顯示歡迎並導向首頁 -->
            <div id="welcomeDone" class="text-center py-4" style="display: none;">
                <p class="mb-3" data-i18n="authPage.registerRedirecting">已完成，正在為您導向首頁…</p>
                <div class="spinner-border text-primary" role="status"></div>
            </div>

            <div class="text-center mt-4">
                <small class="text-muted"><span data-i18n="authPage.haveAccount">已有帳號？</span> <a href="login.html" class="text-primary fw-bold" data-i18n="authPage.signInLink">立即登入</a></small>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
    
    <!-- Auth Config -->
    <script src="config/auth-config.js"></script>
    <script src="/js/i18n.js"></script>

    <script>
        function tr(k, fb) {
            if (window.i18n && window.i18n.t) {
                var v = window.i18n.t(k);
                if (v && v !== k) return v;
            }
            return fb != null ? fb : k;
        }
        function applyRegisterI18n() {
            if (window.i18n && window.i18n.applyPage) window.i18n.applyPage();
            document.title = tr('authPage.registerTitle', document.title);
        }
        var _regI18nReady = (window.i18n && window.i18n.ready) ? window.i18n.ready : Promise.resolve();
        _regI18nReady.then(applyRegisterI18n);

        async function signUpWithGoogle() {
            try {
                await AuthService.signInWithGoogle();
            } catch (e) {
                console.error('Google 註冊失敗:', e);
                alert(tr('authPage.googleRegisterFail', 'Google 註冊失敗：') + (e?.message || e));
            }
        }

        window.addEventListener('load', async () => {
            const currentUser = await AuthService.getCurrentUser();
            if (!currentUser) {
                return;
            }

            document.getElementById('welcomeDone').style.display = 'block';
            document.getElementById('pleaseLogin').style.display = 'none';

            try {
                if (typeof AuthService.createOrUpdateUser === 'function') {
                    await AuthService.createOrUpdateUser(currentUser.id, {
                        email: currentUser.email,
                        full_name: currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || ''
                    });
                }
            } catch (e) {
                console.warn('建立用戶資料:', e?.message || e);
            }
            window.location.href = '/index.html';
        });

        document.getElementById('emailRegisterForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = (document.getElementById('regEmail').value || '').trim();
            var pw = document.getElementById('regPassword').value;
            var pw2 = document.getElementById('regPassword2').value;
            var box = document.getElementById('regAlert');
            function msg(html, kind) {
                box.innerHTML = '<div class="alert alert-' + (kind || 'info') + ' py-2 mb-0">' + html + '</div>';
            }
            if (pw.length < 6) { msg(tr('profile.passwordTooShort', '密碼至少 6 個字元'), 'warning'); return; }
            if (pw !== pw2) { msg(tr('profile.passwordMismatch', '兩次密碼不一致'), 'warning'); return; }
            var btn = document.getElementById('regBtn');
            btn.disabled = true;
            try {
                var result = await AuthService.signUpWithEmail(email, pw);
                if (result && result.session) {
                    msg(tr('authPage.registerSuccess', '註冊成功，正在進入…'), 'success');
                    setTimeout(function () { location.href = '/index.html'; }, 400);
                    return;
                }
                msg(tr('authPage.registerVerifyEmail', '已送出。若此站有開 Email 驗證…'), 'success');
            } catch (err) {
                var m = (err && err.message) || '';
                if (/already registered/i.test(m) || /User already registered/i.test(m)) {
                    msg(tr('authPage.registerAlreadyExists', '此 Email 已有帳號…'), 'warning');
                } else {
                    msg(tr('authPage.registerFailPrefix', '註冊失敗：') + m, 'danger');
                }
            } finally {
                btn.disabled = false;
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
