<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>瀏覽可訂製款式 - MATCHDO 合做</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="瀏覽廠商公開的數位原型款式，查看可搭配材料與配件後開始訂製設計。">
    <link rel="icon" href="/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/browse-styles.css" rel="stylesheet">
    <script src="/js/i18n.js"></script>
</head>
<body class="browse-styles-page">
    <div id="site-header"></div>
    <div class="container-fluid page-title-bar py-3 bg-light border-bottom">
        <div class="container">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1 class="h4 mb-0 fw-bold" data-i18n="browseStyles.pageTitle">瀏覽可訂製款式</h1>
                    <p class="text-muted small mb-0" data-i18n="browseStyles.pageIntro">選一款數位原型，查看廠商已關聯的材料與配件，再開始產品設計。</p>
                </div>
                <a href="/custom-product.html" class="btn btn-sm btn-outline-secondary flex-shrink-0">
                    <i class="bi bi-arrow-left me-1"></i><span data-i18n="browseStyles.backDesign">返回產品設計</span>
                </a>
            </div>
        </div>
    </div>
    <div class="container py-3">
        <div id="bs-vendor-banner" class="bs-vendor-banner mb-3 d-none"></div>
        <div class="bs-filters mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small mb-1" for="bs-filter-category" data-i18n="browseStyles.filterCategory">主分類</label>
                    <select id="bs-filter-category" class="form-select form-select-sm">
                        <option value="" data-i18n="browseStyles.filterAll">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-1" for="bs-filter-subcategory" data-i18n="browseStyles.filterSubcategory">子分類</label>
                    <select id="bs-filter-subcategory" class="form-select form-select-sm" disabled>
                        <option value="" data-i18n="browseStyles.filterAll">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-1" for="bs-filter-vendor" data-i18n="browseStyles.filterVendor">廠商</label>
                    <select id="bs-filter-vendor" class="form-select form-select-sm">
                        <option value="" data-i18n="browseStyles.filterAllVendors">全部廠商</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-1" for="bs-filter-q" data-i18n="browseStyles.filterSearch">搜尋</label>
                    <input type="search" id="bs-filter-q" class="form-control form-control-sm" data-i18n-placeholder="browseStyles.searchPlaceholder" placeholder="款式或廠商名稱">
                </div>
            </div>
        </div>
        <div id="bs-alert" class="alert alert-warning d-none"></div>
        <div id="bs-loading" class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div><span data-i18n="browseStyles.loading">載入中…</span>
        </div>
        <div id="bs-empty" class="text-center py-5 text-muted d-none">
            <i class="bi bi-inbox display-6 d-block mb-2 opacity-50"></i>
            <p class="mb-2" data-i18n="browseStyles.empty">目前沒有符合條件的公開款式。</p>
            <a href="/custom-product.html" class="btn btn-sm btn-primary" data-i18n="browseStyles.goDesign">前往產品設計</a>
        </div>
        <div id="bs-grid" class="bs-grid d-none"></div>
        <nav id="bs-pager" class="d-flex justify-content-center gap-2 mt-4 d-none" aria-label="pagination"></nav>
    </div>
    <script src="/js/site-header.js" defer></script>
    <script src="/js/browse-styles.js?v=1" defer></script>
</body>
</html>
