    <script>
    (function () {
        var id = new URLSearchParams(location.search).get('id');
        if (!id) { showError(); return; }

        function profileContentLang() {
            var qp = new URLSearchParams(location.search).get('lang');
            if (qp && String(qp).toLowerCase().indexOf('en') === 0) return 'en';
            if (window.i18n && typeof window.i18n.getLang === 'function') {
                var gl = window.i18n.getLang();
                if (gl && String(gl).toLowerCase().indexOf('en') === 0) return 'en';
            }
            return 'zh';
        }

        function langQuerySuffix() {
            return profileContentLang() === 'en' ? '&lang=en' : '';
        }

        function fetchManufacturer(token) {
            var headers = {};
            if (token) headers['Authorization'] = 'Bearer ' + token;
            var url = '/api/manufacturers/' + encodeURIComponent(id) + (profileContentLang() === 'en' ? '?lang=en' : '');
            return fetch(url, { headers: headers });
        }

        function loadProfile() {
            var p = (typeof AuthService !== 'undefined')
                ? AuthService.getSession().then(function (s) {
                    var token = s && (s.access_token || (s.session && s.session.access_token));
                    return fetchManufacturer(token);
                }).catch(function () { return fetchManufacturer(null); })
                : fetchManufacturer(null);
            p.then(function (r) {
                if (r.ok) return r.json();
                return r.json().catch(function () { return {}; }).then(function (body) {
                    return Promise.reject({ status: r.status, message: (body && body.error) || '無法載入' });
                });
            })
            .then(function (data) {
                try {
                    renderProfile(data);
                } catch (err) {
                    console.error('renderProfile error:', err);
                    showError(404, err.message);
                }
            })
            .catch(function (err) {
                var status = (err && err.status) || 0;
                var msg = (err && err.message) || '';
                showError(status, msg);
            });
        }
        loadProfile();

        function showError(status, detail) {
            document.getElementById('pageLoading').classList.add('d-none');
            var errEl = document.getElementById('pageError');
            errEl.classList.remove('d-none');
            var msgEl = errEl.querySelector('p');
            if (msgEl) {
                var is404 = status === 404 || (detail && String(detail).indexOf('不存在') !== -1);
                var is500 = status === 500;
                if (is500) {
                    msgEl.innerHTML = '暫時無法載入廠商資料，請稍後再試。';
                } else {
                    msgEl.innerHTML = '找不到此廠商，或已下架。';
                }
                var safeId = (id || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                msgEl.innerHTML += '<br><small class="d-block mt-2 text-muted">此連結的廠商 ID：' + (safeId ? '<code class="user-select-all">' + safeId + '</code>' : '—') + '</small>';
                msgEl.innerHTML += '<br><small class="d-block mt-1">若您是廠商，請至首頁「我的功能」→「製作方」→「建立廠商資料」先建立一筆廠商；建立後用同一個網址即可開啟此頁。</small>';
            }
        }

        function starsHTML(rating) {
            if (!rating) return '';
            var full = Math.round(rating);
            var s = '';
            for (var i = 1; i <= 5; i++) s += i <= full ? '★' : '☆';
            return s + ' <span style="color:#fff;opacity:.8;font-size:.85em;">' + rating.toFixed(1) + '</span>';
        }

        var _vendorUserId = null;
        var _vendorProfileMfrId = null;
        var _vendorProfileMfrName = '';
        // 全域暴露，供 onclick 呼叫
        window.contactVendor = function() {
            if (!_vendorUserId) return;
            if (typeof window.gtag === 'function') { window.gtag('event', 'contact_vendor', { page: 'vendor_profile' }); }
            if (typeof AuthService !== 'undefined') {
                AuthService.getSession().then(function(s) {
                    var token = s && (s.access_token || (s.session && s.session.access_token));
                    if (!token) { window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.href); return; }
                    window.location.href = '/client/messages.html?open=' + encodeURIComponent(_vendorUserId);
                }).catch(function() {
                    window.location.href = '/login.html';
                });
            } else {
                window.location.href = '/login.html';
            }
        };

        function renderProfile(v) {
            _vendorProfileMfrId = v.id || null;
            _vendorProfileMfrName = v.name || '';
            document.getElementById('pageLoading').classList.add('d-none');
            document.getElementById('profileBody').classList.remove('d-none');
            document.getElementById('profileHero').style.display = '';

            // 更新頁籤標題
            var pageTitle = (v.name || '廠商詳情') + ' - MATCHDO 合做';
            document.title = pageTitle;

            // 動態更新 SEO meta
            var canonicalUrl = 'https://matchdo.cc/vendor-profile.html?id=' + encodeURIComponent(v.id || id);
            var ogImg = v.logo_url || v.cover_image || v.avatar_url || 'https://matchdo.cc/img/og-vendors.jpg';
            var desc = v.specialty
                ? (v.name || '') + '：' + String(v.specialty).slice(0, 100) + '。在 MATCHDO 合做聯繫廠商。'
                : '在 MATCHDO 合做找到 ' + (v.name || '') + '，瀏覽廠商作品、服務地區與聯繫方式。';
            function setMeta(sel, attr, val) {
                var el = document.querySelector(sel);
                if (el) el.setAttribute(attr, val);
            }
            setMeta('meta[name="description"]', 'content', desc);
            setMeta('meta[property="og:title"]', 'content', pageTitle);
            setMeta('meta[property="og:description"]', 'content', desc);
            setMeta('meta[property="og:image"]', 'content', ogImg);
            setMeta('meta[property="og:url"]', 'content', canonicalUrl);
            setMeta('meta[name="twitter:title"]', 'content', pageTitle);
            setMeta('meta[name="twitter:description"]', 'content', desc);
            setMeta('meta[name="twitter:image"]', 'content', ogImg);
            var canEl = document.getElementById('canonicalTag');
            if (canEl) canEl.href = canonicalUrl;
            var hzEl = document.getElementById('hreflangZh');
            if (hzEl) hzEl.href = canonicalUrl;
            var heEl = document.getElementById('hreflangEn');
            if (heEl) heEl.href = canonicalUrl + '&lang=en';

            // LocalBusiness JSON-LD
            var contact = v.contact || {};
            var ld = {
                '@context': 'https://schema.org',
                '@type': 'LocalBusiness',
                'name': v.name || '',
                'description': v.specialty || v.description || '',
                'url': canonicalUrl,
                'image': ogImg !== 'https://matchdo.cc/img/og-vendors.jpg' ? ogImg : undefined,
                'address': {
                    '@type': 'PostalAddress',
                    'addressCountry': 'TW',
                    'addressRegion': v.location || v.manufacturer_location || ''
                }
            };
            if (contact.phone) ld.telephone = contact.phone;
            if (contact.email) ld.email = contact.email;
            if (contact.url) ld.sameAs = contact.url;
            if (v.rating) {
                ld.aggregateRating = { '@type': 'AggregateRating', 'ratingValue': v.rating, 'bestRating': 5, 'ratingCount': 1 };
            }
            var ldEl = document.getElementById('vendorJsonLd');
            if (!ldEl) {
                ldEl = document.createElement('script');
                ldEl.type = 'application/ld+json';
                ldEl.id = 'vendorJsonLd';
                document.head.appendChild(ldEl);
            }
            ldEl.textContent = JSON.stringify(ld);

            // 頂部聯絡按鈕：僅有站內帳號（user_id）才顯示「站內聯絡廠商」
            // 沒有 user_id → 按鈕保持隱藏（聯絡資訊已在下方「聯繫 & 社群」區塊顯示）
            _vendorUserId = v.user_id || null;
            var contactBtn = document.getElementById('btnContactVendor');
            if (contactBtn && _vendorUserId) {
                contactBtn.classList.remove('d-none');
            }
            // 用此廠商版型設計：連到產品設計頁並帶 manufacturer_id，設計頁可從此廠商版型庫導入
            var btnDesignBase = document.getElementById('btnDesignWithVendorBase');
            if (btnDesignBase && v.id) {
                btnDesignBase.href = '/custom-product.html?tab=vendor-styles&manufacturer_id=' + encodeURIComponent(v.id) + '&vendor_name=' + encodeURIComponent(v.name || '');
                btnDesignBase.classList.remove('d-none');
            }
            var btnGallery = document.getElementById('btnViewPortfolio');
            if (btnGallery) {
                btnGallery.href = '#sectionPortfolio';
                btnGallery.addEventListener('click', function (e) {
                    var target = document.getElementById('sectionPortfolio');
                    if (!target) return;
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }

            // Hero（頭像：有 logo_url 顯示圖片，否則顯示預設圖示）
            var heroAvatar = document.getElementById('heroAvatar');
            if (heroAvatar) {
                var logoUrl = (v.logo_url || '').trim();
                if (logoUrl && /^https?:\/\//i.test(logoUrl)) {
                    var img = document.createElement('img');
                    img.src = logoUrl;
                    img.alt = '';
                    img.loading = 'lazy';
                    heroAvatar.innerHTML = '';
                    heroAvatar.appendChild(img);
                } else {
                    heroAvatar.innerHTML = '<i class="bi bi-building"></i>';
                }
            }
            document.getElementById('heroName').textContent = v.name || '廠商';
            if (v.verified) document.getElementById('heroBadge').classList.remove('d-none');
            if (v.rating) document.getElementById('heroRating').innerHTML = starsHTML(v.rating);
            if (v.location) {
                document.getElementById('heroLocationText').textContent = v.location;
                document.getElementById('heroLocation').classList.remove('d-none');
            }

            // 簡介（API 回傳 specialty = description）
            var specialty = (v.specialty || v.description || '').trim();
            var descEl = document.getElementById('vendorDesc');
            var sectionDescEl = document.getElementById('sectionDesc');
            if (descEl) descEl.textContent = specialty || '此廠商尚未填寫簡介。';
            if (sectionDescEl) sectionDescEl.style.display = '';

            // 服務地區（contact.service_area 陣列 or 字串，分組顯示）
            var contact = v.contact || {};
            var areas = contact.service_area;
            if (areas) {
                if (typeof areas === 'string') areas = areas.split(/[,，、\s]+/).map(function(s){return s.trim();}).filter(Boolean);
                if (Array.isArray(areas) && areas.length > 0) {
                    var areaEl = document.getElementById('vendorAreas');
                    var isEn = (document.documentElement.lang || '').startsWith('en');
                    var lang = isEn ? 'en' : 'zh';
                    var ac = window.AreaCodes;
                    var groups = (ac && ac.groups) || [];

                    // 將 DB 中的值轉成 code（相容舊版中文字串）
                    var codes = areas.map(function(a) { return (ac && ac.zhToCode) ? ac.zhToCode(a) : a; });

                    // 依 area-codes.js 分組
                    var grouped = [], usedCodes = {};
                    groups.forEach(function(g) {
                        var matched = (g.cities || []).filter(function(c){ return codes.indexOf(c.code) >= 0; });
                        if (matched.length > 0) {
                            grouped.push({
                                label: isEn ? g.en : g.zh,
                                items: matched.map(function(c){ return isEn ? c.en : c.zh; })
                            });
                            matched.forEach(function(c){ usedCodes[c.code] = true; });
                        }
                    });
                    var ungrouped = codes.filter(function(c){ return !usedCodes[c]; })
                        .map(function(c){ return (ac && ac.getLabel) ? ac.getLabel(c, lang) : c; });

                    var html = '';
                    grouped.forEach(function(g) {
                        html += '<div class="d-flex align-items-center flex-wrap gap-1 mb-1">';
                        html += '<span class="text-muted me-1" style="font-size:.72rem;white-space:nowrap;">' + g.label + '：</span>';
                        g.items.forEach(function(a){ html += '<span class="area-tag">' + a + '</span>'; });
                        html += '</div>';
                    });
                    ungrouped.forEach(function(a){ html += '<span class="area-tag">' + a + '</span>'; });
                    areaEl.innerHTML = html;
                    document.getElementById('sectionArea').style.display = '';
                }
            }

            // 專業能力
            var caps = v.capabilities;
            if (caps) {
                if (typeof caps === 'string') caps = caps.split(/[,，、]+/).map(function(s){return s.trim();}).filter(Boolean);
                if (Array.isArray(caps) && caps.length > 0) {
                    var capEl = document.getElementById('vendorCaps');
                    caps.forEach(function (c) {
                        var span = document.createElement('span');
                        span.className = 'cap-tag';
                        span.textContent = c;
                        capEl.appendChild(span);
                    });
                    document.getElementById('sectionCaps').style.display = '';
                }
            }

            // 社群 & 聯繫
            var socialEl = document.getElementById('vendorSocial');
            var socialDefs = [
                { key: 'facebook',  cls: 'fb',     icon: 'bi-facebook',       label: 'Facebook', prefix: 'https://facebook.com/' },
                { key: 'instagram', cls: 'ig',     icon: 'bi-instagram',      label: 'Instagram', prefix: 'https://instagram.com/' },
                { key: 'twitter',   cls: 'x',      icon: 'bi-twitter-x',      label: 'X (Twitter)', prefix: 'https://x.com/' },
                { key: 'threads',   cls: 'threads',icon: 'bi-threads',        label: 'Threads',  prefix: 'https://threads.net/@' },
                { key: 'youtube',   cls: 'yt',     icon: 'bi-youtube',        label: 'YouTube',  prefix: 'https://youtube.com/' },
                { key: 'line_id',   cls: 'line',   icon: 'bi-line',           label: 'LINE',     prefix: 'https://line.me/ti/p/~' },
                { key: 'whatsapp',  cls: 'wa',     icon: 'bi-whatsapp',       label: 'WhatsApp', prefix: 'https://wa.me/' },
                { key: 'url',       cls: 'web',    icon: 'bi-globe2',         label: '官網',     prefix: '' },
                { key: 'email',     cls: 'email',  icon: 'bi-envelope-fill',  label: 'Email',    prefix: 'mailto:' },
                { key: 'phone',     cls: 'phone',  icon: 'bi-telephone-fill', label: '電話',     prefix: 'tel:' }
            ];
            var hasSocial = false;
            socialDefs.forEach(function (def) {
                var val = (contact[def.key] || '').trim();
                if (!val) return;
                hasSocial = true;
                var a = document.createElement('a');
                a.className = 'social-link ' + def.cls;
                var href = def.prefix
                    ? (val.startsWith('http') || val.startsWith('mailto:') || val.startsWith('tel:') ? val : def.prefix + val)
                    : val;
                a.href = href;
                a.target = (def.key === 'email' || def.key === 'phone') ? '_self' : '_blank';
                a.rel = 'noopener noreferrer';
                a.innerHTML = '<i class="bi ' + def.icon + ' si"></i>' + def.label;
                socialEl.appendChild(a);
            });
            var storeUrls = Array.isArray(contact.store_urls) ? contact.store_urls : [];
            var hasStoreName = storeUrls.some(function (item) {
                return item && String(item.store_name || item.label || item.name || item.title || '').trim();
            });
            if (!hasStoreName && Array.isArray(contact.shop_urls) && contact.shop_urls.length) {
                var names = contact.shop_names || [];
                storeUrls = contact.shop_urls.map(function (rawUrl, i) {
                    var url = String(rawUrl || '').trim();
                    if (url && !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) url = 'https://' + url.replace(/^\/+/, '');
                    return {
                        store_name: (names[i] != null ? String(names[i]) : '').trim(),
                        url: url
                    };
                }).filter(function (item) { return item.url; });
            }
            storeUrls.forEach(function (item) {
                var url = (item && item.url ? String(item.url) : '').trim();
                if (!url) return;
                var name = (item && (item.store_name || item.label || item.name || item.title) ? String(item.store_name || item.label || item.name || item.title) : '').trim();
                var display = name;
                if (!display) {
                    try {
                        var parsed = new URL(url.indexOf('://') >= 0 ? url : ('https://' + url));
                        display = parsed.hostname.replace(/^www\./i, '') || url;
                    } catch (e) {
                        display = url.length > 48 ? (url.slice(0, 45) + '…') : url;
                    }
                }
                hasSocial = true;
                var a = document.createElement('a');
                a.className = 'social-link shop';
                a.href = url.indexOf('://') >= 0 ? url : ('https://' + url.replace(/^\/+/, ''));
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.innerHTML = '<i class="bi bi-bag-check si"></i>' + escHtml(display);
                socialEl.appendChild(a);
            });
            if (hasSocial) document.getElementById('sectionSocial').style.display = '';

            // 作品集
            var portfolio = v.portfolio || [];
            var grid = document.getElementById('portfolioGrid');
            if (portfolio.length === 0) {
                document.getElementById('portfolioEmpty').classList.remove('d-none');
            } else {
                portfolio.forEach(function (p) {
                    var col = document.createElement('div');
                    col.className = 'col-sm-6 col-md-4';
                    var hasAfter = !!p.image_url;
                    var hasBefore = !!p.image_url_before;
                    var imgHTML = '';
                    if (hasAfter && hasBefore) {
                        imgHTML = '<div class="before-after-wrap">' +
                            '<div class="row g-1">' +
                            '<div class="col-6 position-relative">' +
                            '<img src="' + escHtml(p.image_url_before) + '" class="portfolio-img" style="aspect-ratio:1/1;" loading="lazy" alt="改前">' +
                            '<span class="before-label">改前</span></div>' +
                            '<div class="col-6 position-relative">' +
                            '<img src="' + escHtml(p.image_url) + '" class="portfolio-img" style="aspect-ratio:1/1;" loading="lazy" alt="改後">' +
                            '<span class="after-label">改後</span></div>' +
                            '</div></div>';
                    } else if (hasAfter) {
                        imgHTML = '<img src="' + escHtml(p.image_url) + '" class="portfolio-img" loading="lazy" alt="' + escHtml(p.title || '') + '">';
                    } else {
                        imgHTML = '<div class="portfolio-no-img"><i class="bi bi-image"></i></div>';
                    }
                    var tagList = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? (p.tags.split(/[,，、\s]+/).map(function(s){ return s.trim(); }).filter(Boolean)) : []);
                    var tagsHTML = tagList.map(function(t){ return '<span class="cap-tag">' + escHtml(t) + '</span>'; }).join('');
                    var moqN = p.min_order_quantity;
                    var moqBlock = '';
                    if (moqN != null && moqN !== '' && Number(moqN) >= 1) {
                        var moqText = (window.i18n && typeof window.i18n.t === 'function')
                            ? String(window.i18n.t('portfolio.moqLine')).replace(/\{n\}/g, String(moqN))
                            : ('最小可訂製：' + moqN + ' 件');
                        moqBlock = '<div class="text-muted small mt-1" style="font-size:.75rem;">' + escHtml(moqText) + '</div>';
                    }
                    col.innerHTML = '<div class="portfolio-card">' + imgHTML +
                        '<div class="p-2">' +
                        (p.title ? '<div class="fw-semibold small mb-1" style="color:#2d4059">' + escHtml(p.title) + '</div>' : '') +
                        moqBlock +
                        (p.design_highlight ? '<div class="text-muted small mb-1" style="font-size:.75rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">' + escHtml(p.design_highlight) + '</div>' : '') +
                        (tagsHTML ? '<div class="d-flex flex-wrap gap-1 mt-1">' + tagsHTML + '</div>' : '') +
                        '</div></div>';
                    grid.appendChild(col);
                });
            }

            loadVendorMaterialLibrary(v.id);
        }

        var vendorAssetsCatalogFlat = [];
        var vendorAssetsActiveGroupId = '';
        var vendorProfileListItems = [];
        var vendorProfilePageSize = 12;
        var vendorProfileOffset = 0;
        var VENDOR_PROFILE_PAGE_SIZE_KEY = 'matchdo.vendorProfilePageSize';

        function readVendorProfilePageSize() {
            try {
                var v = parseInt(localStorage.getItem(VENDOR_PROFILE_PAGE_SIZE_KEY), 10);
                if (v === 12 || v === 24 || v === 48) return v;
            } catch (_) {}
            return 12;
        }

        function setVendorProfilePageSize(n) {
            vendorProfilePageSize = n;
            try { localStorage.setItem(VENDOR_PROFILE_PAGE_SIZE_KEY, String(n)); } catch (_) {}
            document.querySelectorAll('.vendor-profile-page-size-btn').forEach(function (btn) {
                btn.classList.toggle('active', parseInt(btn.getAttribute('data-size'), 10) === n);
            });
        }

        function vpTr(k, fb) {
            if (window.i18n && typeof window.i18n.t === 'function') {
                var v = window.i18n.t(k);
                if (v && v !== k) return v;
            }
            return fb || k;
        }

        function updateVendorProfileListPager(total, offset, limit) {
            var rangeEl = document.getElementById('vendorProfileListRange');
            if (window.MatchdoOffsetPager && window.MatchdoOffsetPager.render) {
                window.MatchdoOffsetPager.render({
                    pagerEl: document.getElementById('vendorProfileListPager'),
                    prevEl: document.getElementById('vendorProfileListPrev'),
                    nextEl: document.getElementById('vendorProfileListNext'),
                    pageNumsEl: document.getElementById('vendorProfileListPageNums'),
                    infoEl: document.getElementById('vendorProfileListPageInfo'),
                    total: total,
                    offset: offset,
                    limit: limit,
                    pageInfoTemplate: vpTr('vendor.listPageInfo', '第 {page} / {total} 頁'),
                    onGoToPage: function (newOffset) {
                        vendorProfileOffset = newOffset;
                        renderVendorAssetsGrid(vendorProfileListItems);
                    }
                });
            }
            if (rangeEl) {
                if (total) {
                    var from = offset + 1;
                    var to = Math.min(offset + limit, total);
                    rangeEl.textContent = vpTr('vendor.listRange', '顯示 {from}–{to}，共 {total} 項')
                        .replace('{from}', String(from))
                        .replace('{to}', String(to))
                        .replace('{total}', String(total));
                    rangeEl.classList.remove('d-none');
                } else {
                    rangeEl.classList.add('d-none');
                }
            }
        }

        function vendorAssetsAuthHeaders() {
            return (typeof window.AuthService !== 'undefined' && typeof window.AuthService.getSession === 'function')
                ? window.AuthService.getSession().then(function (s) {
                    var h = {};
                    if (s && s.access_token) h.Authorization = 'Bearer ' + s.access_token;
                    return h;
                })
                : Promise.resolve({});
        }

        function loadVendorMaterialLibrary(mfrId) {
            var section = document.getElementById('sectionVendorAssets');
            if (!section || !mfrId) return;
            vendorAssetsAuthHeaders().then(function (authHdr) {
                fetch('/api/vendor-assets?manufacturer_id=' + encodeURIComponent(mfrId) + '&for_profile=1' + langQuerySuffix(), { headers: authHdr })
                    .then(function (r) { return r.json(); })
                    .then(function (assets) {
                        var items = (assets && assets.items) ? assets.items : [];
                        if (!items.length) return;
                        section.style.display = '';
                        vendorAssetsActiveGroupId = '';
                        vendorProfileOffset = 0;
                        vendorProfileListItems = items;
                        fetch('/api/manufacturers/' + encodeURIComponent(mfrId) + '/catalog-groups' + (profileContentLang() === 'en' ? '?lang=en' : ''))
                            .then(function (r) { return r.ok ? r.json() : { flat: [] }; })
                            .then(function (cg) {
                                vendorAssetsCatalogFlat = (cg && cg.flat) ? cg.flat : [];
                                renderVendorCatalogNav(mfrId);
                                renderVendorAssetsGrid(vendorProfileListItems);
                            })
                            .catch(function () {
                                vendorAssetsCatalogFlat = [];
                                renderVendorCatalogNav(mfrId);
                                renderVendorAssetsGrid(vendorProfileListItems);
                            });
                    })
                    .catch(function () {});
            });
        }

        function catalogGroupKind(g) {
            if (g && g.asset_kind === 'material') return 'material';
            if (g && g.asset_kind === 'part') return 'part';
            return 'prototype';
        }

        function renderVendorCatalogNav(mfrId) {
            var nav = document.getElementById('vendorCatalogNav');
            if (!nav) return;
            var allLabel = (window.i18n && typeof window.i18n.t === 'function')
                ? (window.i18n.t('vendor.catalogAll') || '全部')
                : '全部';
            var protoGroups = vendorAssetsCatalogFlat.filter(function (g) { return catalogGroupKind(g) === 'prototype'; });
            var partGroups = vendorAssetsCatalogFlat.filter(function (g) { return catalogGroupKind(g) === 'part'; });
            var matGroups = vendorAssetsCatalogFlat.filter(function (g) { return catalogGroupKind(g) === 'material'; });
            function pillRow(groups) {
                var row = '';
                groups.forEach(function (g) {
                    var active = vendorAssetsActiveGroupId === g.id ? ' active' : '';
                    row += '<button type="button" class="catalog-pill' + active + '" data-group="' + escHtml(g.id) + '">' +
                        escHtml(g.name) + (g.asset_count ? ' (' + g.asset_count + ')' : '') + '</button>';
                });
                return row;
            }
            var html = '<button type="button" class="catalog-pill' + (!vendorAssetsActiveGroupId ? ' active' : '') + '" data-group="">' + escHtml(allLabel) + '</button>';
            if (protoGroups.length) {
                var protoLabel = (window.i18n && typeof window.i18n.t === 'function')
                    ? (window.i18n.t('vendor.catalogPrototypeGroups') || '數位原型')
                    : '數位原型';
                html += '<span class="text-muted small align-self-center ms-1 me-1">' + escHtml(protoLabel) + '</span>' + pillRow(protoGroups);
            }
            if (partGroups.length) {
                var partLabel = (window.i18n && typeof window.i18n.t === 'function')
                    ? (window.i18n.t('vendor.catalogPartGroups') || '配件／零件')
                    : '配件／零件';
                html += '<span class="text-muted small align-self-center ms-2 me-1">' + escHtml(partLabel) + '</span>' + pillRow(partGroups);
            }
            if (matGroups.length) {
                var matLabel = (window.i18n && typeof window.i18n.t === 'function')
                    ? (window.i18n.t('vendor.catalogMaterialGroups') || '材料參考')
                    : '材料參考';
                html += '<span class="text-muted small align-self-center ms-2 me-1">' + escHtml(matLabel) + '</span>' + pillRow(matGroups);
            }
            if (!protoGroups.length && !matGroups.length) {
                vendorAssetsCatalogFlat.forEach(function (g) {
                    var active = vendorAssetsActiveGroupId === g.id ? ' active' : '';
                    html += '<button type="button" class="catalog-pill' + active + '" data-group="' + escHtml(g.id) + '">' +
                        escHtml(g.name) + (g.asset_count ? ' (' + g.asset_count + ')' : '') + '</button>';
                });
            }
            nav.innerHTML = html;
            nav.querySelectorAll('.catalog-pill').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    vendorAssetsActiveGroupId = btn.getAttribute('data-group') || '';
                    vendorProfileOffset = 0;
                    renderVendorCatalogNav(mfrId);
                    var url = '/api/vendor-assets?manufacturer_id=' + encodeURIComponent(mfrId) + '&for_profile=1' + langQuerySuffix();
                    if (vendorAssetsActiveGroupId) url += '&catalog_group_id=' + encodeURIComponent(vendorAssetsActiveGroupId);
                    vendorAssetsAuthHeaders().then(function (authHdr) {
                    fetch(url, { headers: authHdr }).then(function (r) { return r.json(); }).then(function (data) {
                        vendorProfileListItems = (data && data.items) ? data.items : [];
                        renderVendorAssetsGrid(vendorProfileListItems);
                    }).catch(function () { vendorProfileListItems = []; renderVendorAssetsGrid([]); });
                    });
                });
            });
        }

        function vendorAssetImageItems(item) {
            if (!item) return [];
            if (item.image_items && item.image_items.length) {
                return item.image_items.filter(function (it) { return it && it.url; });
            }
            var urls = (item.image_urls && item.image_urls.length) ? item.image_urls.filter(Boolean)
                : (item.image_url ? [item.image_url] : []);
            return urls.map(function (u, idx) {
                return { url: u, label: '', sort_order: idx, is_cover: idx === 0 };
            });
        }

        function buildVendorAssetDesignUrl(item) {
            var Share = window.VendorAssetShareUrls;
            if (!item || !item.id) return '/custom-product.html?tab=product-design';
            var enriched = Object.assign({}, item, {
                manufacturer_id: item.manufacturer_id || _vendorProfileMfrId || ''
            });
            if (Share && Share.buildShareDesignPath) {
                return Share.buildShareDesignPath(enriched, { vendorName: _vendorProfileMfrName || '' });
            }
            var kind = item.asset_kind || 'prototype';
            var url = '/custom-product.html?tab=product-design';
            if (enriched.manufacturer_id) url += '&manufacturer_id=' + encodeURIComponent(enriched.manufacturer_id);
            if (_vendorProfileMfrName) url += '&vendor_name=' + encodeURIComponent(_vendorProfileMfrName);
            if (kind === 'prototype') {
                url += '&prototype_asset_id=' + encodeURIComponent(item.id);
            } else {
                url += '&vendor_asset_id=' + encodeURIComponent(item.id);
            }
            if (item.category_key) url += '&category_key=' + encodeURIComponent(item.category_key);
            if (item.subcategory_key) url += '&subcategory_key=' + encodeURIComponent(item.subcategory_key);
            return url;
        }

        function buildVendorAssetGuideUrl(item) {
            var Share = window.VendorAssetShareUrls;
            if (!item || item.asset_kind !== 'prototype') return '';
            var lc = Share && Share.prototypeLinkCount
                ? Share.prototypeLinkCount(item)
                : (item.link_count != null ? Number(item.link_count) : (Number(item.material_count || 0) + Number(item.part_count || 0)));
            if (!lc) return '';
            if (Share && Share.buildShareGuidePath) return Share.buildShareGuidePath(item);
            return item.match_guide_url || ('/product-tree.html?prototype_asset_id=' + encodeURIComponent(item.id));
        }

        function renderVendorAssetsGrid(items) {
            var grid = document.getElementById('vendorAssetsGrid');
            var empty = document.getElementById('vendorAssetsEmpty');
            if (!grid || !empty) return;
            vendorProfileListItems = Array.isArray(items) ? items : vendorProfileListItems;
            var full = vendorProfileListItems;
            var total = full.length;
            var offset = vendorProfileOffset;
            if (offset >= total && total > 0) {
                offset = Math.max(0, total - (total % vendorProfilePageSize || vendorProfilePageSize));
                vendorProfileOffset = offset;
            }
            var pageItems = full.slice(offset, offset + vendorProfilePageSize);
            updateVendorProfileListPager(total, offset, vendorProfilePageSize);
            grid.innerHTML = '';
            if (!pageItems.length) {
                empty.classList.remove('d-none');
                return;
            }
            empty.classList.add('d-none');
            var designLbl = vpTr('browseStyles.selectForDesign', '用此款進行設計');
            var guideLbl = vpTr('browseStyles.viewMatchGuide', '看可搭配');
            pageItems.forEach(function (item) {
                var col = document.createElement('div');
                col.className = 'col-6 col-md-4 col-lg-3';
                var kind = item.asset_kind || 'prototype';
                var kindLabel = kind === 'material' ? vpTr('customProduct.assetKindMaterial', '材料') : (kind === 'part' ? vpTr('customProduct.assetKindPart', '配件／零件') : vpTr('customProduct.assetKindPrototype', '數位原型'));
                var cats = (item.catalog_groups || []).map(function (g) {
                    return '<span class="badge bg-light text-primary border border-primary border-opacity-25 me-1 mb-1" style="font-size:.65rem;">' + escHtml(g.name) + '</span>';
                }).join('');
                var capBadges = '';
                if (item.production_type_label) {
                    capBadges += '<span class="badge bg-info-subtle text-info border me-1 mb-1" style="font-size:.65rem;">' + escHtml(item.production_type_label) + '</span>';
                }
                (item.capabilities || []).forEach(function (cap) {
                    var lbl = cap && (cap.label || cap.name_zh) ? (cap.label || cap.name_zh) : '';
                    if (lbl) capBadges += '<span class="badge bg-light text-secondary border me-1 mb-1" style="font-size:.65rem;">' + escHtml(lbl) + '</span>';
                });
                var imageItems = vendorAssetImageItems(item);
                var imgUrl = (imageItems[0] && imageItems[0].url) || item.image_url || '';
                var designUrl = buildVendorAssetDesignUrl(item);
                var guideUrl = buildVendorAssetGuideUrl(item);
                var multiBadge = imageItems.length > 1
                    ? '<span class="badge bg-dark position-absolute top-0 start-0 m-1" style="z-index:2;font-size:.65rem;">' + imageItems.length + ' 張</span>' : '';
                var thumbHtml = imgUrl
                    ? '<div class="position-relative"><a href="' + escHtml(designUrl) + '" class="vendor-asset-thumb-link d-block">' + multiBadge +
                    '<img src="' + escHtml(imgUrl) + '" class="vendor-asset-thumb" loading="lazy" alt=""></a></div>'
                    : '<div class="portfolio-no-img" style="aspect-ratio:1;"><i class="bi bi-image"></i></div>';
                var guideBtn = guideUrl
                    ? '<a href="' + escHtml(guideUrl) + '" class="btn btn-sm btn-outline-secondary w-100">' + escHtml(guideLbl) + '</a>'
                    : '';
                col.innerHTML = '<div class="portfolio-card vendor-asset-card h-100">' +
                    thumbHtml +
                    '<div class="p-2 flex-grow-1 d-flex flex-column">' +
                    '<span class="badge bg-light text-secondary border mb-1 align-self-start" style="font-size:.65rem;">' + escHtml(kindLabel) + '</span>' +
                    (item.title ? '<div class="fw-semibold small text-truncate mb-1" style="color:#2d4059" title="' + escHtml(item.title) + '">' + escHtml(item.title) + '</div>' : '') +
                    (capBadges ? '<div class="mb-1">' + capBadges + '</div>' : '') +
                    (cats ? '<div class="mb-1">' + cats + '</div>' : '') +
                    '<div class="d-grid gap-1 mt-auto pt-2">' +
                    '<a href="' + escHtml(designUrl) + '" class="btn btn-sm btn-primary w-100">' + escHtml(designLbl) + '</a>' +
                    guideBtn +
                    '</div></div></div>';
                grid.appendChild(col);
            });
        }

        function escHtml(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        setVendorProfilePageSize(readVendorProfilePageSize());
        document.querySelectorAll('.vendor-profile-page-size-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var n = parseInt(btn.getAttribute('data-size'), 10);
                if (n !== 12 && n !== 24 && n !== 48) return;
                setVendorProfilePageSize(n);
                vendorProfileOffset = 0;
                renderVendorAssetsGrid(vendorProfileListItems);
            });
        });
        var vpPrev = document.getElementById('vendorProfileListPrev');
        var vpNext = document.getElementById('vendorProfileListNext');
        if (vpPrev) {
            vpPrev.addEventListener('click', function () {
                vendorProfileOffset = Math.max(0, vendorProfileOffset - vendorProfilePageSize);
                renderVendorAssetsGrid(vendorProfileListItems);
            });
        }
        if (vpNext) {
            vpNext.addEventListener('click', function () {
                vendorProfileOffset += vendorProfilePageSize;
                renderVendorAssetsGrid(vendorProfileListItems);
            });
        }
    })();
    </script>
</body>
</html>
