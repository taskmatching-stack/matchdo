<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>材料組合 Material Combination - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <link href="../img/favicon.ico" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="/css/morandi-global.css?v=4" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config/auth-config.js"></script>
    <script>
    (function () {
        var p = new URLSearchParams(window.location.search);
        if (p.get('official_platform') === '1' || p.get('official_platform') === 'true') {
            window.__MATCHDO_OFFICIAL_PLATFORM_LIB = true;
            var origFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
                if (/\/api\/me\//.test(url) || /\/api\/admin\//.test(url)) {
                    var headers = new Headers(init.headers || (typeof input !== 'string' && input && input.headers ? input.headers : undefined));
                    if (!headers.has('X-Official-Platform-Library')) headers.set('X-Official-Platform-Library', '1');
                    if (typeof input === 'string') {
                        init = Object.assign({}, init, { headers: headers });
                    } else {
                        input = new Request(input, Object.assign({}, init, { headers: headers }));
                        init = undefined;
                    }
                }
                return origFetch.call(this, input, init);
            };
        }
        var ret = (p.get('return') || '').trim().toLowerCase();
        window.__MATCHDO_MATERIAL_COMBO_RETURN = ret === 'supplier' ? 'supplier' : (ret === 'design' ? 'design' : 'manufacturer');
    })();
    </script>
    <script src="/js/auth-middleware.js"></script>
    <style>
        .mdc-preview-wrap { max-width: 420px; margin: 0 auto; }
        .mdc-preview-wrap canvas, .mdc-preview-wrap img {
            width: 100%; aspect-ratio: 1; display: block; border-radius: 12px;
            border: 1px solid rgba(88, 100, 112, 0.18); background: #EAEEF3;
        }
        .mdc-step-card { border-radius: 12px; border: 1px solid rgba(88, 100, 112, 0.14); }
        .mdc-color-row input[type="color"] { width: 3rem; height: 2.25rem; padding: 0.15rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <div class="container-fluid page-title-bar py-3 border-bottom" style="background:#F0F3F7;border-color:rgba(88,100,112,0.14)!important;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 class="mb-0 fw-bold">材料組合 <span class="text-muted fw-normal fs-6">Material Combination</span></h4>
                </div>
                <a href="#" class="btn btn-sm btn-outline-secondary" id="mdc-back-link"><i class="bi bi-arrow-left me-1"></i>返回材料/顏色</a>
            </div>
        </div>
    </div>

    <div class="container py-4" style="max-width: 920px;">
        <div id="auth-alert" class="alert alert-warning d-none">請先 <a href="/index.html" class="alert-link">登入</a>。</div>
        <div id="no-mfr-alert" class="alert alert-warning d-none">您尚未建立廠商資料。<a href="/client/manufacturer-dashboard.html" class="alert-link">前往控制台</a></div>
        <div id="admin-official-hint" class="alert alert-info d-none">
            <i class="bi bi-info-circle me-2"></i>管理員編輯<strong>官方版型</strong>請從
            <a href="/client/manufacturer-materials.html?official_platform=1&manage=1" class="alert-link">官方版型庫</a>
            進入「材料/顏色」→「材料組合」（需帶 <code>official_platform=1</code>，勿用個人廠商入口）。
        </div>
        <div id="official-platform-banner" class="alert alert-info border mb-3 d-none" role="status">
            <i class="bi bi-collection me-2"></i><strong>官方版型庫（管理員）</strong> — 材料組合結果寫入 MATCHDO 官方版型材料庫。
        </div>
        <div id="upload-block-alert" class="alert alert-warning d-none"></div>

        <div id="main-content" class="d-none">
            <div class="card mdc-step-card shadow-sm mb-4">
                <div class="card-header bg-white fw-semibold">選色</div>
                <div class="card-body">
                    <div class="row g-3 align-items-end mb-3">
                        <div class="col-md-5">
                            <label class="form-label small mb-1">主色</label>
                            <div class="d-flex gap-2 mdc-color-row">
                                <input type="color" id="mdc-main-color" value="#3B82C4" aria-label="主色選色">
                                <input type="text" class="form-control form-control-sm" id="mdc-main-hex" value="#3B82C4" maxlength="7" placeholder="#RRGGBB">
                            </div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small mb-1">配色</label>
                            <div class="d-flex gap-2 mdc-color-row">
                                <input type="color" id="mdc-accent-color" value="#F5F0E8" aria-label="配色選色">
                                <input type="text" class="form-control form-control-sm" id="mdc-accent-hex" value="#F5F0E8" maxlength="7" placeholder="#RRGGBB">
                            </div>
                        </div>
                    </div>
                    <div class="mdc-preview-wrap mb-0">
                        <canvas id="mdc-swatch-canvas" width="1024" height="1024" aria-label="雙色色卡預覽"></canvas>
                    </div>
                </div>
            </div>

            <div class="card mdc-step-card shadow-sm mb-4">
                <div class="card-header bg-white fw-semibold">材質生成</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small mb-1">主色區材質 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="mdc-main-material" placeholder="例：編織布" maxlength="64">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small mb-1">配色區材質 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="mdc-accent-material" placeholder="例：粒面皮革" maxlength="64">
                        </div>
                        <div class="col-12">
                            <label class="form-label small mb-1">分界處（選填）</label>
                            <input type="text" class="form-control form-control-sm" id="mdc-boundary" placeholder="例：同色明線車縫" maxlength="64">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
                        <button type="button" class="btn btn-primary" id="mdc-generate-btn" disabled><i class="bi bi-stars me-1"></i>生成材質圖</button>
                        <span class="text-muted small" id="mdc-points-label"></span>
                    </div>
                    <div id="mdc-status" class="small mt-2 text-muted"></div>
                    <div id="mdc-result-wrap" class="mdc-preview-wrap mt-3 d-none">
                        <p class="small fw-semibold mb-1">生成結果</p>
                        <img id="mdc-result-img" alt="材質化結果" />
                        <div class="d-flex flex-wrap gap-2 mt-2">
                            <a href="#" class="btn btn-sm btn-outline-secondary d-none" id="mdc-download-btn" download="material-combination.jpg"><i class="bi bi-download me-1"></i>下載 JPG</a>
                            <button type="button" class="btn btn-sm btn-success d-none" id="mdc-add-pending-btn"><i class="bi bi-inbox me-1"></i>加入材料待傳清單</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/material-dual-color-compose.js?v=20260804c"></script>
    <script src="/js/material-dual-color-import.js?v=20260804c"></script>
    <script>
    (function () {
        window.__MATCHDO_DUAL_COLOR_BUILD = 'material-combo-library-save-status-20260805';
        var Compose = window.MatchdoMaterialDualColorCompose;
        var returnTarget = window.__MATCHDO_MATERIAL_COMBO_RETURN || 'manufacturer';
        var token = null;
        var pointsFlux = 5;
        var swatchBlob = null;
        var lastFluxResponse = null;
        var isAdmin = false;
        var hasManufacturer = false;
        var canUploadAssets = true;

        var mainColor = document.getElementById('mdc-main-color');
        var mainHex = document.getElementById('mdc-main-hex');
        var accentColor = document.getElementById('mdc-accent-color');
        var accentHex = document.getElementById('mdc-accent-hex');
        var swatchCanvas = document.getElementById('mdc-swatch-canvas');
        var mainMaterial = document.getElementById('mdc-main-material');
        var accentMaterial = document.getElementById('mdc-accent-material');
        var boundary = document.getElementById('mdc-boundary');
        var generateBtn = document.getElementById('mdc-generate-btn');
        var pointsLabel = document.getElementById('mdc-points-label');
        var statusEl = document.getElementById('mdc-status');
        var resultWrap = document.getElementById('mdc-result-wrap');
        var resultImg = document.getElementById('mdc-result-img');
        var downloadBtn = document.getElementById('mdc-download-btn');
        var addPendingBtn = document.getElementById('mdc-add-pending-btn');
        var backLink = document.getElementById('mdc-back-link');

        function materialsReturnHref() {
            if (returnTarget === 'design') return '/custom-product.html';
            if (returnTarget === 'supplier') return '/client/supplier-catalog-manage.html#tab-material-combo';
            var base = '/client/manufacturer-materials.html#tab-material-combo';
            if (window.__MATCHDO_OFFICIAL_PLATFORM_LIB) return base.replace('.html#', '.html?official_platform=1#');
            return base;
        }

        if (addPendingBtn && returnTarget === 'design') {
            addPendingBtn.innerHTML = '<i class="bi bi-pencil-square me-1"></i>加入設計材料槽';
        } else if (addPendingBtn && returnTarget !== 'supplier') {
            addPendingBtn.innerHTML = '<i class="bi bi-inbox me-1"></i>加入材料組合待傳';
        }

        if (backLink) backLink.href = materialsReturnHref();

        function authHeaders() {
            var h = { Accept: 'application/json' };
            if (token) h.Authorization = 'Bearer ' + token;
            return h;
        }

        function syncHexFromPicker(picker, hexInput) {
            hexInput.value = picker.value.toUpperCase();
        }

        function syncPickerFromHex(picker, hexInput) {
            var n = Compose.normalizeHex(hexInput.value);
            if (n) { hexInput.value = n; picker.value = n; return true; }
            return false;
        }

        function updateGenerateEnabled() {
            generateBtn.disabled = !(mainMaterial.value || '').trim() || !(accentMaterial.value || '').trim() || !swatchBlob;
        }

        async function refreshSwatch() {
            try {
                var canvas = Compose.composeDualColorSwatch(mainHex.value, accentHex.value);
                var ctx = swatchCanvas.getContext('2d');
                swatchCanvas.width = canvas.width;
                swatchCanvas.height = canvas.height;
                ctx.drawImage(canvas, 0, 0);
                swatchBlob = await Compose.canvasToBlob(canvas, 'image/jpeg', 0.92);
                updateGenerateEnabled();
            } catch (e) {
                swatchBlob = null;
                updateGenerateEnabled();
            }
        }

        function bindColorSync(picker, hexInput) {
            picker.addEventListener('input', function () { syncHexFromPicker(picker, hexInput); refreshSwatch(); });
            hexInput.addEventListener('change', function () { if (syncPickerFromHex(picker, hexInput)) refreshSwatch(); });
            hexInput.addEventListener('blur', function () { if (syncPickerFromHex(picker, hexInput)) refreshSwatch(); });
        }

        async function loadPricing() {
            try {
                var res = await fetch('/api/me/material-dual-color-pricing', { headers: authHeaders() });
                var d = await res.json().catch(function () { return {}; });
                if (res.ok && d.points_dual_color_flux != null) pointsFlux = d.points_dual_color_flux;
            } catch (e) {}
            pointsLabel.textContent = '成功後扣 ' + pointsFlux + ' 點';
        }

        async function getToken() {
            if (typeof AuthService === 'undefined') return token || null;
            try {
                var getter = AuthService.getSessionForApi || AuthService.getSession;
                var s = await getter.call(AuthService);
                var tok = (s && (s.access_token || (s.session && s.session.access_token))) || null;
                if (tok) { token = tok; return tok; }
                token = null;
                return null;
            } catch (e) { return null; }
        }

        async function initAuth() {
            var user = await AuthService.getCurrentUser();
            if (!user) { document.getElementById('auth-alert').classList.remove('d-none'); return; }
            if (!(await getToken())) { document.getElementById('auth-alert').classList.remove('d-none'); return; }

            try {
                var adminGate = await fetch('/api/admin/can-access', { headers: authHeaders(), cache: 'no-store' });
                isAdmin = adminGate.ok;
            } catch (_) { isAdmin = false; }

            var isOfficial = !!window.__MATCHDO_OFFICIAL_PLATFORM_LIB;

            if (isOfficial) {
                if (!isAdmin) {
                    document.getElementById('auth-alert').classList.remove('d-none');
                    document.getElementById('auth-alert').innerHTML = '請以<strong>管理員</strong>帳號登入後再使用官方版型材料組合。請先 <a href="/index.html" class="alert-link">登入</a>。';
                    return;
                }
                var offBanner = document.getElementById('official-platform-banner');
                if (offBanner) offBanner.classList.remove('d-none');
                var titleH4 = document.querySelector('.page-title-bar h4');
                if (titleH4) titleH4.innerHTML = '材料組合 <span class="text-muted fw-normal fs-6">Material Combination</span> <span class="badge bg-secondary ms-1">官方版型庫</span>';
            }

            if (returnTarget === 'supplier') {
                var supCap = await fetch('/api/me/capabilities', { headers: authHeaders() });
                var supCapData = await supCap.json().catch(function () { return {}; });
                if (!supCap.ok || !supCapData.industry_supplier_id) {
                    document.getElementById('no-mfr-alert').classList.remove('d-none');
                    document.getElementById('no-mfr-alert').innerHTML = '您尚未綁定產業供應商。<a href="/client/industry-supplier-dashboard.html" class="alert-link">前往供應商控制台</a>';
                    return;
                }
            } else if (!isOfficial && !isAdmin) {
                var mfrRes = await fetch('/api/me/manufacturer', { headers: authHeaders() });
                hasManufacturer = mfrRes.ok;
            } else if (isAdmin) {
                var adminMfrRes = await fetch('/api/me/manufacturer', { headers: authHeaders() });
                hasManufacturer = adminMfrRes.ok;
            } else {
                hasManufacturer = true;
            }

            var capRes = await fetch('/api/me/capabilities', { headers: authHeaders() });
            var cap = await capRes.json().catch(function () { return {}; });
            canUploadAssets = cap.can_upload_products_and_assets !== false || isOfficial || isAdmin;
            if (returnTarget === 'manufacturer' && !hasManufacturer && !isOfficial && !isAdmin) {
                var pendingHint = document.getElementById('upload-block-alert');
                pendingHint.textContent = '尚無廠商資料，仍可生成材質圖；若要加入材料待傳清單請先建立廠商資料。';
                pendingHint.classList.remove('d-none');
            } else if (returnTarget === 'manufacturer' && !canUploadAssets && !isOfficial && !isAdmin) {
                var uploadHint = document.getElementById('upload-block-alert');
                uploadHint.textContent = '仍可生成材質圖；加入材料待傳清單需付費方案。';
                uploadHint.classList.remove('d-none');
            }
            document.getElementById('main-content').classList.remove('d-none');
            await loadPricing();
            await refreshSwatch();
            updateGenerateEnabled();
        }

        generateBtn.addEventListener('click', async function () {
            if (!swatchBlob) return;
            var main = (mainMaterial.value || '').trim();
            var accent = (accentMaterial.value || '').trim();
            if (!main || !accent) return;
            var tok = await getToken();
            if (!tok) {
                statusEl.textContent = '登入已過期，請重新登入';
                statusEl.className = 'small mt-2 text-danger';
                return;
            }
            generateBtn.disabled = true;
            statusEl.textContent = '生成中，請稍候…';
            statusEl.className = 'small mt-2 text-muted';
            try {
                var fd = new FormData();
                fd.append('image', swatchBlob, 'material-combination-swatch.jpg');
                fd.append('main_material', main);
                fd.append('accent_material', accent);
                if ((boundary.value || '').trim()) fd.append('boundary', boundary.value.trim());
                fd.append('main_hex', mainHex.value || '');
                fd.append('accent_hex', accentHex.value || '');
                var res = await fetch('/api/me/vendor-assets/material-dual-color-flux', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + tok },
                    body: fd
                });
                var d = await res.json().catch(function () { return {}; });
                if (!res.ok) {
                    statusEl.textContent = d.error || '生成失敗';
                    statusEl.className = 'small mt-2 text-danger';
                    lastFluxResponse = null;
                    if (addPendingBtn) addPendingBtn.classList.add('d-none');
                    return;
                }
                lastFluxResponse = d;
                resultImg.src = d.preview_url || ('data:image/jpeg;base64,' + d.preview_base64);
                resultWrap.classList.remove('d-none');
                if (d.preview_url) {
                    downloadBtn.href = d.preview_url;
                    downloadBtn.classList.remove('d-none');
                } else if (d.preview_base64) {
                    downloadBtn.href = 'data:image/jpeg;base64,' + d.preview_base64;
                    downloadBtn.classList.remove('d-none');
                }
                var pts = d.points_deducted != null ? d.points_deducted : 0;
                var bal = d.balance_after != null ? '，剩餘 ' + d.balance_after + ' 點' : '';
                var baseMsg = '生成完成' + (pts ? '（已扣 ' + pts + ' 點' + bal + '）' : '');
                if (d.library_saved === false) {
                    if (d.library_save_error === 'table_missing') {
                        statusEl.textContent = baseMsg + '。尚未寫入數位資產庫：請先在 Supabase 執行 add-user-material-combo-generations.sql，再建表後重新生成。';
                    } else {
                        statusEl.textContent = baseMsg + '。尚未寫入數位資產庫（' + (d.library_save_error || '未知原因') + '）。';
                    }
                    statusEl.className = 'small mt-2 text-warning';
                } else {
                    statusEl.textContent = baseMsg + (d.library_saved ? '，已加入數位資產庫「材料組合」' : '');
                    statusEl.className = 'small mt-2 text-success';
                }
                if (addPendingBtn) {
                    var canPending = returnTarget === 'design'
                        || returnTarget === 'supplier'
                        || isOfficial
                        || isAdmin
                        || (hasManufacturer && canUploadAssets);
                    if (canPending) addPendingBtn.classList.remove('d-none');
                }
            } catch (e) {
                statusEl.textContent = '連線失敗，請稍後重試';
                statusEl.className = 'small mt-2 text-danger';
            } finally {
                updateGenerateEnabled();
            }
        });

        [mainMaterial, accentMaterial, boundary].forEach(function (el) {
            el.addEventListener('input', function () { updateGenerateEnabled(); });
        });

        bindColorSync(mainColor, mainHex);
        bindColorSync(accentColor, accentHex);

        if (addPendingBtn) {
            addPendingBtn.addEventListener('click', async function () {
                if (!lastFluxResponse || !window.MatchdoDualColorImport) return;
                addPendingBtn.disabled = true;
                statusEl.textContent = '正在加入待傳清單…';
                statusEl.className = 'small mt-2 text-muted';
                try {
                    var main = (mainMaterial.value || '').trim();
                    var accent = (accentMaterial.value || '').trim();
                    var fluxFile = await MatchdoDualColorImport.fluxFileFromApiResponse(lastFluxResponse, 'material-combination-flux.jpg');
                    var swatchFile = swatchBlob ? new File([swatchBlob], 'material-combination-swatch.jpg', { type: 'image/jpeg' }) : null;
                    await MatchdoDualColorImport.saveImport({
                        returnTarget: returnTarget,
                        mainMaterial: main,
                        accentMaterial: accent,
                        boundary: (boundary.value || '').trim(),
                        mainHex: mainHex.value,
                        accentHex: accentHex.value,
                        label: (main && accent) ? (main + '／' + accent) : '材料組合',
                        redrawChargedPts: lastFluxResponse.points_deducted || 0,
                        previewCreditTxId: lastFluxResponse.credit_transaction_id || null,
                        redrawPreviewStorageUrl: lastFluxResponse.preview_url || ''
                    }, swatchFile, fluxFile);
                    window.location.href = materialsReturnHref();
                } catch (e) {
                    statusEl.textContent = e.message || '加入待傳失敗';
                    statusEl.className = 'small mt-2 text-danger';
                    addPendingBtn.disabled = false;
                }
            });
        }

        initAuth();
    })();
    </script>
</body>
</html>
