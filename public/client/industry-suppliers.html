<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title data-i18n="industrySuppliers.pageTitle">產業供應商目錄 - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="../img/favicon.ico" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config/auth-config.js"></script>
    <script src="/js/auth-middleware.js"></script>
    <script src="/js/i18n.js"></script>
    <style>
        .supplier-card { border-radius: 12px; border: 1px solid #e9ecef; overflow: hidden; transition: box-shadow .15s; height: 100%; }
        .supplier-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
        .supplier-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #f0f0f0; }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <div class="container py-4" style="max-width: 960px;">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <div>
                <h4 class="fw-bold mb-1" data-i18n="industrySuppliers.heading">產業供應商目錄</h4>
                <p class="text-muted small mb-0" data-i18n="industrySuppliers.intro">瀏覽上游供應商的數位產品庫；選定後至「上傳數位版型」對應分頁匯入，即為您的參考圖／產品圖。需先上傳至少 1 件展示作品（管理員／測試員除外）。</p>
            </div>
            <a href="/client/manufacturer-materials.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i><span data-i18n="industrySuppliers.backBaseModels">上傳數位版型</span></a>
        </div>
        <div id="gate-alert" class="alert alert-warning d-none"></div>
        <div id="list-loading" class="text-muted small py-4" data-i18n="industrySuppliers.loading">載入中…</div>
        <div id="list-empty" class="alert alert-light border d-none small" data-i18n="industrySuppliers.empty">尚無產業供應商目錄。</div>
        <div id="supplier-grid" class="row g-3 d-none"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site-header.js"></script>
    <script>
    (function () {
        function tr(k, fb) {
            if (window.i18n && window.i18n.t) { var v = window.i18n.t(k); if (v && v !== k) return v; }
            return fb || k;
        }
        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        }
        async function getToken() {
            if (typeof AuthService === 'undefined') return null;
            try {
                var s = await AuthService.getSession();
                return (s && (s.access_token || (s.session && s.session.access_token))) || null;
            } catch (e) { return null; }
        }
        async function init() {
            await ((window.i18n && window.i18n.ready) ? window.i18n.ready : Promise.resolve());
            if (window.i18n && window.i18n.applyPage) window.i18n.applyPage();
            var token = await getToken();
            if (!token) {
                window.location.href = (typeof AuthService !== 'undefined' && AuthService.getLoginUrl)
                    ? AuthService.getLoginUrl(window.location.pathname) : '/login.html';
                return;
            }
            var gate = document.getElementById('gate-alert');
            var loading = document.getElementById('list-loading');
            var empty = document.getElementById('list-empty');
            var grid = document.getElementById('supplier-grid');
            try {
                var capR = await fetch('/api/me/capabilities', { headers: { Authorization: 'Bearer ' + token } });
                var cap = await capR.json().catch(function () { return {}; });
                if (!cap.has_manufacturer) {
                    gate.textContent = tr('baseModels.needManufacturerForImport', '請先建立廠商資料');
                    gate.classList.remove('d-none');
                    loading.classList.add('d-none');
                    return;
                }
                if ((cap.portfolio_count || 0) < 1 && !cap.bypass_supplier_portfolio_gate) {
                    gate.innerHTML = esc(tr('baseModels.portfolioRequired', '請先上傳至少 1 件作品')) +
                        ' <a href="/client/manufacturer-portfolio.html" class="alert-link">' + esc(tr('industrySuppliers.goPortfolio', '上傳展示案例')) + '</a>';
                    gate.classList.remove('d-none');
                    loading.classList.add('d-none');
                    return;
                }
                var r = await fetch('/api/me/industry-suppliers', { headers: { Authorization: 'Bearer ' + token } });
                var data = await r.json().catch(function () { return {}; });
                loading.classList.add('d-none');
                if (!r.ok) {
                    gate.textContent = data.error || tr('industrySuppliers.loadFailed', '載入失敗');
                    gate.classList.remove('d-none');
                    return;
                }
                var items = data.items || [];
                if (!items.length) {
                    empty.classList.remove('d-none');
                    return;
                }
                grid.classList.remove('d-none');
                grid.innerHTML = items.map(function (s) {
                    var img = s.preview_image_url
                        ? '<img src="' + esc(s.preview_image_url) + '" class="supplier-cover" alt="">'
                        : '<div class="supplier-cover d-flex align-items-center justify-content-center text-muted"><i class="bi bi-box-seam fs-1"></i></div>';
                    var countLabel = String(tr('industrySuppliers.itemCount', '{n} 項數位產品')).replace('{n}', String(s.catalog_item_count || 0));
                    var matUrl = '/client/manufacturer-materials.html?supplier_id=' + encodeURIComponent(s.id) + '&open_import=1#tab-material';
                    var protoUrl = '/client/manufacturer-materials.html?supplier_id=' + encodeURIComponent(s.id) + '&open_import=1#tab-prototype';
                    var partUrl = '/client/manufacturer-materials.html?supplier_id=' + encodeURIComponent(s.id) + '&open_import=1#tab-part';
                    return '<div class="col-md-6"><div class="card supplier-card">' + img +
                        '<div class="card-body p-3"><h6 class="fw-semibold mb-1">' + esc(s.name) + '</h6>' +
                        '<p class="small text-muted mb-2">' + esc(s.description || '') + '</p>' +
                        '<div class="text-muted small mb-2">' + esc(countLabel) + '</div>' +
                        '<div class="d-flex flex-wrap gap-1">' +
                        '<a href="' + matUrl + '" class="btn btn-success btn-sm">' + esc(tr('baseModels.tabMaterial', '材料參考')) + '</a>' +
                        '<a href="' + protoUrl + '" class="btn btn-outline-success btn-sm">' + esc(tr('baseModels.tabPrototype', '數位原型')) + '</a>' +
                        '<a href="' + partUrl + '" class="btn btn-outline-success btn-sm">' + esc(tr('baseModels.tabPart', '配件／零件')) + '</a>' +
                        '</div></div></div></div>';
                }).join('');
            } catch (e) {
                loading.classList.add('d-none');
                gate.textContent = e.message;
                gate.classList.remove('d-none');
            }
        }
        init();
    })();
    </script>
</body>
</html>
