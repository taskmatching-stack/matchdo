<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#7A8FA3" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="攝影模擬" />
  <link rel="canonical" href="/promo-camera-app" />
  <link rel="manifest" href="/promo-camera-app.webmanifest" />
  <link rel="apple-touch-icon" href="/img/matchdo-logo.png" />
  <title data-i18n="promoCamera.appPageTitle">攝影模擬 App - MATCHDO</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/morandi-global.css?v=4" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/image-lightbox.css" rel="stylesheet" />
  <link href="/css/promo-camera.css?v=20260731a" rel="stylesheet" />
  <link href="/css/promo-camera-presets.css?v=20260731a" rel="stylesheet" />
  <link href="/css/promo-camera-app.css?v=20260731w" rel="stylesheet" />
  <link href="/css/digital-asset-picker.css?v=1" rel="stylesheet" />
</head>
<body class="bg-light pc-app-shell">
  <header class="pc-app-topbar" aria-label="App 標題列">
    <div class="pc-app-topbar-inner">
      <div class="pc-app-brand">
        <img src="/img/matchdo-logo.png" alt="" class="pc-app-logo" width="32" height="32" decoding="async" />
        <div>
          <h1 class="pc-app-title mb-0" data-i18n="promoCamera.pageHeading">攝影模擬</h1>
          <p class="pc-app-subtitle mb-0" data-i18n="promoCamera.appSubtitle">產品情境・相機光學模擬</p>
        </div>
      </div>
      <div class="pc-app-topbar-actions">
        <div class="pc-app-lang-switch" role="navigation" aria-label="Language" data-i18n-aria-label="promoCamera.appLangSwitch">
          <a href="#" class="pc-app-lang-link" data-lang="zh-TW" data-i18n="nav.langZh">中文</a>
          <span class="pc-app-lang-sep" aria-hidden="true">|</span>
          <a href="#" class="pc-app-lang-link" data-lang="en" data-i18n="nav.langEn">EN</a>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary pc-app-credits-btn" id="pcAppCreditsBtn" aria-haspopup="dialog" aria-controls="pcCreditsModal">
          <i class="bi bi-currency-exchange"></i>
          <span data-i18n="nav.myCredits">我的點數</span>
          <span class="pc-app-credits-badge d-none" id="pcAppCreditsBadge" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <div id="promo-camera-app" class="container pc-app-container">
    <p class="text-muted small pc-app-pricing" id="pcPricingIntro" data-i18n="promoCamera.pricingLoading">載入點數規則中…</p>
    <div class="pc-preset-bar pc-app-preset-bar mb-2">
      <button type="button" class="btn btn-sm btn-outline-secondary pc-app-preset-btn" id="pcPresetOpenBtn">
        <i class="bi bi-sliders"></i> <span data-i18n="promoCamera.presetManage">攝影參數</span>
      </button>
    </div>

    <div class="pc-layout">
      <section class="pc-chat-panel" aria-label="對話區">
        <div id="pcChatMessages" class="pc-chat-messages"></div>
        <div class="pc-chat-compose pc-app-compose">
          <div class="pc-app-source-fixed">
            <div class="pc-app-block">
              <div class="pc-app-block-title pc-app-block-title--prominent" data-i18n="promoCamera.appSectionSource">產品圖</div>
              <div class="pc-app-card">
                <div class="pc-app-thumb-slot">
                  <div id="pcSelectedThumbs" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div class="pc-app-split-actions">
                  <label class="pc-app-action pc-app-action--upload mb-0">
                    <i class="bi bi-upload"></i>
                    <span data-i18n="promoCamera.uploadImage">上傳圖片</span>
                    <input type="file" id="pcUploadInput" accept="image/*" hidden />
                  </label>
                  <button type="button" class="pc-app-action pc-app-action--pick" id="pcPickAssetBtn">
                    <i class="bi bi-images"></i>
                    <span data-i18n="promoCamera.pickAsset">從數位資產選擇</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div id="pcResultArea" class="pc-result-slot pc-app-result d-none" aria-label="生成結果"></div>

          <button type="button" class="pc-compose-toggle" id="pcComposeToggle" aria-expanded="false">
            <span class="pc-compose-toggle-label" data-i18n="promoCamera.composeToggleLabel">情境與輸出設定</span>
            <span class="pc-compose-summary text-muted" id="pcComposeSummary"></span>
            <i class="bi bi-chevron-down pc-compose-toggle-icon" aria-hidden="true"></i>
          </button>
          <div class="pc-compose-body is-collapsed" id="pcComposeBody">

          <div class="pc-app-block">
            <div class="pc-app-block-title" data-i18n="promoCamera.appSectionScene">情境</div>
            <div class="pc-app-card pc-app-card--list">
              <div class="pc-app-row pc-app-row--picker">
                <label class="pc-app-row-label" for="pcThemeSelect" data-i18n="promoCamera.theme">主題</label>
                <button type="button" class="pc-app-picker-btn" id="pcThemePickerBtn" aria-haspopup="dialog" aria-controls="pcAppPickerModal">
                  <span class="pc-app-picker-value" id="pcThemePickerLabel">—</span>
                  <i class="bi bi-chevron-right pc-app-picker-chevron" aria-hidden="true"></i>
                </button>
                <select id="pcThemeSelect" class="pc-app-select-native d-none" tabindex="-1" aria-hidden="true"></select>
              </div>
              <div class="pc-app-row pc-app-row--picker">
                <label class="pc-app-row-label" for="pcSceneSelect" data-i18n="promoCamera.sceneOptional">場景（選填）</label>
                <button type="button" class="pc-app-picker-btn" id="pcScenePickerBtn" aria-haspopup="dialog" aria-controls="pcAppPickerModal">
                  <span class="pc-app-picker-value" id="pcScenePickerLabel" data-i18n="promoCamera.sceneNone">（不選）</span>
                  <i class="bi bi-chevron-right pc-app-picker-chevron" aria-hidden="true"></i>
                </button>
                <select id="pcSceneSelect" class="pc-app-select-native d-none" tabindex="-1" aria-hidden="true"></select>
              </div>
            </div>
          </div>

          <div class="pc-app-block">
            <div class="pc-app-block-title" data-i18n="promoCamera.appSectionOutput">輸出尺寸</div>
            <div class="pc-app-card pc-app-card--list">
              <div class="pc-app-row pc-app-row--stack">
                <div class="pc-app-row-head">
                  <label class="pc-app-row-label mb-0" for="pcRatioSelect" data-i18n="promoCamera.aspectRatio">長寬比</label>
                </div>
                <div id="pcRatioChips" class="pc-app-chip-grid" role="group" aria-label="長寬比"></div>
                <select id="pcRatioSelect" class="pc-app-select-native d-none" tabindex="-1" aria-hidden="true">
                  <option value="1:1" selected>1:1</option>
                  <option value="4:3">4:3</option>
                  <option value="3:4">3:4</option>
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="21:9">21:9</option>
                  <option value="3:1">3:1</option>
                  <option value="4:1">4:1</option>
                  <option value="9:21">9:21</option>
                  <option value="1:3">1:3</option>
                  <option value="1:4">1:4</option>
                </select>
              </div>
              <div class="pc-app-row pc-app-row--stack">
                <div class="pc-app-row-head">
                  <label class="pc-app-row-label mb-0" for="pcMpSelect" data-i18n="promoCamera.resolution">解析度</label>
                  <span class="pc-app-row-meta" id="pcDimsHint">1024×1024</span>
                </div>
                <div id="pcMpChips" class="pc-app-chip-grid" role="group" aria-label="解析度"></div>
                <select id="pcMpSelect" class="pc-app-select-native d-none" tabindex="-1" aria-hidden="true">
                  <option value="1" selected>1 MP</option>
                  <option value="2">2 MP</option>
                  <option value="3">3 MP</option>
                  <option value="4">4 MP</option>
                </select>
              </div>
            </div>
          </div>

          <div class="pc-app-block">
            <div class="pc-app-block-title" data-i18n="promoCamera.appSectionAngle">拍攝角度</div>
            <div class="pc-app-card pc-app-card--pad">
              <div id="pcAngleBtns" class="pc-app-chip-grid"></div>
              <p class="pc-app-hint mb-0" id="pcAngleHint" data-i18n="promoCamera.angleHintDefault">請點上方按鈕換角度</p>
            </div>
          </div>

          <div class="pc-app-block">
            <div class="pc-app-block-title" data-i18n="promoCamera.appSectionPrompt">描述</div>
            <div class="pc-app-card pc-app-card--pad">
              <textarea id="pcPromptInput" class="pc-app-textarea scene-sim-prompt-input" rows="3" data-i18n-placeholder="promoCamera.descriptionPlaceholder" placeholder="例：皮革手提包，溫暖午後陽光、柔和陰影"></textarea>
              <p class="pc-app-hint mb-0" data-i18n="promoCamera.descriptionHint">請先寫產品名稱，再寫情境描述；參考圖較複雜時可避免 AI 誤判品項。</p>
            </div>
          </div>

          </div><!-- /pcComposeBody -->

          <div class="d-none pc-compose-generate-fallback">
            <button type="button" class="btn btn-primary" id="pcGenerateBtn" disabled><i class="bi bi-camera"></i> <span data-i18n="promoCamera.generateBtn">生成</span></button>
            <span class="text-muted small" id="pcPointsDisplay">預估 20 點</span>
          </div>
        </div>
      </section>

      <aside class="pc-camera-shell" aria-label="攝影模擬控制台">
        <div class="pc-camera-device is-lcd-on">
          <img id="pcCameraBody" class="pc-camera-body-img" src="/img/cam-lcd-on.png" alt="" width="1000" height="667" decoding="async" />
          <div class="pc-camera-lcd-wrap" aria-hidden="false">
            <div class="pc-lcd" id="pcLcd" aria-live="polite">
              <div class="pc-lcd-line pc-lcd-look">—</div>
              <div class="pc-lcd-line pc-lcd-lens">—</div>
              <div class="pc-lcd-line pc-lcd-angle">—</div>
              <div class="pc-lcd-line pc-lcd-optics">— · —</div>
              <div class="pc-lcd-line pc-lcd-blades">—</div>
            </div>
          </div>
        </div>

        <div class="pc-camera-controls pc-app-cam-controls">
          <div class="pc-app-cam-block">
            <div class="pc-app-cam-block-title" id="pcLookGroupLabel" data-i18n="promoCamera.lookGroup">成像來源</div>
            <div class="pc-app-cam-segment btn-group w-100 mb-2" role="group" aria-label="成像來源">
              <input type="radio" class="btn-check" name="pcLookMode" id="pcLookDigital" value="digital" checked>
              <label class="btn btn-outline-light" for="pcLookDigital" id="pcLookDigitalLabel" data-i18n="promoCamera.cat.camera_brand">品牌色彩</label>
              <input type="radio" class="btn-check" name="pcLookMode" id="pcLookFilm" value="film">
              <label class="btn btn-outline-light" for="pcLookFilm" id="pcLookFilmLabel" data-i18n="promoCamera.cat.film_simulation">底片模擬</label>
            </div>
            <div class="pc-app-cam-row">
              <select id="pcCam_look" class="pc-app-cam-select"></select>
            </div>
            <p class="pc-app-cam-hint mb-0" id="pcLookHint"></p>
          </div>
          <div class="pc-app-cam-block">
            <div class="pc-app-cam-block-title" id="pcLensLabel" data-i18n="promoCamera.cat.lens">鏡頭</div>
            <div class="pc-app-cam-row">
              <select id="pcCam_lens" class="pc-app-cam-select"></select>
            </div>
            <p class="pc-app-cam-hint mb-0" id="pcLensHint"></p>
          </div>
          <div class="pc-app-cam-block pc-app-cam-block--grid">
            <div class="pc-app-cam-row">
              <label class="pc-app-cam-mini-label" for="pcCam_aperture" data-i18n="promoCamera.aperture">光圈</label>
              <select id="pcCam_aperture" class="pc-app-cam-select"></select>
            </div>
            <div class="pc-app-cam-row">
              <label class="pc-app-cam-mini-label" for="pcCam_exposure_ev">EV</label>
              <select id="pcCam_exposure_ev" class="pc-app-cam-select"></select>
            </div>
          </div>
          <div class="pc-app-cam-block">
            <div class="pc-app-cam-block-title" data-i18n="promoCamera.apertureBlades">光圈葉片</div>
            <div class="pc-app-cam-row">
              <select id="pcCam_aperture_blades" class="pc-app-cam-select"></select>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <footer class="pc-app-footnote text-muted small">
      <span data-i18n="promoCamera.appFootnote">獨立 App 介面 · 與 MatchDO 設計頁共用同一組生圖 API</span>
    </footer>
  </div>

  <div class="modal fade" id="pcAppPickerModal" tabindex="-1" aria-labelledby="pcAppPickerTitle" aria-hidden="true">
    <div class="modal-dialog pc-app-picker-dialog">
      <div class="modal-content pc-app-picker-modal">
        <div class="modal-header py-3">
          <h6 class="modal-title mb-0" id="pcAppPickerTitle"></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria-label="home.close" aria-label="關閉"></button>
        </div>
        <div class="modal-body p-0 d-flex flex-column flex-grow-1 overflow-hidden">
          <div id="pcAppPickerList" class="pc-app-picker-list flex-grow-1" role="listbox"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="pcCreditsModal" tabindex="-1" aria-labelledby="pcCreditsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content pc-app-credits-modal">
        <div class="modal-header py-2">
          <h6 class="modal-title mb-0" id="pcCreditsModalTitle" data-i18n="promoCamera.appCreditsTitle">我的點數</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria-label="home.close" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <div id="pcCreditsLoading" class="text-muted small" data-i18n="home.loading">載入中…</div>
          <div id="pcCreditsGuest" class="d-none">
            <p class="small mb-2" data-i18n="promoCamera.appCreditsLoginHint">請先登入以查看點數餘額。</p>
            <a href="/login.html?returnUrl=%2Fpromo-camera-app" class="btn btn-primary btn-sm" id="pcCreditsLoginLink" data-i18n="credits.loginRequiredLink">登入</a>
          </div>
          <div id="pcCreditsPanel" class="d-none">
            <div class="pc-app-credits-balance-wrap">
              <div class="pc-app-credits-balance-label" data-i18n="credits.currentBalance">目前餘額</div>
              <div class="pc-app-credits-balance" id="pcCreditsBalance">0</div>
              <div class="pc-app-credits-meta small text-muted">
                <span data-i18n="credits.totalEarned">累計獲得</span> <span id="pcCreditsEarned">0</span>
                ·
                <span data-i18n="credits.totalSpent">累計消費</span> <span id="pcCreditsSpent">0</span>
              </div>
            </div>
            <p class="small text-muted mb-3" data-i18n="promoCamera.appCreditsTopUpHint">儲值將在新分頁開啟，不會離開攝影模擬 App。</p>
            <button type="button" class="btn btn-primary w-100" id="pcCreditsTopUpBtn" data-i18n="promoCamera.appCreditsTopUpBtn">前往儲值</button>
          </div>
          <p id="pcCreditsError" class="text-danger small mb-0 d-none"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="pcAssetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title" data-i18n="promoCamera.assetModalTitle">從數位資產選擇</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria-label="home.close" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <div id="pcAssetPickerTabs" class="dap-tabs" role="tablist" aria-label="數位資產分類"></div>
          <div id="pcAssetLoading" class="text-muted small" data-i18n="home.loading">載入中…</div>
          <p id="pcAssetEmpty" class="text-muted small d-none mb-0"></p>
          <div id="pcAssetList" class="row g-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/auth-middleware.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/matchdo-promo-image.js?v=20260731v"></script>
  <script src="/js/digital-asset-picker.js?v=1"></script>
  <script src="/js/image-lightbox.js?v=20260731v"></script>
  <script src="/js/promo-camera/api.js?v=20260731d"></script>
  <script src="/js/promo-camera/state.js?v=20260731d"></script>
  <script src="/js/promo-camera/index.js?v=20260731d"></script>
  <script src="/js/promo-camera/presets.js?v=20260731b"></script>
  <script src="/js/promo-camera/app-shell.js?v=20260731w"></script>
  <script>
    function pcAppApplyI18n() {
      if (!window.i18n) return;
      var lang = window.i18n.getLang ? window.i18n.getLang() : 'zh-TW';
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
      if (window.i18n.applyPage) window.i18n.applyPage();
      document.dispatchEvent(new CustomEvent('matchdo-i18n-applied'));
    }
    if (window.i18n && window.i18n.ready) {
      window.i18n.ready.then(pcAppApplyI18n);
    }
  </script>
</body>
</html>
