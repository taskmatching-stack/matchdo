<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="掌控你的影像風格" data-i18n-content="promoCamera.tagline" />
  <link rel="canonical" href="/promo-camera" />
  <title data-i18n="promoCamera.pageTitle">商攝導演 - MATCHDO</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/image-lightbox.css" rel="stylesheet" />
  <link href="/css/promo-camera.css?v=20260803a" rel="stylesheet" />
  <link href="/css/promo-camera-presets.css?v=20260803a" rel="stylesheet" />
  <link href="/css/digital-asset-picker.css?v=1" rel="stylesheet" />
</head>
<body class="bg-light">
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  if (p.get('embed') === 'design') {
    document.body.classList.add('pc-embed-design');
    var robots = document.querySelector('meta[name="robots"]');
    if (robots) robots.setAttribute('content', 'noindex, follow');
  }
})();
</script>
  <div id="site-header"></div>
  <div id="promo-camera-app" class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 pc-page-toolbar">
      <div class="pc-page-head">
        <a id="pcBackLink" href="/custom-product.html?tab=promo-image" class="btn btn-sm btn-outline-secondary pc-back-link"><i class="bi bi-arrow-left"></i> <span id="pcBackLabel" data-i18n="promoCamera.backToScene">返回情境圖</span></a>
        <h4 class="d-inline-block mb-0 align-middle" data-i18n="promoCamera.pageHeading">商攝導演</h4>
        <p class="pc-tagline pc-tagline--standalone mb-0 mt-1" data-i18n="promoCamera.tagline">掌控你的影像風格</p>
      </div>
    </div>
    <p class="pc-tagline pc-tagline--embed mb-2" data-i18n="promoCamera.tagline">掌控你的影像風格</p>
    <p class="text-muted small" id="pcPricingIntro" data-i18n="promoCamera.pricingLoading">載入點數規則中…</p>
    <div class="pc-layout">
      <section class="pc-chat-panel" aria-label="對話區">
        <div id="pcChatMessages" class="pc-chat-messages"></div>
        <div id="pcResultArea" class="pc-result-slot d-none" aria-label="生成結果"></div>
        <div class="pc-chat-compose">
          <div class="pc-settings-card mb-2">
            <button type="button" class="pc-settings-row pc-settings-row--action" id="pcPresetOpenBtn">
              <span class="pc-settings-row-label">
                <i class="bi bi-sliders" aria-hidden="true"></i>
                <span data-i18n="promoCamera.presetManage">攝影參數</span>
              </span>
              <i class="bi bi-chevron-right pc-settings-chevron" aria-hidden="true"></i>
            </button>
            <div class="pc-settings-row pc-settings-row--select">
              <label class="pc-settings-field-label" for="pcPreserveSubjects" data-i18n="promoCamera.preserveSubjectsLabel">人物／動物</label>
              <select id="pcPreserveSubjects" class="pc-settings-inline-select" aria-describedby="pcPreserveSubjectsHint">
                <option value="keep" data-i18n="promoCamera.preserveSubjectsKeep">保留</option>
                <option value="exclude" data-i18n="promoCamera.preserveSubjectsExclude">不含</option>
                <option value="prompt" data-i18n="promoCamera.preserveSubjectsPrompt">依提示詞</option>
              </select>
            </div>
          </div>
          <div id="pcSelectedThumbs" class="d-flex flex-wrap gap-2 mb-2"></div>
          <div class="d-flex flex-wrap gap-2 mb-2">
            <label class="btn btn-sm btn-outline-secondary mb-0">
              <i class="bi bi-upload"></i> <span data-i18n="promoCamera.uploadImage">上傳圖片</span>
              <input type="file" id="pcUploadInput" accept="image/*" hidden />
            </label>
            <button type="button" class="btn btn-sm btn-outline-primary" id="pcPickAssetBtn"><i class="bi bi-images"></i> <span data-i18n="promoCamera.pickAsset">從數位資產選擇</span></button>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small mb-0" for="pcThemeSelect" data-i18n="promoCamera.theme">主題</label>
              <select id="pcThemeSelect" class="form-select form-select-sm"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-0" for="pcSceneSelect" data-i18n="promoCamera.sceneOptional">場景（選填）</label>
              <select id="pcSceneSelect" class="form-select form-select-sm"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label small mb-0" for="pcRatioSelect" data-i18n="promoCamera.aspectRatio">長寬比</label>
              <select id="pcRatioSelect" class="form-select form-select-sm">
                <option value="1:1" selected>1:1</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="21:9">21:9</option>
                <option value="3:1">3:1</option>
                <option value="4:1">4:1</option>
                <option value="9:21">9:21</option>
                <option value="1:3">1:3</option>
                <option value="1:4">1:4</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small mb-0" for="pcMpSelect" data-i18n="promoCamera.resolution">解析度</label>
              <select id="pcMpSelect" class="form-select form-select-sm">
                <option value="1" selected>1 MP</option>
                <option value="2">2 MP</option>
                <option value="3">3 MP</option>
                <option value="4">4 MP</option>
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <p class="form-text small mb-1" id="pcDimsHint">1024×1024</p>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small mb-1" data-i18n="promoCamera.shootingAngle">拍攝角度</label>
            <div id="pcAngleBtns" class="d-flex flex-wrap gap-1"></div>
            <p class="form-text small text-muted mb-0 mt-1" id="pcAngleHint" data-i18n="promoCamera.angleHintDefault">請點上方按鈕換角度</p>
          </div>
          <div class="mb-2">
            <label class="form-label small mb-1" for="pcPromptInput" data-i18n="promoCamera.description">描述</label>
            <textarea id="pcPromptInput" class="form-control form-control-sm scene-sim-prompt-input" rows="2" data-i18n-placeholder="promoCamera.descriptionPlaceholder" placeholder="例：皮革手提包，溫暖午後陽光、柔和陰影"></textarea>
            <p class="form-text small text-muted mb-0 mt-1" data-i18n="promoCamera.descriptionHint">請先寫產品名稱，再寫情境描述；參考圖較複雜時可避免誤判品項。</p>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <button type="button" class="btn btn-primary" id="pcGenerateBtn" disabled><i class="bi bi-camera"></i> <span data-i18n="promoCamera.generateBtn">生成</span></button>
            <span class="text-muted small" id="pcPointsDisplay">預估 20 點</span>
          </div>
          <div class="form-check form-switch mt-2 mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="pcShowOnHomepage" checked disabled>
            <label class="form-check-label small" for="pcShowOnHomepage" data-i18n="customProduct.showOnHomepage">展示在首頁媒體牆</label>
          </div>
          <p class="form-text small text-muted mb-0 mt-1" id="pcShowOnHomepageHint" data-i18n="customProduct.freeUserShowHint">免費用戶預設展示在首頁，無法取消</p>
        </div>
      </section>

      <aside class="pc-camera-shell" aria-label="商攝導演控制台">
        <div class="pc-camera-device is-lcd-on">
          <img id="pcCameraBody" class="pc-camera-body-img" src="/img/cam-lcd-on.png" alt="" width="1000" height="667" decoding="async" />
          <div class="pc-camera-lcd-wrap" aria-hidden="false">
            <div class="pc-lcd" id="pcLcd" aria-live="polite">
              <div class="pc-lcd-line pc-lcd-look">—</div>
              <div class="pc-lcd-line pc-lcd-lens">—</div>
              <div class="pc-lcd-line pc-lcd-angle">—</div>
              <div class="pc-lcd-line pc-lcd-optics">— · —</div>
              <div class="pc-lcd-line pc-lcd-blades">—</div>
            </div>
          </div>
        </div>

        <div class="pc-camera-controls">
          <div class="mb-2">
            <span class="pc-control-label" id="pcLookGroupLabel" data-i18n="promoCamera.lookGroup">成像來源</span>
            <div class="btn-group pc-look-segment pc-app-cam-segment w-100 mb-1" role="group" aria-label="成像來源">
              <input type="radio" class="btn-check" name="pcLookMode" id="pcLookDigital" value="digital" checked>
              <label class="btn btn-outline-light" for="pcLookDigital" id="pcLookDigitalLabel" data-i18n="promoCamera.cat.camera_brand">品牌色彩</label>
              <input type="radio" class="btn-check" name="pcLookMode" id="pcLookFilm" value="film">
              <label class="btn btn-outline-light" for="pcLookFilm" id="pcLookFilmLabel" data-i18n="promoCamera.cat.film_simulation">底片模擬</label>
            </div>
            <select id="pcCam_look" class="form-select form-select-sm"></select>
            <p class="form-text small text-secondary mb-0 mt-1" id="pcLookHint"></p>
          </div>
          <div class="mb-2">
            <label for="pcCam_lens" id="pcLensLabel">鏡頭</label>
            <select id="pcCam_lens" class="form-select form-select-sm"></select>
            <p class="form-text small text-secondary mb-0 mt-1" id="pcLensHint"></p>
          </div>
          <div class="pc-settings-row mb-2">
            <div>
              <label for="pcCam_aperture" data-i18n="promoCamera.aperture">光圈</label>
              <select id="pcCam_aperture" class="form-select form-select-sm"></select>
            </div>
            <div>
              <label for="pcCam_exposure_ev">EV</label>
              <select id="pcCam_exposure_ev" class="form-select form-select-sm"></select>
            </div>
          </div>
          <div class="mb-0">
            <label for="pcCam_aperture_blades" data-i18n="promoCamera.apertureBlades">光圈葉片</label>
            <select id="pcCam_aperture_blades" class="form-select form-select-sm"></select>
          </div>
        </div>
      </aside>
    </div>
    <p class="pc-build-tag mb-0 mt-2" aria-hidden="true">build: <span id="pcBuildTag"></span></p>
  </div>

  <div class="modal fade" id="pcAssetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title" data-i18n="promoCamera.assetModalTitle">從數位資產選擇</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="pcAssetPickerTabs" class="dap-tabs" role="tablist" aria-label="數位資產分類"></div>
          <div id="pcAssetLoading" class="text-muted small" data-i18n="home.loading">載入中…</div>
          <p id="pcAssetEmpty" class="text-muted small d-none mb-0"></p>
          <div id="pcAssetList" class="row g-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/auth-config.js"></script>
  <script src="/js/auth-middleware.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/site-header.js"></script>
  <script src="/js/matchdo-promo-image.js?v=20260731v"></script>
  <script src="/js/digital-asset-picker.js?v=1"></script>
  <script src="/js/image-lightbox.js?v=20260731v"></script>
  <script src="/js/promo-camera/api.js?v=20260731d"></script>
  <script src="/js/promo-camera/state.js?v=20260801b"></script>
  <script src="/js/show-on-homepage-control.js?v=20260803a"></script>
  <script src="/js/promo-camera/index.js?v=20260803a"></script>
  <script src="/js/promo-camera/presets.js?v=20260731b"></script>
  <script src="/js/site-footer.js"></script>
</body>
</html>
