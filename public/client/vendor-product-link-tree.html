<body class="vplt-page vplt-page--vendor" data-vplt-mode="vendor">
    <script>
    (function () {
        var p = new URLSearchParams(window.location.search);
        if (p.get('official_platform') === '1' || p.get('official_platform') === 'true') {
            window.__MATCHDO_OFFICIAL_PLATFORM_LIB = true;
            var origFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
                if (/\/api\/me\//.test(url) || /\/api\/admin\//.test(url)) {
                    var headers = new Headers(init.headers || (typeof input !== 'string' && input && input.headers ? input.headers : undefined));
                    if (!headers.has('X-Official-Platform-Library')) headers.set('X-Official-Platform-Library', '1');
                    if (typeof input === 'string') {
                        init = Object.assign({}, init, { headers: headers });
                    } else {
                        input = new Request(input, Object.assign({}, init, { headers: headers }));
                        init = undefined;
                    }
                }
                return origFetch.call(this, input, init);
            };
        }
    })();
    </script>
    <div id="site-header"></div>
    <div class="container-fluid page-title-bar py-3 bg-light border-bottom">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                    <h1 class="h4 mb-0 fw-bold" data-i18n="productTree.vendorTitle">產品關聯圖</h1>
                    <p class="text-muted small mb-0" data-i18n="productTree.vendorIntro">與「看可搭配」相同版面：主產品、配件、材料分區；有關聯才顯示該區。右側未關聯素材可拖曳加入。</p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a href="/client/manufacturer-materials.html" class="btn btn-sm btn-outline-secondary" id="vplt-back-materials"><i class="bi bi-arrow-left me-1"></i><span data-i18n="productTree.backMaterials">返回素材庫</span></a>
                    <a href="#" class="btn btn-sm btn-outline-primary d-none" id="btn-export-pdf"><i class="bi bi-file-earmark-pdf me-1"></i><span data-i18n="productTree.exportPdf">下載 PDF</span></a>
                    <button type="button" class="btn btn-sm btn-primary" id="btn-save-links" disabled><i class="bi bi-check-lg me-1"></i><span data-i18n="productTree.save">儲存關聯</span></button>
                </div>
            </div>
        </div>
    </div>
    <div class="container py-3">
        <div id="auth-alert" class="alert alert-warning d-none">請先 <a href="/index.html">登入</a>。</div>

        <div id="vplt-app" class="vplt-layout d-none">

            </aside>
            <main class="vplt-canvas-wrap">
                <div id="vplt-canvas" class="vplt-canvas"></div>
            </main>
            <aside class="vplt-sidebar vplt-sidebar--side" id="vplt-side-panel">
                <h2 class="h6 text-muted mb-2" data-i18n="productTree.quickCheck">快速檢查</h2>
                <div id="vplt-checks" class="small mb-3"></div>
                <h2 class="h6 text-muted mb-2" data-i18n="productTree.orphanPool">未關聯素材</h2>
                <p class="text-muted small" data-i18n="productTree.orphanHint">點擊加入目前主產品，或拖曳至中央主產品節點。</p>
                <div id="vplt-orphan-pool" class="vplt-orphan-pool"></div>
            </aside>
        </div>
        <div id="vplt-loading" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>載入中…</div>
    </div>
