<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title data-i18n="supplierPortal.pageTitle">產業供應商說明 - MatchDO 合做</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="index, follow">
    <link href="../img/favicon.ico" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config/auth-config.js"></script>
    <script src="/js/auth-middleware.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div id="site-header"></div>
    <div class="container py-4" style="max-width: 720px;">
        <h4 class="fw-bold mb-2" data-i18n="supplierPortal.heading">產業供應商（B 線）</h4>
        <p class="text-muted small mb-4" data-i18n="supplierPortal.introShort">同一組登入即可使用。接單製造商在下方目錄瀏覽上游材料並匯入；匯入後會出現在您的素材庫，訂製者看不到上游目錄本身。</p>

        <div id="login-banner" class="alert alert-primary d-none mb-3">
            <span data-i18n="supplierPortal.pleaseLogin">請先登入以使用下方功能。</span>
            <a href="/login.html" id="login-link" class="btn btn-primary btn-sm ms-2" data-i18n="nav.login">登入</a>
        </div>
        <div id="user-banner" class="alert alert-light border small d-none mb-3">
            <span data-i18n="supplierPortal.loggedInAs">已登入：</span> <span id="user-email" class="fw-medium"></span>
        </div>

        <div class="card border-0 shadow-sm border-start border-success border-4 mb-3">
            <div class="card-body">
                <h6 class="fw-semibold mb-2"><i class="bi bi-grid me-2 text-success"></i><span data-i18n="supplierPortal.cardManufacturer">瀏覽並匯入上游材料</span></h6>
                <p class="small text-muted mb-3" data-i18n="supplierPortal.cardManufacturerBody">從產業供應商目錄選品匯入到自家素材；可在「供應商引用管理」查看已匯入清單。</p>
                <div class="d-flex flex-wrap gap-2">
                    <a href="/client/industry-suppliers.html" class="btn btn-success btn-sm"><i class="bi bi-grid me-1"></i><span data-i18n="nav.industrySuppliersList">產業供應商目錄</span></a>
                    <a href="/client/my-supplier-references.html" class="btn btn-outline-success btn-sm"><i class="bi bi-list-check me-1"></i><span data-i18n="nav.mySupplierReferences">供應商引用管理</span></a>
                    <a href="/client/manufacturer-dashboard.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-speedometer2 me-1"></i><span data-i18n="supplierPortal.goMfrDashboard">製造商控制台</span></a>
                </div>
            </div>
        </div>

        <p class="small text-muted mb-0" data-i18n="supplierPortal.upstreamNote">上游供應商公司的產品上架由平台代管；若需協助請聯絡 MatchDO。</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site-header.js"></script>
    <script>
    (function () {
        async function init() {
            await ((window.i18n && window.i18n.ready) ? window.i18n.ready : Promise.resolve());
            if (window.i18n && window.i18n.applyPage) window.i18n.applyPage();
            var loginBanner = document.getElementById('login-banner');
            var userBanner = document.getElementById('user-banner');
            var loginLink = document.getElementById('login-link');
            if (loginLink) loginLink.href = '/login.html?returnUrl=' + encodeURIComponent('/client/supplier-portal.html');
            if (typeof AuthService !== 'undefined') {
                try {
                    var s = await AuthService.getSession();
                    var token = (s && (s.access_token || (s.session && s.session.access_token))) || null;
                    var user = s && (s.user || (s.session && s.session.user));
                    if (token && user) {
                        userBanner.classList.remove('d-none');
                        document.getElementById('user-email').textContent = user.email || user.id || '—';
                    } else loginBanner.classList.remove('d-none');
                } catch (e) { loginBanner.classList.remove('d-none'); }
            } else loginBanner.classList.remove('d-none');
        }
        init();
    })();
    </script>
</body>
</html>
